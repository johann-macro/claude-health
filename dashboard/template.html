// Einsicht: nennt die Größe, die am weitesten von ihrem Normalwert abweicht,
// und leitet daraus die Empfehlung für den Tag ab. Beides steht schon oben -
// hier wird nichts hinzuerfunden.
function erholEinsicht(d, zeilen){
  const r = d.recovery;
  if(r.score == null) return "";
  const bewertbar = zeilen.filter(z => z.v != null && z.m);
  let satz = "";
  if(bewertbar.length){
    const staerkste = bewertbar
      .map(z => ({...z, rel: (z.v - z.m) / Math.abs(z.m)}))
      .sort((a,b) => Math.abs(b.rel) - Math.abs(a.rel))[0];
    const pct = Math.round(Math.abs(staerkste.rel) * 100);
    if(pct >= 2) satz = `Deine ${esc(staerkste.l)} liegt ${pct} % ${
      staerkste.rel > 0 ? "über" : "unter"} deinem Schnitt der letzten 30 Tage. `;
  }
  const rat = r.zone === "gruen"
    ? "Dein Körper ist bereit für Belastung — heute darfst du zulegen."
    : r.zone === "gelb"
    ? "Halte dein bisheriges Niveau. Mehr würde die Erholung der nächsten Tage kosten."
    : r.zone === "rot"
    ? "Dein Körper braucht Ruhe. Leichte Bewegung ja, harte Einheiten heute nicht."
    : "";
  return `<div class="insight">
    <div class="tx" style="font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.88)">
      ${satz}${rat}</div>
    <button class="insightlink" data-coach="1">Mit dem Coach mehr erfahren ${ICON_PFEIL_R}</button>
  </div>`;
}

// Einblicke: was du gestern eingetragen hast UND wovon sich eine Wirkung auf
// den Erholungswert belegen laesst. Ohne belegte Wirkung kein Chip.
function erholEinblicke(d){
  const gestern = D[S.day-1];
  if(!gestern) return "";
  const eintraege = journalAmTag(gestern.date);
  const treffer = verhaltenListe()
    .filter(([k]) => eintraege[k])
    .map(([k,l]) => { const w = verhaltenWirkung(k); return w ? {k, l, pct:w.pct} : null; })
    .filter(Boolean)
    .sort((a,b) => Math.abs(b.pct) - Math.abs(a.pct));
  if(!treffer.length) return "";
  const zeigen = treffer.slice(0, 3), rest = treffer.length - zeigen.length;
  return `<button class="karte klick einblick" data-goto="einblicke">
    <div class="kopfzeile" style="margin-bottom:9px">
      <span style="display:flex;align-items:center;gap:9px">
        <span style="color:rgba(255,255,255,.8);line-height:0">${ICON_GLUEH}</span>
        <span class="t">Einblicke in die Erholung</span></span>${ICON_PFEIL_R}</div>
    <div class="tx" style="font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.75)">
      Diese Einträge von gestern haben sich messbar auf deinen heutigen Erholungswert
      ausgewirkt.</div>
    <div class="chipreihe">
      ${zeigen.map(t => `<span class="wchip ${t.pct >= 0 ? "gut" : "schlecht"}">${
        t.pct >= 0 ? "▲" : "▼"} ${esc(t.l)}</span>`).join("")}
      ${rest > 0 ? `<span class="wchip neutral">+${rest} weitere</span>` : ""}
    </div>
    <div class="chartnote">${calcBadge(
      "Vergleich deines Erholungswerts an Tagen mit und ohne das jeweilige Verhalten", true)}
      Gezeigt wird nur, wofür mindestens vier Tage mit und vier ohne vorliegen.</div>
  </button>`;
}

/* ================= Schlaf ================= */
// Aufbau der Rubrik, von oben nach unten:
//   1. Ring mit der Schlafleistung
//   2. vier antippbare Zeilen - jede fuehrt in die Trendanzeige
//   3. Einsicht des Coaches
//   4. "Der Schlaf der letzten Nacht": Stunden, Bedarf, Regelmaessigkeit,
//      Effizienz, Schlafstress - jeweils mit dem eigenen 30-Tage-Mittel
//   5. woechentliche Trends als Vorschaukarten
// Nichts davon wird geschaetzt: jede Zahl stammt aus den Messdaten oder wird
// sichtbar daraus gerechnet. Fehlt eine Messung, faellt der Block weg.

const STUFENFARBEN = ["var(--z5)", "#8A939D", "var(--green)"];
const STUFENNAMEN  = ["Ungenügend", "Ausreichend", "Optimal"];

// Gibt 0 (ungenuegend), 1 (ausreichend) oder 2 (optimal) zurueck.
// hoch=false kehrt die Richtung um - bei Schlafstress ist wenig gut.
function stufeVon(v, schwellen, hoch){
  if(v == null) return null;
  const opt = schwellen[0], ok = schwellen[1];
  return hoch ? (v >= opt ? 2 : v >= ok ? 1 : 0)
              : (v <= opt ? 2 : v <= ok ? 1 : 0);
}

// Anteil der Nacht im Bereich mit hohem Stress, in Prozent.
function schlafStressAnteil(s){
  if(!s || !s.stress) return null;
  const g = s.stress.niedrig + s.stress.mittel + s.stress.hoch;
  return g ? Math.round(s.stress.hoch / g * 100) : null;
}
function stundenAnteil(s){
  if(!s || !s.need || !s.need.total || s.duration_min == null) return null;
  // Gedeckelt: mehr als der volle Bedarf ist keine bessere Deckung, und
  // eine Säule über der 100-%-Linie waere im Diagramm schlicht falsch.
  return Math.min(100, Math.round(s.duration_min / s.need.total * 100));
}
const erholsamMin = s => (s && s.stages) ? s.stages.deep + s.stages.rem : null;
// Prozentanzeige der Kartenköpfe - immer gerundet. Ein Mittelwert wie
// 72,3666 hat in der Anzeige nichts verloren.
const pz = v => v == null ? "–" : Math.round(v) + "%";

// Mittel der 30 Tage VOR dem gewaehlten Tag. Genau das steht im Vorbild als
// kleine Zahl unter dem Tageswert.
function mittel30(f){
  const w = D.slice(Math.max(0, S.day-30), S.day).map(f).filter(v => v != null && !isNaN(v));
  return w.length ? w.reduce((a,b)=>a+b,0) / w.length : null;
}

// Kopf einer Messkarte: Titel, grosse Zahl mit Pfeil, darunter das Mittel.
function wertKopf(titel, wert, mittel, fmt, hochBesser, info){
  const zeigPfeil = wert != null && mittel != null && Math.abs(wert - mittel) > 0.5;
  const hoeher = wert > mittel;
  const pfeil = !zeigPfeil ? "" : `<span style="font-size:11px;margin-left:6px;vertical-align:3px;
    color:${hochBesser == null ? "var(--dim)" : (hoeher === hochBesser ? "var(--green)" : "var(--z4)")}"
    >${hoeher ? "▲" : "▼"}</span>`;
  // Der Info-Knopf sitzt absolut oben rechts in der Karte, nicht in der
  // Textzeile - sonst verschiebt er die Überschrift.
  return `${info ? `<button class="infoknopf" data-schlafinfo="${esc(info)}"
      aria-label="Erklärung zu ${esc(titel)}">${ICON_INFO}</button>` : ""}
    <div class="lbl" style="color:#fff;font-size:11.5px;font-weight:800;padding-right:34px"
      >${esc(titel)}</div>
    <div class="num" style="font-size:26px;margin-top:6px;line-height:1">${fmt(wert)}${pfeil}</div>
    <div class="small muted" style="margin-top:2px;min-height:16px">${
      mittel == null ? "" : fmt(mittel)}</div>`;
}

function vSchlaf(){
  const d = day(), s = d.sleep;
  const zeilen = schlafZeilen(d);

  return `
  <div style="position:relative;text-align:center;padding:2px 0 4px">
    ${calcBadge("gemessene Schlafdauer geteilt durch den berechneten Bedarf")}
    <div data-ringtap="1" style="display:inline-block;cursor:pointer">
      ${ring(s.performance, 100, "var(--sleep)", GROSSER_RING("SCHLAFLEISTUNG",
        `Schlafleistung ${s.performance == null ? "keine Daten" : s.performance + " Prozent"}`))}
    </div>
  </div>

  <div class="karte spitze" style="padding:2px 16px">
    ${zeilen.map(z => {
      const st = stufeVon(z.v, z.schw, z.hoch);
      return `<button class="qzeile" data-strendmetrik="${z.k}">
        <span class="qic">${z.ic}</span>
        <span class="qlab">${esc(z.l)}</span>
        <span class="qskala">${[0,1,2].map(i =>
          `<i style="background:${st === i ? STUFENFARBEN[i] : "#262B32"}"></i>`).join("")}</span>
        <span class="qwert">${z.v == null ? "–" : z.v + "%"}</span>
      </button>`;}).join("")}
  </div>
  <div class="qlegende">
    ${STUFENNAMEN.map((n,i) =>
      `<span><i style="background:${STUFENFARBEN[i]}"></i>${n}</span>`).join("")}
  </div>

  ${leistungTeile(s)}
  ${schlafEinsicht(d, zeilen)}

  <div class="abschnitt" style="padding-bottom:2px">Der Schlaf der letzten Nacht</div>
  <div class="small muted" style="margin:0 16px 4px"><b style="color:#fff">${
    S.day === LAST ? "Heute" : dlong(d.date)}</b> im Vergleich zu den vorherigen 30 Tagen</div>

  ${kartenStunden(s)}
  ${kartenBedarf(s)}
  ${kartenRegel(s)}
  ${kartenEffizienz(s)}
  ${kartenSchlafstress(s)}

  <div class="abschnitt">Wöchentliche Trends</div>
  ${["schlafleistung","stdbedarf_std","stdbedarf_pct","erholsam",
     "regelmaessigkeit","bettzeit","effizienz","schlafdefizit"]
    .map(k => wochenkarte(k)).join("")}

  <div class="abschnitt" id="coachziel">Schlaf-Coach</div>
  ${schlafCoach(s)}
  ${rohtabelle()}`;
}

// Woraus sich die Schlafleistung zusammensetzt. Nur sichtbar, wenn die
// Aufschluesselung vorliegt - aeltere Naechte ohne Phasenerkennung haben sie
// nicht, und dann wird hier nichts behauptet.
const LEISTUNG_TEILE = [
  ["dauer",      "Dauer vs. Bedarf",  45],
  ["erholsam",   "Erholsamer Schlaf", 25],
  ["ungestoert", "Ungestört",         20],
  ["einschlafen","Einschlafen",       10],
];
function leistungTeile(s){
  const teile = s.performance_teile;
  if(!teile || !Object.keys(teile).length) return "";
  const vorhanden = LEISTUNG_TEILE.filter(([k]) => teile[k] != null);
  const summe = vorhanden.reduce((a,[,,g]) => a + g, 0);
  return `<div class="karte">
    ${calcBadge("gewichtetes Mittel aus Dauer, Tief- und REM-Schlaf, Wachzeit und Einschlafdauer")}
    <div class="lbl" style="color:#fff;font-size:11.5px;font-weight:800;margin-bottom:4px"
      >Woraus sich die Schlafleistung ergibt</div>
    ${vorhanden.map(([k,l,g]) => {
      const v = teile[k];
      const c = v >= 85 ? "var(--green)" : v >= 65 ? "#8A939D" : "var(--z5)";
      return `<div style="padding:9px 0">
        <div class="row" style="margin-bottom:6px">
          <span class="small" style="font-weight:700;color:#fff">${esc(l)}
            <span class="muted" style="font-weight:400">· ${Math.round(g/summe*100)} %</span></span>
          <span class="num small" style="color:${c}">${v} %</span></div>
        <div class="bar"><span style="width:${v}%;background:${c}"></span></div>
      </div>`;}).join("")}
    <div class="chartnote">Lange zu schlafen ist nur die halbe Miete: Wer neun Stunden im
      Bett liegt, davon eine wach ist und kaum Tiefschlaf bekommt, hat sich schlechter
      erholt als jemand mit sieben ruhigen Stunden. ${s.stages ? `Tiefschlaf und REM
      zusammen ergaben ${hm(s.stages.deep + s.stages.rem)} h${
      s.awake_min != null ? `, wach warst du ${s.awake_min} Minuten` : ""}${
      s.fall_asleep_min != null ? `, eingeschlafen bist du nach ${s.fall_asleep_min} Minuten`
      : ""}.` : ""}</div>
  </div>`;
}

// Die vier Zeilen unter dem Ring. Jede hat eigene Schwellen - eine gemeinsame
// Skala waere falsch: 41 % Schlafeffizienz waeren eine katastrophale Nacht,
// 41 % erholsamer Schlaf dagegen ein guter Wert.
function schlafZeilen(d){
  const s = d.sleep;
  return [
    {k:"stdbedarf_pct",    l:"Stunden vs. Bedarf",   ic:ICON_MOND_VOLL,
     v:stundenAnteil(s),        schw:[85,70],  hoch:true},
    {k:"regelmaessigkeit", l:"Schlafregelmäßigkeit", ic:ICON_MOND_DOPPEL,
     v:s.consistency,           schw:[80,65],  hoch:true},
    {k:"effizienz",        l:"Schlafeffizienz",      ic:ICON_BETT,
     v:s.efficiency,            schw:[90,80],  hoch:true},
    {k:"schlafstress",     l:"Hoher Schlafstress",   ic:ICON_TACHO,
     v:schlafStressAnteil(s),   schw:[3,10],   hoch:false},
  ];
}

// Einsicht: benennt die schwaechste und die staerkste der vier Groessen.
// Sie wird aus denselben Zahlen gebildet, die darueber stehen - es kommt
// nichts hinzu, was nicht schon sichtbar ist.
function schlafEinsicht(d, zeilen){
  const bewertet = zeilen.filter(z => z.v != null);
  const gesamt = d.sleep.performance;
  if(!bewertet.length || gesamt == null) return "";
  const mitStufe = bewertet.map(z => ({k:z.k, l:z.l, v:z.v, st:stufeVon(z.v, z.schw, z.hoch)}));
  const schwach = mitStufe.slice().sort((a,b) => a.st - b.st)[0];
  const stark   = mitStufe.slice().sort((a,b) => b.st - a.st)[0];
  const wort = gesamt >= 85 ? "gut" : gesamt >= 70 ? "ausreichend" : "zu niedrig";
  return `<div class="insight">
    <div class="tx" style="font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.88)">
      Deine Schlafleistung ist mit ${gesamt} % ${wort}.
      ${schwach.st < 2
        ? `Am stärksten trägt „${esc(stark.l)}“ mit ${stark.v} % dazu bei, der schwächste
           Punkt ist „${esc(schwach.l)}“ mit ${schwach.v} %.`
        : "Alle vier Kennzahlen unter dem Ring liegen im optimalen Bereich."}</div>
    <button class="insightlink" data-schlafcoach="1">Mehr im Schlaf-Coach ${ICON_PFEIL_R}</button>
  </div>`;
}

/* ---------- Karte: geschlafene Stunden ---------- */
function kartenStunden(s){
  const mittel = mittel30(x => x.sleep.duration_min);
  const ges = s.stages ? s.stages.awake + s.stages.light + s.stages.deep + s.stages.rem : 0;
  const PH = [["awake","Wach","var(--awake)"],["light","Leicht","var(--light)"],
              ["deep","SWS (Tiefschlaf)","var(--deep)"],["rem","REM","var(--rem)"]];
  // Massstab der Bahnen: der laengste Anteil fuellt vier Fuenftel der Breite.
  const maxAnteil = ges ? Math.max(...PH.map(p => s.stages[p[0]] / ges)) : 1;
  const skala = v => Math.min(100, v / Math.max(0.01, maxAnteil) * 80);
  const erh = erholsamMin(s), erhMittel = mittel30(x => erholsamMin(x.sleep));

  return `<div class="karte">
    ${wertKopf("Geschlafene Stunden", s.duration_min, mittel, v => hm(v), true, "stunden")}
    ${s.hypnogram ? nachtPuls(s) : ""}
    <div class="hr"></div>
    <div class="row small muted" style="margin-bottom:10px">
      <span>Zeit im Bett</span>
      <span class="num" style="color:#fff;font-size:14px">${hm(s.time_in_bed_min)}</span></div>
    ${!ges ? `<div class="muted small">keine Phasen gemessen</div>` : PH.map(p => {
      const k = p[0], l = p[1], c = p[2];
      const anteil = s.stages[k] / ges;
      const norm = mittel30(x => {
        const st = x.sleep.stages;
        const g = st ? st.awake + st.light + st.deep + st.rem : 0;
        return g ? st[k] / g : null;
      });
      return `<div style="padding:6px 0">
        <div class="row" style="margin-bottom:6px">
          <span><i class="phring" style="border-color:${c}"></i><span class="phname">${esc(l)}</span>
            <span class="phpct" style="color:${c}">${Math.round(anteil*100)} %</span></span>
          <span class="num" style="font-size:14px">${hm(s.stages[k])}</span></div>
        <div class="phbahn"><span style="width:${skala(anteil).toFixed(1)}%;background:${c}"></span>
          ${norm == null ? "" : `<b style="left:${skala(norm).toFixed(1)}%"></b>`}</div>
      </div>`;}).join("")}
    <div class="hr"></div>
    <div class="row">
      <span><i class="sq" style="background:var(--deep)"></i>
        <span class="small" style="margin-left:7px;font-weight:700">Erholsamer Schlaf</span></span>
      <div style="text-align:right">
        <div class="num" style="font-size:16px">${hm(erh)}${(erh != null && erhMittel != null
          && Math.abs(erh-erhMittel) > 0.5) ? `<span style="font-size:10px;margin-left:5px;
          color:${erh > erhMittel ? "var(--green)" : "var(--z4)"}">${
          erh > erhMittel ? "▲" : "▼"}</span>` : ""}</div>
        <div class="small muted">${hm(erhMittel)}</div></div></div>
    <div class="chartnote">Erholsamer Schlaf ist die Summe aus Tiefschlaf und REM. Der helle
      Strich in jeder Bahn markiert deinen eigenen Durchschnitt der letzten 30 Nächte.</div>
  </div>`;
}

// Herzfrequenz ueber die Nacht, mit den Marken fuer Einschlafen und Aufwachen.
function nachtPuls(s){
  const h = s.hypnogram, W = 400, H = 112, PL = 26, PR = 8, PT = 8, PB = 22;
  const hrs = h.map(p => p.hr);
  const lo = Math.min(...hrs) - 6, hi = Math.max(...hrs) + 8;
  const X = i => PL + (W-PL-PR) * (h.length < 2 ? 0.5 : i/(h.length-1));
  const Y = v => PT + (H-PT-PB) * (1 - (v-lo)/(hi-lo));
  const pfad = h.map((p,i) => X(i).toFixed(1) + "," + Y(p.hr).toFixed(1)).join("L");
  let achse = "";
  [Math.round(lo/10)*10+10, Math.round((lo+hi)/20)*10, Math.round(hi/10)*10-10]
    .filter((v,i,a) => v > lo && v < hi && a.indexOf(v) === i)
    .forEach(v => { achse += `<text class="ax" x="${PL-5}" y="${(Y(v)+3).toFixed(1)}"
      text-anchor="end">${v}</text>`; });
  const marke = (x, t, anker) => `<line x1="${x}" y1="${PT}" x2="${x}" y2="${H-PB}"
      stroke="#fff" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
    <circle cx="${x}" cy="${H-PB}" r="2.6" fill="#fff"/>
    <text class="ax" x="${x}" y="${H-6}" text-anchor="${anker}"
      style="fill:#fff">${esc(t)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:12px">
    ${achse}
    <path class="dl anim" d="M${pfad}" stroke="var(--sleep)" stroke-width="1.1" opacity=".9"/>
    ${marke(PL, clock(s.bedtime_min), "start")}
    ${marke(W-PR, clock(s.waketime_min), "end")}</svg>`;
}

/* ---------- Karte: Stunden vs. Bedarf ---------- */
function kartenBedarf(s){
  const n = s.need;
  if(!n || !n.total) return "";
  const skala = Math.max(s.duration_min || 0, n.total);
  const teile = [["Gesundes Minimum", n.baseline, "#454C56"],
                 ["Letzte Belastung", n.strain, "var(--blue)"],
                 ["Schlafdefizit", n.debt, "#C9D2DA"]];
  return `<div class="karte">
    ${wertKopf("Stunden vs. Bedarf", stundenAnteil(s), mittel30(x => stundenAnteil(x.sleep)),
      pz, true, "bedarf")}
    <div class="row small" style="margin:14px 0 6px">
      <span class="lbl" style="color:#fff">Geschlafene Stunden</span>
      <span class="num" style="font-size:14px">${hm(s.duration_min)}</span></div>
    <div class="bedarfbahn"><span style="width:${
      (Math.min(1, (s.duration_min||0)/skala)*100).toFixed(1)}%;
      background:linear-gradient(90deg,#4E7E9C,#8FC0DC)"></span></div>
    <div style="display:flex;height:15px;border-radius:3px;overflow:hidden;background:#181C22;
      margin-top:9px">
      ${teile.filter(t => t[1] > 0).map(t =>
        `<div style="width:${(t[1]/skala*100).toFixed(1)}%;background:${t[2]}"
          data-tip="${esc(t[0])}: ${hm(t[1])} h"></div>`).join("")}
    </div>
    <div class="row small" style="margin-top:7px">
      <span class="lbl" style="color:#fff">Schlafbedarf</span>
      <span class="num" style="font-size:14px">${hm(n.total)}</span></div>
    <div class="hr"></div>
    ${teile.map(t => t[1] <= 0 ? "" : `<div class="row small" style="padding:5px 0">
      <span><i class="sq" style="background:${t[2]}"></i>
        <span style="margin-left:8px;color:rgba(255,255,255,.85)">${esc(t[0])}</span></span>
      <span class="num">${t[0] === "Gesundes Minimum" ? "" : "+ "}${hm(t[1])}</span></div>`).join("")}
    ${n.naps > 0 ? `<div class="row small" style="padding:5px 0">
      <span><i class="sq" style="background:#2A2F37"></i>
        <span style="margin-left:8px;color:rgba(255,255,255,.85)">Nickerchen</span></span>
      <span class="num">− ${hm(n.naps)}</span></div>` : ""}
    <div class="chartnote">Der Bedarf ist kein fester Wert: Er steigt mit der Belastung des
      Vortags und mit angesammeltem Schlafdefizit.</div>
  </div>`;
}

/* ---------- Karte: Schlafregelmaessigkeit ---------- */
function kartenRegel(s){
  const tage = D.slice(Math.max(0, S.day-6), S.day+1);
  return `<div class="karte">
    ${wertKopf("Schlafregelmäßigkeit", s.consistency, mittel30(x => x.sleep.consistency),
      pz, true, "regel")}
    ${chartFenster(tage, {h:180, zeiten:true})}
    <div class="chartnote">Jeder Balken ist eine Nacht, von der Zubettgehzeit bis zum Aufstehen.
      Die gestrichelten Linien sind deine üblichen Zeiten. Je gleichmäßiger die Balken stehen,
      desto höher die Regelmäßigkeit.</div>
  </div>`;
}

/* ---------- Karte: Schlafeffizienz ---------- */
function kartenEffizienz(s){
  const wach = (s.time_in_bed_min != null && s.duration_min != null)
    ? s.time_in_bed_min - s.duration_min : null;
  return `<div class="karte">
    ${wertKopf("Schlafeffizienz", s.efficiency, mittel30(x => x.sleep.efficiency),
      pz, true, "effizienz")}
    <div class="row small" style="margin:14px 0 6px">
      <span class="lbl" style="color:#fff">Schlafend</span>
      <span class="num" style="font-size:14px">${hm(s.duration_min)}</span></div>
    ${s.hypnogram ? effizienzBand(s) : `<div class="bedarfbahn"><span style="width:${
      (s.efficiency || 0).toFixed(0)}%;background:var(--sleep)"></span></div>`}
    <div class="row small" style="margin-top:8px">
      <span class="lbl" style="color:#fff">Wach</span>
      <span class="num" style="font-size:14px">${hm(wach)}</span></div>
    ${s.wake_count == null ? "" : `<div class="hr"></div>
    <div class="row">
      <span><i class="sq" style="background:#C9D2DA"></i>
        <span class="small" style="margin-left:7px;font-weight:700">Aufwachereignisse</span></span>
      <span class="num" style="font-size:16px">${s.wake_count}</span></div>`}
    <div class="chartnote">Die Effizienz ist der Anteil der Zeit im Bett, den du wirklich
      geschlafen hast. Kurzes Aufwachen gehört zu jeder Nacht — auffällig wird es erst,
      wenn sich die Wachzeit summiert.</div>
  </div>`;
}

// Band aus dem Hypnogramm: hell, wo geschlafen wurde, Luecken beim Wachsein.
function effizienzBand(s){
  const h = s.hypnogram, W = 400, H = 30;
  const bw = W / h.length;
  const schlaf = h.map((p,i) => p.s === "awake" ? "" :
    `<rect x="${(i*bw).toFixed(2)}" y="0" width="${(bw+0.4).toFixed(2)}" height="13"
      fill="var(--sleep)"/>`).join("");
  const wach = h.map((p,i) => p.s !== "awake" ? "" :
    `<rect x="${(i*bw).toFixed(2)}" y="19" width="${Math.max(1.4, bw*0.7).toFixed(2)}" height="11"
      fill="#C9D2DA"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"
    role="img" aria-label="Schlaf- und Wachphasen der Nacht">
    <rect x="0" y="0" width="${W}" height="13" fill="#181C22" rx="2"/>${schlaf}${wach}</svg>`;
}

/* ---------- Karte: Schlafstress ---------- */
function kartenSchlafstress(s){
  const pct = schlafStressAnteil(s);
  if(pct == null) return "";
  const g = s.stress.niedrig + s.stress.mittel + s.stress.hoch;
  const stufen = [["hoch","Hoch","var(--z5)"],["mittel","Mittel","var(--green)"],
                  ["niedrig","Niedrig","var(--blue)"]];
  return `<div class="karte">
    ${wertKopf("Schlafstress", pct, mittel30(x => schlafStressAnteil(x.sleep)),
      pz, false, "schlafstress")}
    ${s.stress_reihe ? nachtStressKurve(s) : ""}
    <div class="hr"></div>
    ${stufen.map(t => `<div style="padding:7px 0">
      <div class="row" style="margin-bottom:6px">
        <span><span class="phname">${esc(t[1])}</span>
          <span class="phpct" style="color:${t[2]}">${Math.round(s.stress[t[0]]/g*100)} %</span></span>
        <span class="num" style="font-size:14px">${hm(s.stress[t[0]])}</span></div>
      <div class="phbahn"><span style="width:${(s.stress[t[0]]/g*100).toFixed(1)}%;
        background:${t[2]}"></span></div></div>`).join("")}
    <div class="chartnote">${calcBadge("aus Herzfrequenz und HFV über das Schlaffenster", true)}
      Der Stresswert wird berechnet, nicht gemessen. Er läuft von 0 bis 3 und vergleicht
      deinen Zustand mit deinem eigenen Normalwert.</div>
  </div>`;
}

function nachtStressKurve(s){
  const r = s.stress_reihe, W = 400, H = 150, PL = 26, PR = 10, PT = 16, PB = 24;
  const X = i => PL + (W-PL-PR) * (r.length < 2 ? 0.5 : i/(r.length-1));
  const Y = v => PT + (H-PT-PB) * (1 - Math.max(0, Math.min(3, v))/3);
  let raster = "";
  [0,1,2,3].forEach(v => { raster += `<line class="gl" x1="${PL}" y1="${Y(v).toFixed(1)}"
    x2="${W-PR}" y2="${Y(v).toFixed(1)}"/>
    <text class="ax" x="${PL-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${n1(v)}</text>`; });
  const pfad = r.map((p,i) => X(i).toFixed(1) + "," + Y(p.v).toFixed(1)).join("L");
  const zeit = m => clock((s.bedtime_min + m) % 1440);
  const stellen = [0, Math.floor(r.length/2), r.length-1].filter((v,i,a) => a.indexOf(v) === i);
  const xl = stellen.map((i,n) => `<text class="ax" x="${X(i).toFixed(1)}" y="${H-7}"
      text-anchor="${n === 0 ? "start" : n === stellen.length-1 ? "end" : "middle"}"
      >${zeit(r[i].m)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:14px">
    ${raster}
    <line x1="${PL}" y1="${(PT-7).toFixed(1)}" x2="${W-PR}" y2="${(PT-7).toFixed(1)}"
      stroke="var(--sleep)" stroke-width="2" stroke-linecap="round"/>
    <text x="${(W/2).toFixed(1)}" y="${(PT-3).toFixed(1)}" text-anchor="middle"
      style="font-size:13px;fill:#C9D9E4">☾</text>
    <path class="dl anim" d="M${pfad}" stroke="var(--green)" stroke-width="1.3"/>
    ${xl}</svg>`;
}

/* ---------- Vorschaukarten der Wochentrends ---------- */
function wochenkarte(k){
  const m = trendVon(k);
  if(!m) return "";
  const tage = D.slice(Math.max(0, S.day-6), S.day+1);
  const inhalt = trendChart(m, tage, {h:172, labels:true, letzter:true});
  if(!inhalt) return "";
  return `<button class="karte klick wochenkarte" data-strendmetrik="${esc(k)}">
    <div class="kopfzeile" style="margin-bottom:10px">
      <span class="t">${esc(m.l)}</span>${ICON_PFEIL_R}</div>
    ${m.legende ? `<div class="wlegende">${m.legende}</div>` : ""}
    ${inhalt}
  </button>`;
}

/* ---------- Schlaf-Coach ---------- */
// Rechnet aus dem Schlafbedarf und einer Weckzeit die Schlafenszeit zurück.
// Alle Eingangsgrößen sind schon da - nur Weckzeit und Ziel kommen von dir
// und liegen im Browser.
const SKEY = "claudehealth.schlafplan";
const ZIELE = [
  ["durchkommen", "Durchkommen",    0.70,
   "Genug, um den Tag zu überstehen. Dein Schlafdefizit wächst dabei weiter."],
  ["leistung",    "Leistungsfähig", 0.87,
   "Solide Erholung für einen normalen Tag. Für die meisten Nächte die richtige Wahl."],
  ["bestleistung","Bestleistung",   1.00,
   "Volle Deckung deines Bedarfs. Sinnvoll vor einem harten Tag oder nach einer zehrenden Woche."],
];

function schlafplan(){
  try {
    const p = JSON.parse(localStorage.getItem(SKEY) || "{}") || {};
    return {weckzeit: p.weckzeit ?? null, ziel: p.ziel ?? 0.87,
            zielart: p.zielart ?? "wochenplan"};
  } catch(e){ return {weckzeit:null, ziel:0.87, zielart:"wochenplan"}; }
}
function speichereSchlafplan(p){
  try { localStorage.setItem(SKEY, JSON.stringify(p)); return true; } catch(e){ return false; }
}
function medianVon(werte){
  const v = werte.filter(x=>x!=null && !isNaN(x)).sort((a,b)=>a-b);
  return v.length ? v[Math.floor(v.length/2)] : null;
}
function hhmmZuMin(t){
  const m = /^(\d{1,2}):(\d{2})$/.exec(t || "");
  return m ? (+m[1])*60 + (+m[2]) : null;
}
const minZuHhmm = m => `${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(Math.round(m%60)).padStart(2,"0")}`;

function schlafCoach(s){
  const p = schlafplan();
  const w = win();
  const ueblicheWeckzeit = medianVon(w.map(x=>x.sleep.waketime_min));
  const uebBettzeit = medianVon(w.map(x=>x.sleep.bedtime_min));
  const effizienz = medianVon(w.map(x=>x.sleep.efficiency)) ?? 90;
  const weckMin = hhmmZuMin(p.weckzeit) ?? ueblicheWeckzeit ?? 7*60;

  const bedarf = s.need.total;
  const ziel = ZIELE.find(z=>Math.abs(z[2]-p.ziel)<0.01) || ZIELE[1];
  const brauchtSchlaf = Math.round(bedarf * ziel[2]);
  // Wer 90 % effizient schläft, braucht mehr Zeit im Bett als reine Schlafzeit
  const zeitImBett = Math.round(brauchtSchlaf / (effizienz/100));
  const bettMin = ((weckMin - zeitImBett) % 1440 + 1440) % 1440;
  // Abweichung auf dem kürzesten Weg über Mitternacht
  const abweichung = uebBettzeit==null ? null
    : (((uebBettzeit - bettMin + 720) % 1440) - 720);

  return `
  <div class="card">
    ${calcBadge("Bedarf mal Ziel, geteilt durch deine übliche Schlafeffizienz")}
    <div class="lbl" style="margin-bottom:14px">Schlaf-Coach</div>

    <div class="lbl" style="font-size:9.5px;color:var(--dim2);margin-bottom:8px">Morgen möchte ich</div>
    <div style="display:flex;gap:6px;margin-bottom:18px">
      ${ZIELE.map(([k,l,f])=>`<button class="zielknopf" data-ziel="${f}"
        aria-pressed="${Math.abs(f-ziel[2])<0.01}">${l}</button>`).join("")}
    </div>

    <div style="display:flex;gap:12px;align-items:flex-end;justify-content:space-between">
      <div>
        <div class="lbl" style="font-size:9.5px">Empfohlene Schlafenszeit</div>
        <div class="num" style="font-size:38px;line-height:1.1;margin-top:2px">${minZuHhmm(bettMin)}</div>
      </div>
      <div style="text-align:right">
        <div class="lbl" style="font-size:9.5px;margin-bottom:5px">Aufwachzeit</div>
        <input type="time" id="c-weck" value="${minZuHhmm(weckMin)}"
          style="width:108px;text-align:center;font-size:16px;font-weight:800">
      </div>
    </div>

    <div class="hr"></div>
    <div class="row small muted" style="margin-bottom:7px">
      <span>Zeit im Bett</span>
      <span class="num" style="color:var(--text);font-size:14px">${hm(zeitImBett)} h</span></div>
    <div style="display:flex;height:20px;border-radius:4px;overflow:hidden;background:#20242B">
      <div style="width:${Math.min(100, brauchtSchlaf/zeitImBett*100)}%;background:var(--sleep)"
        data-tip="Schlafzeit ${hm(brauchtSchlaf)} h"></div>
      <div style="flex:1;background:#2C323A"
        data-tip="Wachliegen ${hm(zeitImBett-brauchtSchlaf)} h"></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px" class="small muted">
      <span><i class="sq" style="background:var(--sleep)"></i> Schlaf ${hm(brauchtSchlaf)}</span>
      <span><i class="sq" style="background:#2C323A"></i> Wachliegen ${hm(zeitImBett-brauchtSchlaf)}</span>
      <span>bei ${Math.round(effizienz)} % Effizienz</span>
    </div>

    <div class="chartnote">${esc(ziel[3])}${
      abweichung==null ? "" : Math.abs(abweichung) < 20
        ? ` Du gehst üblicherweise um ${minZuHhmm(uebBettzeit)} ins Bett — das passt bereits.`
        : abweichung > 0
        ? ` Du gehst üblicherweise erst um ${minZuHhmm(uebBettzeit)} ins Bett, also ${
            hm(Math.abs(abweichung))} h später als empfohlen.`
        : ` Du gehst üblicherweise schon um ${minZuHhmm(uebBettzeit)} ins Bett, ${
            hm(Math.abs(abweichung))} h früher als nötig.`}</div>

    <div class="hr"></div>
    <div class="lbl" style="font-size:9.5px;margin-bottom:8px">Woraus sich der Bedarf ergibt</div>
    ${[["Gesundes Minimum", s.need.baseline],["Belastung von gestern", s.need.strain],
       ["Angesammeltes Defizit", s.need.debt]].filter(([,v])=>v>0).map(([l,v])=>
      `<div class="row small" style="padding:4px 0"><span class="muted">${esc(l)}</span>
       <span class="num">${hm(v)} h</span></div>`).join("")}
    <div class="row small" style="padding:7px 0 0;border-top:1px solid var(--line);margin-top:5px">
      <span>Bedarf bei voller Deckung</span><span class="num">${hm(bedarf)} h</span></div>
  </div>`;
}

function hypnogram(s){
  const h = s.hypnogram, W=400, H=92, PT=6, PB=16;
  const COL = {awake:"var(--awake)",light:"var(--light)",deep:"var(--deep)",rem:"var(--rem)"};
  const LV = {awake:0,rem:1,light:2,deep:3};
  const bw = W/h.length, rowH=(H-PT-PB)/4;
  const blocks = h.map((p,i)=>`<rect x="${i*bw}" y="${PT+LV[p.s]*rowH}" width="${bw+0.5}"
    height="${rowH-2}" fill="${COL[p.s]}" opacity=".92"
    data-tip="${clock(s.bedtime_min+p.m)} · ${p.s==="awake"?"Wach":p.s==="light"?"Leicht":p.s==="deep"?"Tief":"REM"} · ${p.hr} bpm"/>`).join("");
  const hrs = h.map(p=>p.hr), lo=Math.min(...hrs)-4, hi=Math.max(...hrs)+4;
  const hp = h.map((p,i)=>[i*bw+bw/2, PT+(H-PT-PB)*(1-(p.hr-lo)/(hi-lo))]);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:14px">
    ${blocks}
    <path class="dl anim" d="M${hp.map(p=>p.join(",")).join("L")}" stroke="#B7BEC6" stroke-width="1.2" opacity=".75"/>
    <text class="ax" x="0" y="${H-3}">${clock(s.bedtime_min)}</text>
    <text class="ax" x="${W}" y="${H-3}" text-anchor="end">${clock(s.waketime_min)}</text></svg>`;
}

function vBelastung(){
  const d = day(), st = d.strain, w = win();
  const Z = [["z5","Zone 5","90–100 %","var(--z5)"],["z4","Zone 4","80–90 %","var(--z4)"],
    ["z3","Zone 3","70–80 %","var(--z3)"],["z2","Zone 2","60–70 %","var(--z2)"],
    ["z1","Zone 1","50–60 %","var(--z1)"],["z0","Zone 0","< 50 %","var(--z0)"]];
  const ges = Object.values(st.zones_sec).reduce((a,b)=>a+b,0)||1;

  // Wochenkilometer
  const wochen = {};
  win().forEach(x=>{
    const dt=new Date(x.date+"T00:00"); const on=new Date(dt); on.setDate(dt.getDate()-((dt.getDay()+6)%7));
    const k=on.toISOString().slice(0,10); wochen[k]=(wochen[k]||0)+(x.distance_km||0);
  });
  const wk = Object.entries(wochen).map(([k,v],i,a)=>({x:"KW"+kw(k),full:"Woche ab "+dlong(k),
    y:Math.round(v*10)/10, c:i===a.length-1?"#fff":"var(--blue)"}));

  return `
  <div class="card" style="text-align:center;padding-top:22px">
    ${calcBadge("aus der gemessenen Zeit in den Herzfrequenzzonen")}
    ${ring(st.score,21,"var(--blue)",{size:168,cap:"BELASTUNG",text:n1(st.score),dez:1})}
    <div class="lbl" style="margin-top:10px;color:var(--blue)">${esc(st.label)}</div>
    <div style="margin-top:6px;font-size:13px;color:var(--dim);line-height:1.5">
      Die Skala reicht von 0 bis 21 und ist nach oben gestaucht — für jeden weiteren Punkt
      braucht es deutlich mehr Aufwand.</div>
  </div>
  ${belastungsZiel(d)}
  <div class="card">
    <div class="lbl" style="margin-bottom:8px">Zeit in den Herzfrequenzzonen</div>
    ${Z.map(([k,l,r,c])=>`<div class="zrow">
      <div class="zl"><div class="small" style="font-weight:700">${esc(l)}</div>
        <div class="ax" style="font-size:9.5px">${esc(r)}</div></div>
      <div class="zb"><span style="width:${(st.zones_sec[k]/ges*100).toFixed(1)}%;background:${c}"></span></div>
      <div class="zt small">${hm(st.zones_sec[k]/60)}</div></div>`).join("")}
  </div>
  <div class="card">
    <div class="lbl" style="margin-bottom:4px">Einheiten an diesem Tag</div>
    ${(()=>{ const akt = alleAktivitaeten(d);
      return akt.length ? akt.map(aktKarte).join("")
        : `<div class="small muted" style="padding:10px 0">Keine Einheit — Ruhetag.</div>`; })()}
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:12px"><span class="lbl">Belastung im Verlauf</span>${seg()}</div>
    ${barChart(w.map(x=>({x:dshort(x.date),full:dlong(x.date),y:x.strain.score})),
      {h:150,max:21,color:"var(--blue)",ticks:[0,.33,.66,1],fmtY:v=>v.toFixed(0),fmtT:v=>n1(v)})}
  </div>
  <div class="card">
    <div class="lbl" style="margin-bottom:12px">Kilometer je Kalenderwoche</div>
    ${barChart(wk,{h:140,color:"var(--blue)",labels:true,fmtL:v=>n1(v),fmtY:v=>Math.round(v),fmtT:v=>n1(v)+" km"})}
    <div class="chartnote">Die weiße Säule ist die laufende, noch unvollständige Woche.</div>
  </div>
  ${rohtabelle()}`;
}
function kw(iso){ const d=new Date(iso+"T00:00"); const t=new Date(d.valueOf());
  t.setDate(t.getDate()+3-((d.getDay()+6)%7)); const s=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-s)/86400000-3+((s.getDay()+6)%7))/7); }

// Kompakte Zeile. Nachgetragene Einheiten haben keine Belastungszahl -
// dort steht deshalb kein erfundener Wert, sondern der Hinweis.
// Aus der Erholung ein Tagesziel für die Belastung ableiten. Das ist der
// Kreislauf, der die App überhaupt nützlich macht: gut erholt heißt, du
// verträgst mehr; schlecht erholt heißt, heute reicht weniger.
function belastungsZiel(d){
  const erholung = d.recovery.score;
  const jetzt = d.strain.score;
  if(erholung == null){
    return `<div class="card">
      <div class="lbl" style="margin-bottom:6px">Belastungsziel</div>
      <div class="chartnote">Solange kein Erholungswert vorliegt, gibt es kein sinnvolles
        Tagesziel — es käme sonst aus dem Nichts.</div></div>`;
  }
  const ziel = Math.round((6 + erholung/100 * 12) * 10) / 10;
  const unten = Math.max(0, ziel - 1.5), oben = Math.min(21, ziel + 1.5);
  const stand = jetzt < unten ? "darunter" : jetzt > oben ? "darüber" : "im Fenster";
  const farbe = stand === "im Fenster" ? "var(--green)"
              : stand === "darunter" ? "var(--blue)" : "var(--z4)";
  const p = v => Math.max(0, Math.min(100, v/21*100));

  return `<div class="card">
    ${calcBadge("aus deinem heutigen Erholungswert")}
    <div class="lbl" style="margin-bottom:12px">Belastungsziel</div>
    <div class="row" style="align-items:flex-end;margin-bottom:14px">
      <div><div class="num" style="font-size:38px;line-height:1.1">${n1(ziel)}</div>
        <div class="small muted">Ziel bei ${erholung} % Erholung</div></div>
      <div style="text-align:right"><div class="num" style="font-size:22px;color:${farbe}">${n1(jetzt)}</div>
        <div class="small muted">bisher heute</div></div>
    </div>
    <div style="position:relative;height:22px">
      <div style="position:absolute;top:8px;left:0;right:0;height:6px;background:#20242B;
        border-radius:3px"></div>
      <div style="position:absolute;top:8px;left:${p(unten)}%;width:${p(oben)-p(unten)}%;height:6px;
        background:var(--green);opacity:.55;border-radius:3px"
        data-tip="Zielfenster ${n1(unten)} bis ${n1(oben)}"></div>
      <div style="position:absolute;top:8px;left:0;width:${p(jetzt)}%;height:6px;
        background:var(--blue);border-radius:3px"></div>
      <div style="position:absolute;top:3px;left:${p(jetzt)}%;width:3px;height:16px;
        background:#fff;transform:translateX(-50%);border-radius:1px"></div>
    </div>
    <div class="row ax" style="margin-top:4px"><span>0</span><span>21</span></div>
    <div class="chartnote">${
      stand === "im Fenster" ? "Du liegst im Zielfenster — genau richtig für deine heutige Erholung."
      : stand === "darunter" ? `Noch ${n1(unten - jetzt)} Punkte bis zum Fenster. Bei ${erholung} %
          Erholung verträgt dein Körper heute mehr als bisher abgerufen.`
      : `Du liegst ${n1(jetzt - oben)} Punkte über dem Fenster. Das ist nicht verboten, kostet
          aber Erholung, die morgen fehlt.`}
      Das Fenster wandert mit deiner Erholung: bei 30 % läge es um 9,6, bei 90 % um 16,8.</div>
  </div>`;
}

function aktZeile(a){
  const nach = a.manual;
  return `<div class="act">
    <div class="pill" style="background:${nach?"#2A2118":"#0E2C42"};
      color:${nach?"var(--z4)":"var(--blue)"};${nach?"font-size:11px":""}">${
      nach ? "nachgetr." : n1(a.strain)}</div>
    <div class="tx"><div style="font-weight:700">${esc(a.name)}</div>
    <div class="small muted">${nach
      ? (a.duration_min ? `${hm(a.duration_min)} h · nur eingetragen, nicht gemessen`
                        : "nur eingetragen, nicht gemessen")
      : `${clock(a.start_min)} · ${hm(a.duration_sec/60)} h · ⌀ ${a.avg_hr} bpm${
          a.distance_km?` · ${n1(a.distance_km)} km`:""}`}</div></div></div>`;
}

function aktKarte(a){
  if(a.manual) return aktZeile(a);
  const pace = a.distance_km ? (a.duration_sec/60)/a.distance_km : null;
  const hr = a.hr_series ? lineChart(a.hr_series.map((v,i)=>({x:i===0?"Start":"",y:v})),
    {h:90,color:"var(--blue)",sw:1.6,fmtY:v=>Math.round(v),fmtT:v=>v+" bpm"}) : "";
  return `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
    <div class="row"><div style="display:flex;align-items:center;gap:11px">
      <div class="pill" style="background:#0E2C42;color:var(--blue);width:58px;flex:0 0 58px;
        border-radius:8px;padding:6px 0;text-align:center;font-weight:800">${n1(a.strain)}</div>
      <div><div style="font-weight:700">${esc(a.name)}</div>
        <div class="small muted">${clock(a.start_min)} – ${clock(a.start_min+a.duration_sec/60)}</div></div>
    </div></div>
    ${hr}
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px">
      ${[["Dauer",hm(a.duration_sec/60)],["⌀ HF",a.avg_hr],["Max HF",a.max_hr],["kcal",n0(a.calories)]]
        .map(([l,v])=>`<div><div class="ax">${l}</div><div class="num" style="font-size:15px">${v}</div></div>`).join("")}
    </div>
    ${a.distance_km?`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px">
      <div><div class="ax">Distanz</div><div class="num" style="font-size:15px">${n1(a.distance_km)} km</div></div>
      <div><div class="ax">Pace</div><div class="num" style="font-size:15px">${
        Math.floor(pace)}:${String(Math.round(pace%1*60)).padStart(2,"0")} /km</div></div></div>`:""}
  </div>`;
}

const trendVon = k => TRENDS.find(t => t.k === k) || TRENDS[0];

/* ---------- Zeitraum ---------- */
function trendFenster(){
  const spanne = {W:7, M:30, "6M":180}[S.strendZeit] || 30;
  const ende = Math.max(0, S.day - S.strendVersatz * spanne);
  const von = Math.max(0, ende - spanne + 1);
  return {spanne, liste:D.slice(von, ende+1), von, ende,
          vorher:D.slice(Math.max(0, von-spanne), von)};
}
function zeitraumText(a, b){
  const j = b.slice(2,4);
  return monNr(a) === monNr(b)
    ? `${tagNr(a)}. – ${tagNr(b)}. ${MON_KURZ[monNr(b)]} ${j}`
    : `${tagNr(a)}. ${MON_KURZ[monNr(a)]} – ${tagNr(b)}. ${MON_KURZ[monNr(b)]} ${j}`;
}
const VERGLEICHSWORT = {W:"letzte Woche", M:"Vormonat", "6M":"vorheriger Zeitraum"};

function schnittVon(tage, f){
  const v = tage.map(f).filter(x => x != null && !isNaN(x));
  return v.length ? v.reduce((a,b)=>a+b,0) / v.length : null;
}

function vSchlafTrend(){
  const m = trendVon(S.strendM);
  const F = trendFenster();
  const wertF = m.mittelF || m.f;
  const jetzt = schnittVon(F.liste, wertF);
  const davor = schnittVon(F.vorher, wertF);
  const fmtM = m.mittelFmt || m.fmt;
  const delta = (jetzt != null && davor) ? Math.round((jetzt - davor) / Math.abs(davor) * 100) : null;
  // Normalbereich: Mittel plus/minus eine Standardabweichung der 30 Tage vor
  // dem Fenster. Ohne genug Tage gibt es kein Band - eine Spanne aus drei
  // Naechten waere keine Aussage.
  let band = null;
  if(m.band){
    const basis = D.slice(Math.max(0, F.von-30), F.von).map(m.f).filter(v => v != null);
    if(basis.length >= MINBASIS){
      const st = stats(basis);
      band = [st.m - st.sd, st.m + st.sd];
    }
  }

  return `
  ${trendAuswahl(m)}
  <div style="padding:6px 16px 0">
    <div class="row" style="align-items:flex-start">
      <div>
        <div class="lbl" style="line-height:1.35">${m.mittelTitel || "Durchschnitt"}</div>
        <div class="num" style="font-size:34px;margin-top:6px;line-height:1">${
          jetzt == null ? "–" : fmtM(jetzt).replace(/ %$/, "")}<span class="lbl"
          style="font-size:13px;margin-left:3px">${esc(m.e)}</span></div>
      </div>
      <span class="seg">${["W","M","6M"].map(k =>
        `<button data-strend="${k}" aria-pressed="${S.strendZeit === k}">${k}</button>`).join("")}</span>
    </div>
    <div class="row" style="margin-top:10px">
      ${delta == null || Math.abs(delta) < 1
        ? `<span class="dchip neutral">0 % ${VERGLEICHSWORT[S.strendZeit]}</span>`
        : `<span class="dchip ${(delta > 0) === (m.hoch !== false) ? "gut" : "schlecht"}">${
            delta > 0 ? "▲" : "▼"} ${Math.abs(delta)} % ${VERGLEICHSWORT[S.strendZeit]}</span>`}
      <span class="zeitnav">
        <button data-trendschritt="-1" ${F.von <= 0 ? "disabled" : ""}
          aria-label="Früherer Zeitraum">${ICON_PFEIL_L}</button>
        <span class="zt">${F.liste.length ? zeitraumText(F.liste[0].date,
          F.liste[F.liste.length-1].date) : "–"}</span>
        <button data-trendschritt="1" ${S.strendVersatz <= 0 ? "disabled" : ""}
          aria-label="Späterer Zeitraum">${ICON_PFEIL_R}</button>
      </span>
    </div>
    <div class="tx" style="font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.88);
      margin-top:16px">${trendSatz(m, jetzt, davor, band, F)}</div>
  </div>
  <div class="karte">
    ${m.legende ? `<div class="wlegende">${m.legende}</div>` : ""}
    ${trendChart(m, F.liste, {h:230, labels:F.liste.length <= 8, schnitt:jetzt,
      band:band, letzter:S.strendVersatz === 0}) || `<div class="muted small">keine Daten</div>`}
  </div>
  ${trendAufschluesselung(m, F.liste)}
  <div class="karte">
    <div style="font-size:17px;font-weight:800;color:#fff;margin-bottom:12px;
      letter-spacing:-.01em">${esc(m.frage)}</div>
    ${m.text.map(t => `<p class="dtext">${esc(t)}</p>`).join("")}
    ${m.berechnet ? `<div class="calclegend">${CALC_SVG}<span>${esc(CALC_TEXT)}:
      ${esc(m.berechnet)}</span></div>` : ""}
  </div>`;
}

// Satz unter dem Durchschnitt. Er beschreibt genau das, was oben steht -
// entweder gegen den Normalbereich oder gegen den Zeitraum davor.
function trendSatz(m, jetzt, davor, band, F){
  if(jetzt == null) return "Für diesen Zeitraum liegen noch keine Messwerte vor.";
  const spanneWort = {W:"7-Tage-Zeitraum", M:"30-Tage-Zeitraum", "6M":"Halbjahr"}[S.strendZeit];
  const fmtM = m.mittelFmt || m.fmt;
  if(band){
    const lage = jetzt > band[1] ? "oberhalb" : jetzt < band[0] ? "unterhalb" : "innerhalb";
    return `Deine durchschnittliche ${esc(m.kurz || m.l)} lag in diesem ${spanneWort}
      ${lage} deines Normalbereichs (${m.fmt(band[0])}–${m.fmt(band[1])}).`;
  }
  // Bewusst "Dein Durchschnitt für X": jede andere Formulierung braucht das
  // grammatische Geschlecht der jeweiligen Größe und geht bei der Hälfte schief.
  const einheit = m.e === "%" ? "" : " " + m.e;
  if(davor == null){
    return `Dein Durchschnitt für ${esc(m.kurz || m.l)} liegt in diesem ${spanneWort} bei
      ${fmtM(jetzt)}${einheit}. Für einen Vergleich mit dem Zeitraum davor fehlen noch Messtage.`;
  }
  const rel = jetzt > davor ? "über" : jetzt < davor ? "unter" : "genau auf";
  return `Dein Durchschnitt für ${esc(m.kurz || m.l)} liegt in diesem ${spanneWort} bei
    ${fmtM(jetzt)}${einheit} — ${rel} dem Wert des Zeitraums davor
    (${fmtM(davor)}${einheit}).`;
}

/* ---------- Auswahlfeld ---------- */
function trendAuswahl(m){
  const gruppen = [];
  TRENDS.forEach(t => {
    let g = gruppen.find(x => x[0] === t.g);
    if(!g){ g = [t.g, []]; gruppen.push(g); }
    g[1].push(t);
  });
  return `<div style="padding:8px 16px 0">
    <button class="tdrop" data-trendoffen="1" aria-expanded="${!!S.strendOffen}">
      <span class="ic">${m.ic}</span>
      <span class="lab">${esc(m.l)}</span>
      <span class="ch">${S.strendOffen ? ICON_CHEVRON_O : ICON_CHEVRON_U}</span>
    </button>
    ${!S.strendOffen ? "" : `<div class="tliste">
      ${gruppen.map(g => `<div class="tgruppe">${esc(g[0])}</div>` +
        g[1].map(t => `<button class="teintrag" data-strendmetrik="${esc(t.k)}"
          aria-current="${t.k === m.k}"><span class="ic">${t.ic}</span>
          <span class="lab">${esc(t.l)}</span></button>`).join("")).join("")}
    </div>`}
  </div>`;
}

/* ---------- Aufschluesselung nach Stufen ---------- */
function trendAufschluesselung(m, tage){
  if(!m.stufen) return "";
  const werte = tage.map(m.f).filter(v => v != null);
  if(!werte.length) return "";
  const zahl = m.stufen.map(st => 0);
  werte.forEach(v => {
    for(let i = 0; i < m.stufen.length; i++){
      if(v >= m.stufen[i][1]){ zahl[i]++; return; }
    }
    zahl[zahl.length-1]++;
  });
  const ges = werte.length;
  return `<div class="karte">
    <div class="lbl" style="color:#fff;margin-bottom:12px">${esc(m.aufschl || m.l)}
      <span style="color:var(--dim);font-weight:600">(Tage)</span></div>
    <div style="display:flex;height:13px;border-radius:3px;overflow:hidden;background:#181C22">
      ${m.stufen.map((st,i) => zahl[i] === 0 ? "" :
        `<div style="width:${(zahl[i]/ges*100).toFixed(1)}%;background:${st[2]}"
          data-tip="${esc(st[0])} ${esc(st[3])}: ${zahl[i]} Tage"></div>`).join("")}
    </div>
    ${m.stufen.map((st,i) => `<div style="display:flex;align-items:center;gap:9px;margin-top:11px">
      <i class="sq" style="background:${st[2]}"></i>
      <span class="num" style="font-size:14px;min-width:34px">${zahl[i]}x</span>
      <span class="lbl" style="color:rgba(255,255,255,.82)">${esc(st[0])}
        <span style="color:var(--dim2)">${esc(st[3])}</span></span></div>`).join("")}
  </div>`;
}

/* ================= Diagramme der Trendanzeige ================= */
function trendChart(m, tage, opts){
  opts = opts || {};
  if(!tage.length) return "";
  if(m.art === "fenster")   return chartFenster(tage,
    Object.assign({}, opts, {alleZeiten: tage.length <= 8}));
  if(m.art === "linie")     return chartLinie(m, tage, opts);
  if(m.art === "doppel")    return chartDoppel(m, tage, opts);
  if(m.art === "gestapelt") return chartGestapelt(m, tage, opts);
  return chartSaeulen(m, tage, opts);
}

// Beschriftung unter der Achse: bei bis zu acht Tagen Wochentag und Zahl,
// sonst Monat und Zahl in gleichmaessigen Abstaenden.
function xAchse(tage, X, H, opts){
  const n = tage.length;
  const schritt = n <= 8 ? 1 : Math.ceil(n / 4.4);
  return tage.map((t,i) => {
    if(n > 8 && i % schritt !== 0) return "";
    const kopf = n <= 8 ? WD[(new Date(t.date + "T00:00").getDay()+6)%7] : MON_KURZ[monNr(t.date)];
    const hell = (opts && opts.letzter && i === n-1) ? ` style="fill:#fff"` : "";
    return `<text class="ax" x="${X(i).toFixed(1)}" y="${H-13}" text-anchor="middle"${hell}>${
      esc(kopf)}</text>
      <text class="ax" x="${X(i).toFixed(1)}" y="${H-3}" text-anchor="middle"${hell}>${
      tagNr(t.date)}</text>`;
  }).join("");
}

// Helle Spalte hinter dem letzten Tag
function letzteSpalte(tage, PL, bw, PT, H, PB, opts){
  if(!opts || !opts.letzter || !tage.length) return "";
  return `<rect x="${(PL + bw*(tage.length-1)).toFixed(1)}" y="${PT-6}" width="${bw.toFixed(1)}"
    height="${(H-PT-PB+6+16).toFixed(1)}" fill="rgba(255,255,255,.06)" rx="3"/>`;
}

function schnittLinie(y, PL, PR, W){
  return `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}"
      stroke="#fff" stroke-width="1" stroke-dasharray="4 4" opacity=".8"/>
    <rect x="${PL-2}" y="${(y-9).toFixed(1)}" width="76" height="18" rx="9" fill="#EDF1F4"/>
    <text x="${PL+36}" y="${(y+3.5).toFixed(1)}" text-anchor="middle"
      style="font-size:8.5px;font-weight:800;letter-spacing:.1em;fill:#11151A">DURCHSCHN.</text>`;
}

function chartSaeulen(m, tage, opts){
  const W = 400, H = opts.h || 200, PL = 34, PR = 10, PB = 30;
  const PT = opts.labels ? 24 : 14;
  const werte = tage.map(m.f).filter(v => v != null);
  if(!werte.length) return "";
  const ticks = m.ticks || null;
  // Ohne Obergrenze gaebe es eine Division durch null - etwa an einem
  // Zeitraum, in dem das Schlafdefizit durchgehend bei 0 liegt.
  const hi = ticks ? Math.max.apply(null, ticks)
    : Math.max(1e-6, Math.max.apply(null, werte) * 1.15);
  const bw = (W-PL-PR) / tage.length;
  const X = i => PL + bw*i + bw/2;
  const Y = v => PT + (H-PT-PB) * (1 - Math.max(0, Math.min(hi, v))/hi);
  let raster = "";
  (ticks || [0, hi/2, hi]).forEach((v,i) => {
    const farbe = m.tickFarben ? m.tickFarben[i] : null;
    raster += `<line class="gl" x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}"
        y2="${Y(v).toFixed(1)}"/>
      <text class="ax" x="${PL-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end"${
        farbe ? ` style="fill:${farbe}"` : ""}>${
        m.e === "%" ? Math.round(v) + "%" : m.fmt(v)}</text>`;
  });
  const saeulen = tage.map((t,i) => {
    const v = m.f(t);
    if(v == null) return "";
    const y = Y(v), h = Math.max(2, (H-PB) - y);
    const c = typeof m.c === "function" ? m.c(t) : (m.c || "var(--sleep)");
    const lab = opts.labels ? `<text class="vlabel" x="${X(i).toFixed(1)}" y="${(y-7).toFixed(1)}"
      text-anchor="middle" fill="${c}">${m.fmt(v)}</text>` : "";
    return `<g><rect class="gbar" x="${(PL+bw*i+bw*0.26).toFixed(1)}" y="${y.toFixed(1)}"
      width="${(bw*0.48).toFixed(1)}" height="${h.toFixed(1)}" fill="${c}" rx="2"
      data-tip="${dlong(t.date)}: ${m.fmt(v)}"/>${lab}</g>`;
  }).join("");
  const durch = (opts.schnitt != null && !opts.labels)
    ? schnittLinie(Y(opts.schnitt), PL, PR, W) : "";
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${letzteSpalte(tage, PL, bw, PT, H, PB, opts)}${raster}${saeulen}${durch}
    ${xAchse(tage, X, H, opts)}</svg>`;
}

function chartLinie(m, tage, opts){
  const W = 400, H = opts.h || 200, PL = 34, PR = 14, PT = 26, PB = 30;
  const werte = tage.map(m.f).filter(v => v != null);
  if(!werte.length) return "";
  let lo = Math.min.apply(null, werte), hi = Math.max.apply(null, werte);
  if(opts.band){ lo = Math.min(lo, opts.band[0]); hi = Math.max(hi, opts.band[1]); }
  const luft = Math.max(1, (hi-lo) * 0.28);
  lo -= luft; hi += luft;
  const bw = (W-PL-PR) / tage.length;
  const X = i => PL + bw*i + bw/2;
  const Y = v => PT + (H-PT-PB) * (1 - (v-lo)/(hi-lo));
  let raster = "";
  [0,1,2,3,4].forEach(i => { const v = lo + (hi-lo)*i/4;
    raster += `<line class="gl" x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}"
        y2="${Y(v).toFixed(1)}"/>
      <text class="ax" x="${PL-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${
        Math.round(v)}</text>`; });
  const bandFlaeche = !opts.band ? "" :
    `<rect x="${PL}" y="${Y(opts.band[1]).toFixed(1)}" width="${W-PL-PR}"
       height="${Math.max(2, Y(opts.band[0])-Y(opts.band[1])).toFixed(1)}"
       fill="#fff" opacity=".07"/>
     <text class="ax" x="${W-PR}" y="${(PT-12).toFixed(1)}" text-anchor="end"
       style="fill:#fff">NORMALBEREICH</text>`;
  let segmente = [], lauf = [];
  tage.forEach((t,i) => { const v = m.f(t);
    if(v == null){ if(lauf.length > 1) segmente.push(lauf); lauf = []; }
    else lauf.push([X(i).toFixed(1), Y(v).toFixed(1)]); });
  if(lauf.length > 1) segmente.push(lauf);
  const c = m.c || "var(--sleep)";
  const pfade = segmente.map(sg => `<path class="dl anim" d="M${sg.map(p => p.join(",")).join("L")}"
    stroke="${c}" stroke-width="1.8"/>`).join("");
  const punkte = tage.map((t,i) => { const v = m.f(t);
    if(v == null) return "";
    const beschriften = opts.labels || tage.length <= 8;
    return `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.4" fill="#0B1016"
      stroke="${c}" stroke-width="1.8" data-tip="${dlong(t.date)}: ${m.fmt(v)}"/>${
      beschriften ? `<text class="vlabel" x="${X(i).toFixed(1)}" y="${(Y(v)-9).toFixed(1)}"
      text-anchor="middle" fill="${c}">${m.fmt(v).replace(/ ?%$/, "%")}</text>` : ""}`;
  }).join("");
  const durch = (opts.schnitt != null && !opts.labels && tage.length > 8)
    ? schnittLinie(Y(opts.schnitt), PL, PR, W) : "";
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${letzteSpalte(tage, PL, bw, PT, H, PB, opts)}${raster}${bandFlaeche}${pfade}${punkte}${durch}
    ${xAchse(tage, X, H, opts)}</svg>`;
}

function chartDoppel(m, tage, opts){
  const W = 400, H = opts.h || 200, PL = 20, PR = 16, PT = 26, PB = 30;
  const alle = tage.map(m.f).concat(tage.map(m.f2)).filter(v => v != null);
  if(!alle.length) return "";
  let lo = Math.min.apply(null, alle), hi = Math.max.apply(null, alle);
  const luft = Math.max(20, (hi-lo) * 0.35);
  lo -= luft; hi += luft;
  const bw = (W-PL-PR) / tage.length;
  const X = i => PL + bw*i + bw/2;
  const Y = v => PT + (H-PT-PB) * (1 - (v-lo)/(hi-lo));
  // unten=true setzt die Beschriftung unter den Punkt. Ohne das würden sich
  // die Zahlen der beiden Reihen dort überlagern, wo sie sich annähern.
  const reihe = (f, c, unten) => {
    let segmente = [], lauf = [];
    tage.forEach((t,i) => { const v = f(t);
      if(v == null){ if(lauf.length > 1) segmente.push(lauf); lauf = []; }
      else lauf.push([X(i).toFixed(1), Y(v).toFixed(1)]); });
    if(lauf.length > 1) segmente.push(lauf);
    const pfade = segmente.map(sg => `<path class="dl anim"
      d="M${sg.map(p => p.join(",")).join("L")}" stroke="${c}" stroke-width="1.8"/>`).join("");
    const punkte = tage.map((t,i) => { const v = f(t);
      return v == null ? "" : `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.2"
        fill="#0B1016" stroke="${c}" stroke-width="1.8"
        data-tip="${dlong(t.date)}: ${hm(v)} h"/>${tage.length <= 8
        ? `<text class="vlabel" x="${X(i).toFixed(1)}" y="${(Y(v)+(unten?15:-9)).toFixed(1)}"
           text-anchor="middle" fill="${c}">${hm(v)}</text>` : ""}`;}).join("");
    return pfade + punkte;
  };
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${letzteSpalte(tage, PL, bw, PT, H, PB, opts)}
    ${reihe(m.f2, m.c2)}${reihe(m.f, m.c, true)}
    ${xAchse(tage, X, H, opts)}</svg>`;
}

function chartGestapelt(m, tage, opts){
  const W = 400, H = opts.h || 200, PL = 34, PR = 10, PB = 30;
  const PT = opts.labels ? 24 : 14;
  const daten = tage.map(t => m.quelle(t));
  const summen = daten.map(q => q ? m.teile.reduce((a,p) => a + (q[p[0]] || 0), 0) : null);
  const gueltig = summen.filter(v => v != null && v > 0);
  if(!gueltig.length) return "";
  // Auf die naechste halbe Stunde aufrunden - dann stehen an der Achse
  // runde Zeiten statt 5:21.
  const hi = m.stapelProzent ? 100
    : Math.max(30, Math.ceil(Math.max.apply(null, gueltig) * 1.18 / 30) * 30);
  const bw = (W-PL-PR) / tage.length;
  const X = i => PL + bw*i + bw/2;
  const Y = v => PT + (H-PT-PB) * (1 - Math.max(0, Math.min(hi, v))/hi);
  let raster = "";
  (m.stapelProzent ? [0,25,50,75,100] : [0, hi/2, hi]).forEach(v => {
    raster += `<line class="gl" x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}"
        y2="${Y(v).toFixed(1)}"/>
      <text class="ax" x="${PL-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${
        m.stapelProzent ? Math.round(v) + "%" : hm(v)}</text>`;
  });
  const saeulen = tage.map((t,i) => {
    const q = daten[i], summe = summen[i];
    if(!q || !summe) return "";
    let unten = H-PB, stapel = "";
    // Von unten nach oben stapeln: der LETZTE Eintrag in teile sitzt unten.
    // Beim Schlafstress liegt damit "niedrig" am Boden und "hoch" ganz oben,
    // beim erholsamen Schlaf der REM-Anteil unten - genau wie im Vorbild.
    m.teile.slice().reverse().forEach(p => {
      const roh = q[p[0]] || 0;
      const wert = m.stapelProzent ? roh / summe * 100 : roh;
      const h = (H-PT-PB) * wert / hi;
      if(h <= 0) return;
      unten -= h;
      stapel += `<rect x="${(PL+bw*i+bw*0.26).toFixed(1)}" y="${unten.toFixed(1)}"
        width="${(bw*0.48).toFixed(1)}" height="${h.toFixed(1)}" fill="${p[2]}"
        data-tip="${dlong(t.date)} · ${esc(p[1])}: ${hm(roh)}"/>`;
    });
    // Bei gestapelten Saeulen steht die Summe oben, nicht jeder Teil einzeln
    const lab = (opts.labels && !m.stapelProzent)
      ? `<text class="vlabel" x="${X(i).toFixed(1)}" y="${(unten-7).toFixed(1)}"
         text-anchor="middle" fill="#fff">${hm(summe)}</text>` : "";
    return stapel + lab;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${letzteSpalte(tage, PL, bw, PT, H, PB, opts)}${raster}${saeulen}
    ${xAchse(tage, X, H, opts)}</svg>`;
}

// Schwebende Balken von der Zubettgeh- bis zur Aufstehzeit.
function chartFenster(tage, opts){
  opts = opts || {};
  const nutzbar = tage.filter(x => x.sleep.bedtime_min != null && x.sleep.time_in_bed_min);
  if(nutzbar.length < 2) return `<div class="muted small">zu wenige Nächte</div>`;
  const W = 400, H = opts.h || 190, PL = 40, PR = 12, PT = 22, PB = 30;
  const SPANNE = 16 * 60;                       // 19:00 bis 11:00
  const vonAbend = m => ((m - 19*60) % 1440 + 1440) % 1440;
  const Y = min => PT + (H-PT-PB) * (Math.max(0, Math.min(SPANNE, min)) / SPANNE);
  const bw = (W-PL-PR) / nutzbar.length;
  const X = i => PL + bw*i + bw/2;
  let raster = "";
  for(let s = 0; s <= 16; s += 4){
    raster += `<line class="gl" x1="${PL}" y1="${Y(s*60).toFixed(1)}" x2="${W-PR}"
        y2="${Y(s*60).toFixed(1)}"/>
      <text class="ax" x="${PL-5}" y="${(Y(s*60)+3).toFixed(1)}" text-anchor="end">${
        String((19+s)%24).padStart(2,"0")}:00</text>`;
  }
  const mittelVon = a => { const v = a.slice().sort((x,y) => x-y); return v[Math.floor(v.length/2)]; };
  const mBett = mittelVon(nutzbar.map(x => vonAbend(x.sleep.bedtime_min)));
  const mWach = mittelVon(nutzbar.map(x => vonAbend(x.sleep.bedtime_min) + x.sleep.time_in_bed_min));
  const linie = y => `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}"
    stroke="#C9D2DA" stroke-width="1" stroke-dasharray="4 4" opacity=".75"/>`;
  const balken = nutzbar.map((x,i) => {
    const a = vonAbend(x.sleep.bedtime_min);
    const b = a + x.sleep.time_in_bed_min;
    const letzter = i === nutzbar.length-1;
    const zeiten = (opts.alleZeiten || (letzter && opts.zeiten)) ? `
      <text class="vlabel" x="${X(i).toFixed(1)}" y="${(Y(a)-6).toFixed(1)}"
        text-anchor="middle" fill="#fff">${clock(x.sleep.bedtime_min)}</text>
      <text class="vlabel" x="${X(i).toFixed(1)}" y="${(Y(b)+12).toFixed(1)}"
        text-anchor="middle" fill="#fff">${clock(x.sleep.waketime_min)}</text>` : "";
    return `<rect x="${(PL+bw*i+bw*0.26).toFixed(1)}" y="${Y(a).toFixed(1)}"
      width="${(bw*0.48).toFixed(1)}" height="${Math.max(2, Y(b)-Y(a)).toFixed(1)}" rx="2"
      fill="${letzter ? "var(--sleep)" : "#6E757E"}"
      data-tip="${dlong(x.date)}: ${clock(x.sleep.bedtime_min)} – ${clock(x.sleep.waketime_min)}"
      />${zeiten}`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${letzteSpalte(nutzbar, PL, bw, PT, H, PB, opts)}${raster}
    ${linie(Y(mBett))}${linie(Y(mWach))}
    <text class="ax" x="${W-PR}" y="${PT-8}" text-anchor="end"
      style="fill:#C9D2DA">ÜBLICHE BETT-/AUFWACHZEIT</text>
    ${balken}${xAchse(nutzbar, X, H, opts)}</svg>`;
}

const VERHALTEN_EXTRA = [
  ["alkohol",         "Alkohol am Abend"],
  ["koffein_spaet",   "Koffein nach 16 Uhr"],

  ["kuehl_geschlafen","Kühl geschlafen"],
  ["krank",           "Krank gefühlt"],
  ["katze_im_zimmer", "Katze im Schlafzimmer"],
];
function verhaltenListe(){
  // Namen kommen aus dem Logbuchkatalog; was aktiv ist, bestimmst du dort.
  const namen = new Map(LOGBUCH_KATALOG.map(e => [e[0], e[2]]));
  VERHALTEN_EXTRA.forEach(([k,l]) => { if(!namen.has(k)) namen.set(k,l); });
  Object.entries(DATA.journal_labels || {}).forEach(([k,l]) => { if(!namen.has(k)) namen.set(k,l); });
  const schluessel = logbuchAktiv().filter(k => namen.has(k));
  // Was schon Messtage hat, verschwindet nicht aus der Auswertung
  Object.keys(DATA.journal_labels || {}).forEach(k => {
    if(!schluessel.includes(k)) schluessel.push(k);
  });
  return schluessel.map(k => [k, namen.get(k)]);
}
function journalSpeicher(){
  try { return JSON.parse(localStorage.getItem(JKEY) || "{}") || {}; } catch(e){ return {}; }
}
function journalAmTag(datum){
  const tag = D.find(d => d.date === datum);
  return Object.assign({}, (tag && tag.journal) || {}, journalSpeicher()[datum] || {});
}
// Nur die Einträge, die wirklich beantwortet sind (true oder false)
function journalBeantwortet(datum){
  const alles = journalAmTag(datum);
  return Object.keys(alles).filter(k => alles[k] === true || alles[k] === false);
}
function journalSetzen(datum, schluessel, an){
  const alles = journalSpeicher();
  const tag = Object.assign({}, alles[datum]);
  // undefined heißt "keine Antwort" - der Eintrag verschwindet dann ganz,
  // statt als "nein" gezählt zu werden.
  if(an === undefined) delete tag[schluessel]; else tag[schluessel] = an;
  alles[datum] = tag;
  try { localStorage.setItem(JKEY, JSON.stringify(alles)); return true; } catch(e){ return false; }
}
function verhaltenWirkung(schluessel, mindestens){
  mindestens = mindestens || 4;
  const mit = [], ohne = [];
  D.forEach(d => {
    const wert = d.recovery.score;
    if(wert == null) return;
    (journalAmTag(d.date)[schluessel] ? mit : ohne).push(wert);
  });
  if(mit.length < mindestens || ohne.length < mindestens) return null;
  const mittel = a => a.reduce((x,y)=>x+y,0) / a.length;
  const basis = mittel(ohne);
  if(!basis) return null;
  return {pct: Math.round((mittel(mit) - basis) / basis * 100), tage: mit.length};
}

function benachrichtigungen(){
  const d = day(), r = d.recovery, s = d.sleep;
  const raus = [];
  const NAMEN = {hrv:"HFV", rhr:"Ruheherzfrequenz", resp:"Atemfrequenz",
    spo2:"Blutsauerstoff", temp:"Hauttemperatur", sleep:"Schlafleistung"};

  // 1) Staerkster Treiber des Erholungswerts
  const drv = r.drivers || {};
  let top = null, tv = 0;
  for(const k in drv) if(Math.abs(drv[k]) > Math.abs(tv)){ top = k; tv = drv[k]; }
  if(top && Math.abs(tv) >= 0.6){
    const hoch = tv > 0;
    raus.push({
      id: `${d.date}-treiber-${top}`,
      titel: `${hoch ? "Höhere" : "Niedrigere"} ${NAMEN[top] || top}`,
      text: `Deine ${NAMEN[top] || top} liegt ${Math.abs(tv) >= 1.5 ? "deutlich" : "etwas"} ${
        hoch ? "über" : "unter"} deinem Normalbereich — ${n1(Math.abs(tv))} Standardabweichungen. ${
        hoch ? "Das ist heute der stärkste Grund für deinen Erholungswert."
             : "Das drückt deinen Erholungswert heute am deutlichsten."}`,
      ziel: "erholung",
    });
  }

  // 2) Schlafdefizit
  const vortag = D[S.day - 1];
  if(vortag && s.need && vortag.sleep.need){
    const diff = vortag.sleep.need.debt - s.need.debt;
    if(Math.abs(diff) >= 20){
      raus.push({
        id: `${d.date}-defizit`,
        titel: diff > 0 ? "Schlafdefizit abgebaut" : "Schlafdefizit gewachsen",
        text: diff > 0
          ? `Du hast dein Schlafdefizit um ${diff} Minuten verringert. Es bleiben ${
              hm(s.need.debt)} Stunden. Geh heute Abend früh ins Bett, um weiter aufzuholen.`
          : `Dein Schlafdefizit ist um ${Math.abs(diff)} Minuten gewachsen und liegt jetzt bei ${
              hm(s.need.debt)} Stunden.`,
        ziel: "schlaf",
      });
    }
  }

  // 3) Vitalwert ausserhalb des Normalbereichs
  const w = win();
  VITALE.forEach(m => {
    const st = vitalStand(m, r, w);
    if(st.beurteilbar && st.stufe === "deutlich"){
      raus.push({
        id: `${d.date}-vital-${m.k}`,
        titel: `${m.kurz || m.label} ${st.richtung === "hoch" ? "deutlich erhöht" : "deutlich niedrig"}`,
        text: st.richtung === "hoch" ? m.hoch : m.tief,
        ziel: "gesundheit",
      });
    }
  });

  // 4) Serie
  const serie = tageInFolge();
  if([7, 14, 30, 50, 100, 200, 365].includes(serie)){
    raus.push({
      id: `${d.date}-serie-${serie}`,
      titel: `${serie} Tage in Folge`,
      text: `Du trägst dein Band seit ${serie} Tagen ohne Unterbrechung. Je länger die Serie, desto belastbarer werden deine Normalbereiche.`,
      ziel: "streak",
    });
  }

  const weg = gelesene();
  return raus.filter(b => !weg.includes(b.id));
}

/* ---------- Atemuebung: Muster und Ablauf ---------- */
// Zwei Muster mit gegenlaeufiger Wirkung: langes Ausatmen bremst den Puls,
// langes Einatmen hebt ihn. Die Schleife raeumt sich selbst auf, sobald der
// Kreis nicht mehr im Dokument steht.
let atemLauf = null;
const ATEM = {
  beruhigen:  {name:"Erhöhe die Entspannung", ein:4, halten:2, aus:6, farbe:"61,123,255",
    hinweis:"Ausatmen länger als Einatmen — das bremst den Puls. Für Anspannung und vor dem Schlafen."},
  aktivieren: {name:"Wachsamkeit erhöhen", ein:6, halten:0, aus:2, farbe:"255,138,30",
    hinweis:"Einatmen länger als Ausatmen — das hebt Puls und Wachheit. Vor einer Einheit oder bei Müdigkeit."},
};

function atemStart(art){
  const m = ATEM[art];
  if(!m) return;
  atemLauf = {art, start: performance.now()};
  const zyklus = (m.ein + m.halten + m.aus) * 1000;

  (function schritt(jetzt){
    const kreis = document.getElementById("atem-kreis");
    const zahl = document.getElementById("atem-zahl");
    const phase = document.getElementById("atem-phase");
    if(!kreis || !atemLauf || atemLauf.art !== art) return;

    const t = ((jetzt - atemLauf.start) % zyklus) / 1000;
    let skala, rest, txt;
    if(t < m.ein){
      const f = t / m.ein;
      skala = 0.52 + 0.48 * (1 - Math.pow(1-f, 2));
      rest = m.ein - t; txt = "Einatmen";
    } else if(t < m.ein + m.halten){
      skala = 1; rest = m.ein + m.halten - t; txt = "Halten";
    } else {
      const f = (t - m.ein - m.halten) / m.aus;
      skala = 1 - 0.48 * (1 - Math.pow(1-f, 2));
      rest = zyklus/1000 - t; txt = "Ausatmen";
    }
    kreis.style.transform = `scale(${skala.toFixed(3)})`;
    zahl.textContent = String(Math.ceil(rest));
    phase.textContent = txt;
    requestAnimationFrame(schritt);
  })(performance.now());
}

/* ---------- Schlaffenster ---------- */
function schlafFenster(w){
  const tage = w.filter(x => x.sleep.bedtime_min != null && x.sleep.time_in_bed_min);
  if(tage.length < 3) return `<div class="muted small">zu wenige Nächte</div>`;
  const W = 400, H = 160, PL = 34, PR = 10, PT = 10, PB = 22;
  const SPANNE = 18 * 60;
  const vonAbend = m => ((m - 18*60) % 1440 + 1440) % 1440;
  const Y = min => PT + (H-PT-PB) * (min / SPANNE);
  const bw = (W-PL-PR) / tage.length;

  let raster = "";
  for(let s = 0; s <= 18; s += 3){
    const y = Y(s*60);
    raster += `<line class="gl" x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}"/>
      <text class="ax" x="${PL-6}" y="${y+3}" text-anchor="end">${String((18+s)%24).padStart(2,"0")}</text>`;
  }
  const mittelVon = a => { const s=[...a].sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; };
  const mBett = mittelVon(tage.map(x => vonAbend(x.sleep.bedtime_min)));
  const mWach = mittelVon(tage.map(x => vonAbend(x.sleep.bedtime_min) + x.sleep.time_in_bed_min));
  const linie = (y, t) => `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="var(--dim2)"
      stroke-width="1" stroke-dasharray="4 4"/>
    <text class="ax" x="${W-PR}" y="${y-4}" text-anchor="end">${esc(t)}</text>`;

  const balken = tage.map((x,i)=>{
    const a = vonAbend(x.sleep.bedtime_min);
    const b = a + x.sleep.time_in_bed_min;
    const letzterTag = i === tage.length-1;
    return `<rect x="${(PL+bw*i+bw*0.22).toFixed(1)}" y="${Y(a).toFixed(1)}"
      width="${(bw*0.56).toFixed(1)}" height="${Math.max(2, Y(b)-Y(a)).toFixed(1)}" rx="2"
      fill="${letzterTag ? "#fff" : "var(--sleep)"}" opacity="${letzterTag ? 1 : 0.72}"
      data-tip="${dlong(x.date)}: ${clock(x.sleep.bedtime_min)} – ${clock(x.sleep.waketime_min)}"/>`;
  }).join("");

  const schritt = Math.max(1, Math.ceil(tage.length/5));
  const xl = tage.map((x,i)=> i%schritt===0
    ? `<text class="ax" x="${(PL+bw*i+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${dshort(x.date)}</text>` : "").join("");

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${raster}${balken}${linie(Y(mBett),"üblich ins Bett")}${linie(Y(mWach),"üblich auf")}${xl}</svg>`;
}

/* ---------- Heutige Aktivitäten ---------- */
// Eine Zeile je Einheit: farbige Marke mit Kennzahl, Name, Zeitspanne und
// rechts ein Strich, der zeigt, wann am Tag das stattfand.
function einheitZeile(o){
  const balken = (o.von == null || o.bis == null) ? "" : (() => {
    const a = Math.max(0, Math.min(1, o.von / 1440));
    const b = Math.max(0, Math.min(1, o.bis  / 1440));
    const oben = Math.min(a, b) * 100, hoehe = Math.max(4, Math.abs(b - a) * 100);
    return `<span class="ebahn"><i style="top:${oben.toFixed(1)}%;height:${
      hoehe.toFixed(1)}%;background:${o.farbe}"></i></span>`;
  })();
  // Die ganze Zeile ist ein Knopf - Antippen führt in die passende Rubrik.
  return `<button class="aktzeile" data-goto="${esc(o.ziel || "aktivitaeten")}">
    <span class="apille" style="background:${o.farbe};color:${o.schrift || "#fff"}">
      ${o.icon}<b>${esc(o.wert)}</b></span>
    <span class="aname">${esc(o.name)}</span>
    <span class="azeit">${o.zeiten.map(z => `<span>${esc(z)}</span>`).join("")}</span>
    ${balken}</button>`;
}

function heutigeEinheiten(d){
  const zeilen = [];
  const s = d.sleep;
  if(s.duration_min != null){
    // Beginnt der Schlaf vor Mitternacht, gehört die Zubettgehzeit zum Vortag
    const vorabend = s.bedtime_min > s.waketime_min;
    const gestern = D[S.day-1];
    zeilen.push(einheitZeile({
      ziel:"schlaf", farbe:"var(--sleep)", schrift:"#08121A", icon:ICON_MOND_KLEIN,
      wert:hm(s.duration_min), name:"Schlaf",
      zeiten:[(vorabend && gestern ? `[${dshort(gestern.date).split(" ")[0]}.] ` : "")
              + clock(s.bedtime_min), clock(s.waketime_min)],
      von:vorabend ? 0 : s.bedtime_min, bis:s.waketime_min,
    }));
  }
  alleAktivitaeten(d).forEach(a => {
    const ende = a.duration_min != null ? null
      : (a.start_min != null ? a.start_min + Math.round(a.duration_sec/60) : null);
    zeilen.push(einheitZeile({
      farbe:a.manual ? "#3A4049" : "var(--blue)",
      icon:aktivitaetsIcon(a.name), wert:a.manual ? "–" : n1(a.strain),
      name:a.name,
      zeiten:a.manual
        ? [a.duration_min ? hm(a.duration_min) + " h" : "nachgetragen"]
        : [clock(a.start_min), clock(ende)],
      von:a.manual ? null : a.start_min, bis:a.manual ? null : ende,
    }));
  });
  return zeilen;
}

// Richtwert, wie lange eine Einheit heute laufen müsste, um das Belastungs-
// ziel zu erreichen. Die Belastung je Minute kommt aus DEINEN eigenen
// Einheiten dieser Sportart - ohne mindestens vier davon gibt es keinen Wert.
function einheitVorschlaege(d){
  const erholung = d.recovery.score;
  if(erholung == null) return [];
  const ziel = Math.round((6 + erholung/100 * 12) * 10) / 10;
  const offen = ziel - d.strain.score;
  if(offen < 1) return [];
  const proSport = new Map();
  D.forEach(x => (x.activities || []).forEach(a => {
    if(!a.strain || !a.duration_sec) return;
    if(!proSport.has(a.name)) proSport.set(a.name, []);
    proSport.get(a.name).push(a.strain / (a.duration_sec / 60));
  }));
  return [...proSport.entries()]
    .filter(([, v]) => v.length >= 4)
    .map(([name, v]) => ({name, minuten:Math.round(offen / medianVon(v) / 5) * 5, ziel}))
    .filter(x => x.minuten >= 10 && x.minuten <= 150)
    .sort((a,b) => a.minuten - b.minuten)
    .slice(0, 2);
}

/* ================= Schlafplaner und Wochenplan ================= */
// Alles hier ist Planung, keine Messung: Ziele und Weckzeit gibst du vor, sie
// liegen im Browser dieses Geräts. Verglichen wird aber immer gegen deine
// eigenen gemessenen Werte - ein Ziel ohne Ausgangswert gibt es nicht.

const PLANKEY = "claudehealth.plan";
function planLesen(){
  try { const v = JSON.parse(localStorage.getItem(PLANKEY) || "null"); return v || null; }
  catch(e){ return null; }
}
function planSchreiben(p){
  try {
    if(p) localStorage.setItem(PLANKEY, JSON.stringify(p));
    else localStorage.removeItem(PLANKEY);
    return true;
  } catch(e){ return false; }
}

const isoVon = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${
  String(d.getDate()).padStart(2,"0")}`;

// Montag bis Sonntag der Woche, in der der gewählte Tag liegt.
function wocheTage(){
  const heute = day().date;
  const d = new Date(heute + "T00:00");
  const start = new Date(d);
  start.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const liste = [];
  for(let i = 0; i < 7; i++){
    const x = new Date(start); x.setDate(start.getDate() + i);
    const iso = isoVon(x);
    liste.push({iso, wd:WD[i], tag:D.find(y => y.date === iso) || null, offen:iso > heute});
  }
  return liste;
}

   schritt:15, gut:[420,240], intensitaet:"Grundlage",
   rat:"Der größte Teil deines Umfangs gehört in die niedrigen Zonen."},
];
const metrikVon = k => PLAN_METRIKEN.find(m => m.k === k);

// Mittel der letzten N Tage bzw. Wochensumme der letzten vier Wochen
function metrikMittel(m, tage){
  tage = tage || 30;
  const fenster = D.slice(Math.max(0, S.day + 1 - tage), S.day + 1);
  if(m.woche){
    const wochen = Math.max(1, Math.round(fenster.length / 7));
    const summe = fenster.map(m.wert).filter(v => v != null).reduce((a,b) => a+b, 0);
    return summe / wochen;
  }
  const werte = fenster.map(m.wert).filter(v => v != null && !isNaN(v));
  return werte.length ? werte.reduce((a,b) => a+b, 0) / werte.length : null;
}
// Vorschlag fürs Wochenziel: ein Schritt über dem eigenen Durchschnitt
function metrikVorschlag(m){
  const mittel = metrikMittel(m);
  if(mittel == null) return null;
  const zu = m.k === "schlafleistung" ? 5 * 1
    : m.k === "regelmaessigkeit" ? 5
    : m.k === "schritte" ? 500
    : m.k === "schlafstunden" ? 15
    : m.k === "belastung" ? 1
    : m.schritt;
  const ziel = Math.round((mittel + zu) / m.schritt) * m.schritt;
  return m.k === "schlafleistung" || m.k === "regelmaessigkeit" ? Math.min(100, ziel) : ziel;
}

}

// Aus einer Vorlage einen bearbeitbaren Entwurf machen - mit Zielen, die aus

function entwurfAusVorlage(k){
  if(k === "eigen") return {k:"eigen", name:"Benutzerdefinierter Plan",
    text:"Erstelle deinen persönlichen Plan, indem du wöchentliche Kennzahlen, Verhaltensweisen und Aktivitätsziele auswählst.",

      .filter(x => x.ziel != null),
    verhalten:v.verhalten.map(x => ({k:x.k, tage:4, vermeiden:!!x.vermeiden})),
    aktivitaeten:v.aktivitaeten.map(ak => ({k:ak, tage:2})),
  };

/* ---------- Fortschritt ---------- */
// Je Ziel: an wie vielen Tagen dieser Woche war es erfüllt?
function planFortschritt(p){
  if(!p) return null;
  const woche = wocheTage();
  const ziele = [];
  (p.metriken || []).forEach(z => {
    const m = metrikVon(z.k);
    if(!m) return;
    if(m.woche){
      const summe = woche.filter(t => t.tag).map(t => m.wert(t.tag))
        .filter(v => v != null).reduce((a,b) => a+b, 0);
      ziele.push({art:"metrik", m, ziel:z.ziel, wochenwert:summe,
        erreicht:summe >= z.ziel ? 1 : 0, von:1,
        titel:`${m.kurzFmt(z.ziel)} in ${esc(m.l)}`, tage:woche});
    } else {
      const tage = woche.map(t => ({...t,
        ok:t.tag && m.wert(t.tag) != null && m.wert(t.tag) >= z.ziel}));
      ziele.push({art:"metrik", m, ziel:z.ziel,
        erreicht:tage.filter(t => t.ok).length, von:7,
        titel:`${m.kurzFmt(z.ziel)}+ ${esc(m.l)}`, tage});
    }
  });
  (p.verhalten || []).forEach(z => {
    const l = (verhaltenListe().find(x => x[0] === z.k) || [z.k, z.k])[1];
    // Ob etwas vermieden werden soll, steht im Ziel selbst. Nur wenn das
    // fehlt, entscheidet die gemessene Wirkung.
    const w = verhaltenWirkung(z.k);
    const vermeiden = z.vermeiden != null ? z.vermeiden : (w != null && w.pct < 0);
    const tage = woche.map(t => ({...t,
      ok:t.tag ? (!!journalAmTag(t.iso)[z.k] !== vermeiden) : false}));
    ziele.push({art:"verhalten", schluessel:z.k, ziel:z.tage,
      erreicht:tage.filter(t => t.ok).length, von:z.tage,
      titel:(vermeiden ? "Vermeide " : "") + l, tage});
  });
  (p.aktivitaeten || []).forEach(z => {
    const g = AKT_GRUPPEN.find(x => x.k === z.k);
    if(!g) return;
    const tage = woche.map(t => ({...t,
      ok:!!(t.tag && alleAktivitaeten(t.tag).some(a => g.test(a.name)))}));
    ziele.push({art:"aktivitaet", ziel:z.tage, erreicht:tage.filter(t => t.ok).length,
      von:z.tage, titel:g.l, tage});
  });
  const soll = ziele.reduce((a,z) => a + z.von, 0);
  const ist  = ziele.reduce((a,z) => a + Math.min(z.erreicht, z.von), 0);
  const uebrig = woche.filter(t => t.offen).length;
  return {ziele, prozent:soll ? Math.round(ist/soll*100) : 0, uebrig, woche};
}

/* ---------- Schlafplaner: Zeiten ---------- */
const SCHLAFZIELE = [
  ["wochenplan", "Mein Wochenplan-Ziel erreichen"],
  ["verbessern", "Meinen Schlaf verbessern"],
  ["bedarf",     "Meinen Schlafbedarf erreichen"],
];
function schlafZielAnteil(){
  const p = schlafplan();
  const art = p.zielart || "wochenplan";
  if(art === "bedarf") return 1.00;
  if(art === "verbessern") return 0.90;
  const plan = planLesen();
  const z = plan && (plan.metriken || []).find(x => x.k === "schlafleistung");
  return z ? Math.min(1, z.ziel/100) : 0.87;
}
function planerZeiten(){
  const s = day().sleep;
  const w = win();
  const ueblichWach = medianVon(w.map(x => x.sleep.waketime_min));
  const effizienz = medianVon(w.map(x => x.sleep.efficiency)) ?? 90;
  const p = schlafplan();
  const weck = hhmmZuMin(p.weckzeit) ?? ueblichWach ?? 7*60;
  const bedarf = s.need ? s.need.total : null;
  if(bedarf == null) return null;
  const anteil = schlafZielAnteil();
  const schlafZeit = Math.round(bedarf * anteil);
  const imBett = Math.round(schlafZeit / (effizienz/100));
  const bett = ((weck - imBett) % 1440 + 1440) % 1440;
  // Optimales Fenster: volle Deckung des Bedarfs als obere Grenze
  const imBettVoll = Math.round(bedarf / (effizienz/100));
  return {bett, weck, imBett, bedarf, schlafZeit, effizienz,
    optimalBis:((weck - imBettVoll) % 1440 + 1440) % 1440,
    zielart:p.zielart || "wochenplan"};
}
