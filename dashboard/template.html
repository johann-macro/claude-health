<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude Health</title>
<style>
:root{
  /* Grundton nach dem Vorbild: sehr dunkles Türkis statt neutralem Schwarz.
     Karten sind leicht aufgehellte, durchscheinende Flächen - so nehmen sie
     den Verlauf dahinter auf, statt als graue Kästen darauf zu liegen. */
  --bg:#070C11;
  --card:rgba(255,255,255,.052); --card2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.075);
  --nav:#0A1017;
  --text:#FFFFFF; --dim:#9BA1A9; --dim2:#6C737C;
  --green:#00F19F; --yellow:#FFDE00; --red:#FF0026;
  --blue:#0093E7; --sleep:#7BA1BB;
  --z5:#FF7A00; --z4:#FFB020; --z3:#00C07F; --z2:#2E9BE6; --z1:#8A939D; --z0:#E8EDF2;
  --awake:#6B737C; --light:#8E7CC3; --deep:#D64FC8; --rem:#5F5BD9;
  /* -apple-system zuerst: auf dem iPhone ist das SF Pro, die sauberste
     verfügbare Grotesk. Vorher stand "Segoe UI" davor - das gibt es dort
     nicht, es wurde aber trotzdem zuerst geprüft. */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,
    "Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* App-Aufbau: die Seite selbst scrollt nie. Kopf und Reiter stehen fest,
   gescrollt wird nur der Inhaltsbereich. Das ist nicht nur sauberer - es ist
   die Voraussetzung dafür, dass beim Wischen wirklich NUR waagerecht bewegt
   wird. Solange das Dokument selbst scrollt, springt beim Rubrikwechsel
   zwangsläufig auch die Höhe. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#04080C;color:var(--text);font-family:var(--font);margin:0;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* Hintergrund nach dem Vorbild, aus drei übereinanderliegenden Verläufen:
   1. der helle, entsättigte Schimmer oben links
   2. das kräftigere Türkis oben, etwas rechts der Mitte
   3. der Grundverlauf, der nach unten hin fast ins Schwarze läuft
   Der Verlauf sitzt auf #app und scrollt deshalb nicht mit - gescrollt wird
   nur der Inhalt darin. */
#app{max-width:460px;margin:0 auto;height:100%;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:
    radial-gradient(92% 38% at 14% -2%, rgba(198,226,232,.050) 0%, rgba(198,226,232,0) 58%),
    radial-gradient(78% 40% at 64% 0%, rgba(28,116,116,.115) 0%, rgba(28,116,116,0) 64%),
    linear-gradient(180deg, #0A121A 0%, #081018 26%, #070C12 56%, #05090E 82%, #04080C 100%);
  background-color:var(--bg)}

/* Streifen für die Anzeige des Telefons: Uhrzeit, Empfang, Akku und die
   Kameraaussparung. Bleibt bewusst leer - hier steht nur der Hintergrund. */
.statusleiste{flex:0 0 auto;height:max(40px, env(safe-area-inset-top))}
.top{flex:0 0 auto;z-index:20}
/* Name der App bzw. der offenen Rubrik, mittig unter der Kopfzeile - dort,
   wo im Vorbild "WHOOP" steht. */
.apptitel{text-align:center;font-size:11.5px;letter-spacing:.20em;font-weight:700;
  text-transform:uppercase;color:rgba(255,255,255,.78);padding:2px 16px 14px}
.apptitel[hidden]{display:none}
/* Bühne: hier liegen alte und neue Ansicht übereinander */
#buehne{flex:1 1 auto;position:relative;overflow:hidden}
#view,.altansicht{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#view::-webkit-scrollbar,.altansicht::-webkit-scrollbar{width:0;height:0;display:none}
.altansicht{pointer-events:none;z-index:1}
@media(min-width:520px){#app{box-shadow:0 0 0 1px #1a1d22}}

.lbl{font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--dim);font-weight:600}
.num{font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:14px;padding:16px;margin:10px 14px;position:relative}
.calc{position:absolute;top:11px;right:11px;line-height:0;cursor:help;z-index:2}
.calc.inline{position:static;display:inline-block;vertical-align:-5px;margin-left:6px}
.calclegend{display:flex;align-items:center;gap:9px;margin:4px 14px 8px;padding:9px 12px;
  border-radius:10px;background:#15181D;color:var(--dim);font-size:11.5px;line-height:1.45}
.calclegend svg{flex:0 0 19px}
.card.tight{padding:13px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--dim)}
.small{font-size:11.5px}
.hr{height:1px;background:var(--line);margin:12px 0}

/* Kopfzeile */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
/* Inhalt ist ein SVG, kein Textzeichen. Ein Zeichen sitzt auf der Schriftlinie
   und lässt sich in einem Kreis nie sauber zentrieren - ein SVG-Kasten schon. */
.avatar{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--dim2);
  display:flex;align-items:center;justify-content:center;color:var(--dim);background:none;
  cursor:pointer;padding:0;flex:0 0 34px;line-height:0}
.avatar svg{display:block}
.avatar:hover{border-color:var(--dim);color:var(--text)}
.datenav{display:flex;align-items:center;gap:14px}
.datenav button{background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:4px 6px}
.datenav button:disabled{opacity:.25;cursor:default}
.datenav .d{font-size:11.5px;letter-spacing:.14em;font-weight:700;text-transform:uppercase;min-width:104px;text-align:center}
.batt{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}

/* Reiter */
/* Die Rubriken liegen auf dem Rand einer gedachten Scheibe, die man von
   schräg oben fast von der Seite sieht. Die Scheibe selbst ist unsichtbar -
   nur die Anordnung verrät sie. Die waagerechte Position kommt aus dem Sinus
   des Winkelabstands zur aktiven Rubrik, Größe und Helligkeit aus dem
   Cosinus, also aus der Tiefe. */
nav.scheibe{position:relative;height:62px;flex:0 0 auto;overflow:hidden;touch-action:none;
  /* Zu den Seiten hin ausblenden statt abschneiden - die weiter hinten
     liegenden Rubriken sollen in den Hintergrund verschwinden. */
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%)}
nav.scheibe[hidden]{display:none}
nav.scheibe button{position:absolute;left:50%;top:50%;background:none;border:0;padding:6px 10px;
  font-family:inherit;font-size:15.5px;font-weight:800;letter-spacing:.005em;white-space:nowrap;
  cursor:pointer;color:#8A939D;transform-origin:50% 50%;
  transition:transform .44s cubic-bezier(.3,0,.2,1),opacity .44s,color .34s}
nav.scheibe button[aria-selected=true]{color:#00F19F}
/* Während des Ziehens keine Übergänge - die Scheibe soll dem Finger
   unmittelbar folgen, nicht ihm hinterherlaufen. */
nav.scheibe.zieht button{transition:none}

/* Ringe */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 10px 2px}
.ringwrap{text-align:center;cursor:pointer;border:0;background:none;font-family:inherit;padding:6px 0}
.ringwrap .cap{margin-top:2px;font-size:10px;letter-spacing:.12em;color:var(--dim);font-weight:700}
.ringtxt-brand{font-size:7px;letter-spacing:.16em;fill:var(--dim2);font-weight:700}
.ringtxt-val{font-weight:800;letter-spacing:-.04em;fill:var(--text)}
.ringtxt-unit{font-weight:800;fill:var(--text)}

/* Kacheln */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 14px}
.grid2 .card{margin:0}
.tile-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}

/* Listenzeilen */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .ic{width:22px;text-align:center;color:var(--dim);flex:0 0 22px}
.lrow .tx{flex:1;min-width:0}
.lrow .vl{text-align:right}
.trend{font-size:10px;margin-left:3px}
.up{color:var(--green)} .dn{color:var(--red)}

/* Balken */
.bar{height:6px;background:#20242B;border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:3px;transform-origin:left;
  transform:scaleX(0);animation:grow .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}

/* Zonenzeilen */
.zrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.zrow .zl{width:96px;flex:0 0 96px}
.zrow .zb{flex:1;height:9px;background:repeating-linear-gradient(45deg,#1c2027,#1c2027 3px,#12151a 3px,#12151a 6px);border-radius:2px;overflow:hidden}
.zrow .zb>span{display:block;height:100%;transform-origin:left;transform:scaleX(0);
  animation:grow .8s cubic-bezier(.2,.7,.3,1) forwards}
.zrow .zt{width:58px;text-align:right;flex:0 0 58px;font-variant-numeric:tabular-nums}

/* Einsicht */
.insight{border-radius:14px;padding:15px;margin:10px 14px;background:
  linear-gradient(#13161B,#13161B) padding-box,
  linear-gradient(110deg,#3E6BFF,#00C4CC) border-box;border:1px solid transparent}
.insight a{color:#7FB4FF;text-decoration:none;font-size:10.5px;letter-spacing:.10em;
  font-weight:700;text-transform:uppercase}

/* Umschalter Zeitraum */
.seg{display:inline-flex;background:#191D23;border-radius:999px;padding:3px;gap:2px}
/* Fingerfreundlich: mindestens 44 px hoch, sonst am Handy kaum zu treffen */
.seg button{background:none;border:0;color:var(--dim);font-family:inherit;cursor:pointer;
  padding:11px 16px;min-height:40px;border-radius:999px;font-size:11.5px;font-weight:700;
  letter-spacing:.08em}
.seg button[aria-pressed=true]{background:#2C323A;color:var(--text)}

/* Diagramme */
svg{display:block;overflow:visible}
.gl{stroke:#20242B;stroke-width:1}
.ax{fill:var(--dim2);font-size:9.5px;font-weight:600;letter-spacing:.04em}
.dl{stroke-linecap:round;stroke-linejoin:round;fill:none}
.vlabel{font-size:9.5px;font-weight:800;letter-spacing:-.01em}
.chartnote{color:var(--dim);font-size:11.5px;line-height:1.5;margin-top:10px}

/* Aktivitätszeile */
.act{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .pill{width:62px;flex:0 0 62px;border-radius:8px;padding:7px 0;text-align:center;
  font-weight:800;font-size:14px;letter-spacing:-.02em}

.badge{font-size:9.5px;letter-spacing:.10em;font-weight:800;padding:3px 8px;border-radius:999px;
  text-transform:uppercase}
.sq{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 9px}

footer{margin:26px 14px 0;padding-top:14px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--dim2)}
footer a{color:var(--dim);text-decoration:none}
.demo{margin:0 14px 4px;padding:9px 12px;border-radius:10px;background:#1A1508;
  border:1px solid #3A2E0A;color:#FFD24A;font-size:11px;line-height:1.45}

/* Tooltip */
#tip{position:fixed;pointer-events:none;background:#22262E;border:1px solid #343A43;
  border-radius:8px;padding:7px 10px;font-size:11.5px;z-index:99;opacity:0;transition:opacity .1s;
  white-space:nowrap;box-shadow:0 6px 22px rgba(0,0,0,.6)}
/* ================= Startseite im neuen Zuschnitt ================= */
/* Kopfzeile: Profil und Serie links, Datumsregler mittig. Rechts bleibt es
   leer - der Ladezustand des Fitbit steht in keiner Schnittstelle, und eine
   erfundene Prozentzahl kommt nicht in Frage. */
header{display:flex;align-items:center;gap:10px;padding:4px 16px 2px;min-height:46px}
.kopf-links{display:flex;align-items:center;gap:9px;flex:1 1 0}
.kopf-rechts{flex:1 1 0;display:flex;align-items:center;justify-content:flex-end}
.streak{display:flex;align-items:center;gap:5px;background:none;border:0;cursor:pointer;
  padding:4px 2px;font-family:inherit;color:#fff;font-size:15px;font-weight:800;
  letter-spacing:-.01em;line-height:1}
.streak svg{display:block}

.datenav{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.datenav button{background:none;border:0;color:#fff;cursor:pointer;padding:6px;
  display:flex;align-items:center;justify-content:center;line-height:0}
.datenav button:disabled{opacity:.22;cursor:default}
.datenav button[hidden],.datenav .d[hidden]{display:none}
.datenav .d{font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;
  min-width:86px;text-align:center;background:rgba(255,255,255,.10);border-radius:999px;
  padding:8px 14px;color:#fff}

/* Wortmarke: Serife für den Namen, Grotesk für das Produkt */
/* Feste Höhe: sonst ändert sich die Kopfhöhe zwischen den Bildschirmen,
   und der Inhalt rutscht beim Wechsel senkrecht - genau das soll nicht sein. */
.marke{height:80px;display:flex;align-items:center;justify-content:center;
  padding:0 16px;line-height:1}
.marke .n{font-family:var(--serif);font-size:21px;letter-spacing:.005em;color:#fff}
.marke .p{font-size:17px;letter-spacing:.20em;font-weight:600;color:#fff;margin-left:.42em}

/* Drei Ringe: näher beieinander, mehr Luft zum Rand */
.ringreihe{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 22px 8px}
.ringzelle{display:flex;flex-direction:column;align-items:center;gap:11px}
.ringzelle .rlabel{display:flex;align-items:center;gap:4px;background:none;border:0;
  cursor:pointer;font-family:inherit;color:#fff;font-size:11.5px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;padding:2px;line-height:1}
.ringzelle .rlabel svg{display:block;opacity:.85}

/* Karten im neuen Zuschnitt */
.karte{background:var(--card);border-radius:16px;padding:17px 16px;margin:12px 16px;
  position:relative}
.karte.klick{cursor:pointer}
.kopfzeile{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;line-height:1.3}
.kopfzeile svg{flex:0 0 auto;opacity:.65;margin-top:1px}
.abschnitt{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#fff;
  padding:36px 16px 14px}

/* Einsicht-Karte: ruhig, weiß, kein Farbrahmen */
.einsicht .ti{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.01em;margin-bottom:7px}
.einsicht .tx{font-size:14px;line-height:1.5;color:rgba(255,255,255,.80)}
.haken{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;
  font-size:12px;font-weight:700;flex:0 0 auto}

/* Zeile "Mein Tag" */
.tagzeile{display:flex;align-items:center;gap:10px;margin:0 16px 9px}
.tagmarke{width:42px;height:42px;border-radius:14px;background:var(--card);
  display:flex;align-items:center;justify-content:center;flex:0 0 42px;
  font-family:var(--serif);font-size:19px;color:#D77757}
.tagfeld{flex:1;background:var(--card);border-radius:14px;padding:14px 15px;cursor:pointer;
  display:flex;align-items:center;gap:11px;border:0;font-family:inherit;text-align:left}
.tagfeld .lab{flex:1;font-size:14.5px;font-weight:600;color:#fff}
.tagfeld svg{opacity:1;color:#8A939D}

/* ================= Schlaf ================= */
/* Vier antippbare Zeilen unter dem Ring */
.qzeile{display:flex;align-items:center;gap:11px;width:100%;padding:15px 0;
  background:none;border:0;border-bottom:1px solid var(--line);font-family:inherit;
  cursor:pointer;text-align:left;color:inherit}
.qzeile:last-child{border-bottom:0}
.qzeile .qic,.ezeile .qic{flex:0 0 22px;color:rgba(255,255,255,.75);line-height:0}
.qzeile .qlab,.ezeile .qlab{flex:1;font-size:11.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:#fff;line-height:1.25}
.qzeile .qskala{display:flex;gap:4px;flex:0 0 56px;align-items:center}
.qzeile .qskala i{height:4px;border-radius:2px;flex:1}
.qzeile .qwert{font-size:19px;font-weight:800;letter-spacing:-.03em;min-width:52px;
  text-align:right;font-variant-numeric:tabular-nums;color:#fff}
.qlegende{display:flex;justify-content:center;gap:16px;margin:2px 16px 4px;
  font-size:11.5px;color:var(--dim)}
.qlegende i{display:inline-block;width:13px;height:4px;border-radius:2px;
  margin-right:6px;vertical-align:2px}

/* Einsicht mit Verweis auf den Coach */
.insightlink{display:flex;align-items:center;gap:7px;background:none;border:0;padding:14px 0 4px;
  min-height:40px;
  font-family:inherit;cursor:pointer;color:#8FB6FF;font-size:10.5px;letter-spacing:.10em;
  font-weight:800;text-transform:uppercase}
.insightlink svg{display:block}

/* Phasenzeilen mit Normalmarke */
.phring{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid;
  vertical-align:-2px;margin-right:8px}
.phname{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff}
.phpct{font-size:11px;font-weight:700;margin-left:7px}
.phbahn{position:relative;height:11px;border-radius:2px;
  background:repeating-linear-gradient(45deg,#1c2027,#1c2027 3px,#12151a 3px,#12151a 6px)}
.phbahn>span{display:block;height:100%;border-radius:2px;transform-origin:left;
  transform:scaleX(0);animation:grow .75s cubic-bezier(.2,.7,.3,1) forwards}
.phbahn>b{position:absolute;top:-2px;bottom:-2px;width:1px;background:#E6ECF1;opacity:.8}
.bedarfbahn{height:15px;border-radius:3px;background:#181C22;overflow:hidden}
.bedarfbahn>span{display:block;height:100%;transform-origin:left;transform:scaleX(0);
  animation:grow .8s cubic-bezier(.2,.7,.3,1) forwards}

/* Vorschaukarten der Wochentrends */
.wochenkarte{display:block;width:calc(100% - 32px);text-align:left;border:0;
  font-family:inherit;color:inherit;cursor:pointer}
.wlegende{display:flex;justify-content:center;gap:16px;margin-bottom:8px;
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--dim)}
.wlegende i{margin-right:6px;vertical-align:1px}
.wlegende i.pk{display:inline-block;width:9px;height:9px;border-radius:50%;
  border:2px solid;background:none}

/* Auswahlfeld der Trendanzeige */
.tdrop{display:flex;align-items:center;gap:12px;width:100%;background:var(--card2);
  border:0;border-radius:14px;padding:16px 15px;font-family:inherit;cursor:pointer;color:#fff}
.tdrop .ic{line-height:0;color:rgba(255,255,255,.75);flex:0 0 auto}
.tdrop .lab{flex:1;text-align:left;font-size:12.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase}
.tdrop .ch{line-height:0;flex:0 0 auto}
.tliste{margin-top:2px;border-radius:14px;overflow:hidden;background:rgba(10,14,19,.92)}
.tgruppe{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);
  font-weight:700;padding:14px 16px 6px}
.teintrag{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;
  padding:13px 16px;font-family:inherit;cursor:pointer;color:#fff;text-align:left}
.teintrag .ic{line-height:0;color:rgba(255,255,255,.62);flex:0 0 22px}
.teintrag .lab{font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.teintrag[aria-current=true]{background:rgba(255,255,255,.07)}

/* Zeitraum-Kopf */
.dchip{display:inline-block;padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:800}
.dchip.gut{background:rgba(0,241,159,.16);color:var(--green)}
.dchip.schlecht{background:rgba(255,176,32,.16);color:var(--z4)}
.dchip.neutral{background:rgba(255,255,255,.08);color:var(--dim)}
.zeitnav{display:flex;align-items:center;gap:6px}
.zeitnav button{background:none;border:0;color:#fff;cursor:pointer;padding:6px;line-height:0}
.zeitnav button:disabled{opacity:.22;cursor:default}
.zeitnav .zt{font-size:10.5px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;
  min-width:104px;text-align:center;color:#fff}
.zeitnav button{padding:6px 2px}
.dchip{white-space:nowrap}
.kopfinfo{background:none;border:1.4px solid rgba(255,255,255,.30);border-radius:50%;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.85);cursor:pointer;flex:0 0 34px;padding:0;margin-left:auto}
.kopfinfo svg{display:block;width:19px;height:19px}
.karte>.infoknopf svg{display:block;width:17px;height:17px}
/* Der Knopf in den Karten sitzt oben rechts in der Karte - wie im Vorbild.
   Die Regel dafuer steht weiter unten beim Stressmonitor (.infoknopf). */
.karte>.infoknopf{top:14px;right:14px;width:28px;height:28px}

/* Grosser Ring oben in Schlaf und Erholung: dort faellt die Wortmarke weg */
.marke[hidden]{display:none}

/* Kennzahlenbox mit Spitze zum Ring hin. Die Spitze ist Teil der Box -
   gleiche Farbe, direkt an der Oberkante, mittig. */
.karte.spitze{margin-top:26px}
.karte.spitze::before{content:"";position:absolute;left:50%;top:-12px;
  transform:translateX(-50%);width:0;height:0;
  border-left:16px solid transparent;border-right:16px solid transparent;
  border-bottom:12px solid rgba(255,255,255,.052)}

/* Karten, die selbst ein Knopf sind: width:100% wuerde die Aussenabstaende
   der Karte ignorieren und 32 px ueber den Rand laufen. */
button.karte{display:block;width:calc(100% - 32px);text-align:left;border:0;
  font-family:inherit;color:inherit;cursor:pointer}

/* Zeilen der Erholungswerte */
.ezeile{display:flex;align-items:center;gap:11px;width:100%;padding:15px 0;
  background:none;border:0;border-bottom:1px solid var(--line);font-family:inherit;
  cursor:pointer;text-align:left;color:inherit}
.ezeile:last-child{border-bottom:0}
.ezeile .ewert{text-align:right;min-width:64px}
.ezeile .ewert .num{display:block;font-size:20px;letter-spacing:-.03em;color:#fff}
.ezeile .emittel{display:block;font-size:11.5px;color:var(--dim2);margin-top:2px;
  font-variant-numeric:tabular-nums}
.tpfeil{font-size:10px;margin-left:5px;vertical-align:3px}

/* Einblicke aus dem Journal */
.chipreihe{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.wchip{font-size:12px;font-weight:700;padding:8px 12px;border-radius:9px;line-height:1.2}
.wchip.gut{background:rgba(0,241,159,.14);color:var(--green)}
.wchip.schlecht{background:rgba(255,176,32,.14);color:var(--z4)}
.wchip.neutral{background:rgba(255,255,255,.08);color:var(--dim)}

/* Die drei Tageswerte bleiben verkleinert am Kopf stehen, sobald die grossen
   Ringe nach oben aus dem Bild gelaufen sind. */
.minireihe{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;
  align-items:center;justify-content:center;gap:18px;padding:10px 12px 18px;
  background:linear-gradient(180deg,rgba(7,13,20,.97) 0%,rgba(7,13,20,.93) 56%,
    rgba(7,13,20,0) 100%);
  opacity:0;transform:translateY(-10px);pointer-events:none;
  transition:opacity .18s ease,transform .18s ease}
.minireihe.sichtbar{opacity:1;transform:none;pointer-events:auto}
.minizelle{display:flex;align-items:center;gap:7px;background:none;border:0;
  padding:4px 2px;font-family:inherit;color:#fff;font-size:11px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;line-height:1}
.minizelle svg{display:block;flex:0 0 auto}

/* Zeile einer Einheit auf der Startseite */
.aktzeile{display:flex;align-items:center;gap:12px;padding:7px 0;width:100%;
  background:none;border:0;font-family:inherit;color:inherit;cursor:pointer;text-align:left}
.apille{display:flex;align-items:center;justify-content:center;gap:6px;
  width:78px;flex:0 0 78px;height:44px;border-radius:11px;font-weight:800;
  font-size:15px;letter-spacing:-.02em}
.apille svg{display:block;width:16px;height:16px;flex:0 0 16px}
.aname{flex:1;min-width:0;font-size:13px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:#fff}
.azeit{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11px;
  color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.ebahn{position:relative;width:2px;height:38px;border-radius:1px;flex:0 0 2px;
  background:rgba(255,255,255,.12)}
.ebahn i{position:absolute;left:0;right:0;border-radius:1px}
.karteauf{background:none;border:0;color:rgba(255,255,255,.55);cursor:pointer;
  padding:2px;line-height:0}

/* Vorschlag fuer eine Einheit: gleiche Zeile, aber mit farbigem Rahmen */
.vorschlag{display:flex;align-items:center;gap:12px;width:100%;padding:9px 11px;margin:7px 0;
  border-radius:13px;border:1.5px solid transparent;font-family:inherit;text-align:left;
  cursor:pointer;color:inherit;background:
    linear-gradient(#0D1219,#0D1219) padding-box,
    linear-gradient(105deg,#5B3FD6,#2E7BE8) border-box}
.vorschlag .apille{background:linear-gradient(140deg,#6C4BE6,#3B7BE6);color:#fff}
.vorschlag .vtx{flex:1;min-width:0}
.vorschlag .vtx b{display:block;font-size:13px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:#fff}
.vorschlag .vtx span{font-size:11.5px;color:var(--dim)}
.vorschlag svg{flex:0 0 auto;opacity:.6}
.aktknopfreihe{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aktknopfreihe .aktknopf{margin-top:12px;padding:13px 6px;font-size:9.5px;
  letter-spacing:.04em;gap:6px;white-space:nowrap}
.aktknopfreihe .aktknopf svg{width:15px;height:15px;opacity:.8}
.aktknopf{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin-top:12px;padding:13px;border-radius:12px;background:rgba(255,255,255,.06);
  border:0;font-family:inherit;color:#fff;font-size:11.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;cursor:pointer}

/* ================= Schlafplaner und Wochenplan ================= */
/* Die kleine Dreierskala wird auch ausserhalb der Schlafzeilen gebraucht */
.qskala{display:flex;gap:4px;flex:0 0 52px;align-items:center}
.qskala i{height:4px;border-radius:2px;flex:1}

/* Karte "Schlaf fuer heute Nacht" */
.nachtzeiten{display:flex;align-items:flex-start;gap:12px}
.nachtzeiten>div:first-child,.nachtzeiten>div:last-child{flex:1 1 0}
.nachtzeiten .nz{display:flex;align-items:center;gap:8px;color:#fff}
.nachtzeiten>div:last-child .nz{justify-content:flex-end}
.nachtzeiten .nz b{font-size:25px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.nachtzeiten .nz svg{opacity:.75;flex:0 0 auto}
.nachtzeiten .nl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim2);font-weight:700;line-height:1.45;margin-top:7px}
.nstrich{flex:0 0 52px;height:1px;border-top:1px dashed rgba(255,255,255,.25);margin-top:16px}

.logknopf{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border:0;
  border-radius:10px;padding:11px 14px;font-family:inherit;color:#fff;font-size:11.5px;
  font-weight:800;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.logknopf svg{display:block;opacity:.9}

/* Plan-Karte auf der Startseite */
.planauf{display:flex;align-items:flex-start;gap:12px;width:100%;background:none;border:0;
  padding:0;font-family:inherit;color:inherit;cursor:pointer}
.planauf svg{flex:0 0 auto;opacity:.7;margin-top:2px}
.zielzeile{display:flex;align-items:center;gap:12px;padding:13px 0;
  border-top:1px solid var(--line)}
.zielzeile .ztx{flex:1;font-size:14px;color:#fff;line-height:1.35}
.zring{flex:0 0 36px}

/* Wochentage mit Haken */
.wochenreihe{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.wtag{text-align:center}
.wtag .wl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);
  font-weight:700;margin-bottom:7px}
.wtag .wk{width:26px;height:26px;margin:0 auto;border-radius:50%;border:1.5px solid;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.wtag .wk.ja{border-color:var(--sleep);color:var(--sleep);background:rgba(123,161,187,.14)}
.wtag .wk.nein{border-color:#333A43;color:#565E68}
.wtag .wk.offen{border-color:#262C34;border-style:dashed;color:transparent}
.wtag .wk svg{width:13px;height:13px}
.bearb{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;
  font-family:inherit;color:#fff;font-size:11px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;cursor:pointer}
.bearb svg{opacity:.8}

/* Schlafplaner */
.planerlogo{width:44px;height:44px;margin:0 auto;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center}
.zielpille{margin-top:12px;background:none;border:1.4px solid rgba(255,255,255,.65);
  border-radius:999px;padding:14px 22px;font-family:inherit;color:#fff;font-size:11.5px;
  font-weight:800;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.bettfenster{position:relative;margin:30px 16px 0;padding:4px 6px 20px}
.bf-kopf{display:flex;justify-content:space-between;gap:10px}
.bf-kopf .num{font-size:29px;letter-spacing:-.03em}
.bf-kopf .lbl{margin-top:6px;line-height:1.45}
.bf-band{position:relative;height:34px;border-radius:4px;
  background:repeating-linear-gradient(45deg,#191E25,#191E25 4px,#10141A 4px,#10141A 8px);
  display:flex;align-items:center;justify-content:center}
.bf-band .bf-ende{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;
  border-radius:2px}
.bf-wert{background:#0A0F15;border:1.4px solid #fff;border-radius:999px;padding:5px 16px;
  font-size:14px;font-weight:800;letter-spacing:-.02em;color:#fff}
.bf-optimal{margin-top:12px;border:1px dashed rgba(255,255,255,.22);border-top:0;
  border-radius:0 0 8px 8px;padding:0 0 12px;text-align:center;position:relative}
.bf-optimal>span{position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  background:var(--bg);padding:0 10px;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);font-weight:700}
.bf-optimal .small{padding-top:16px}
.weckkarte{margin-top:26px}
.schalter{width:52px;height:30px;border-radius:999px;background:#2A3038;border:0;
  padding:3px;cursor:pointer;display:flex;align-items:center}
.schalter i{width:24px;height:24px;border-radius:50%;background:#8C949E;display:block;
  transition:transform .18s}
.schalter[aria-pressed=true]{background:var(--green)}
.schalter[aria-pressed=true] i{transform:translateX(22px);background:#06231A}
.weckfelder{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.weckfelder>div{background:rgba(255,255,255,.05);border-radius:11px;padding:13px;
  text-align:center}
.weckfelder b{display:block;margin-top:7px;font-size:14px;font-weight:800;color:#fff}
.weckfelder input{margin-top:5px;text-align:center;font-size:14px;font-weight:800}

/* Auswahlliste im Blatt */
.blattkopf{font-size:17px;font-weight:700;color:#fff;text-align:center;padding:8px 16px 14px}
.wahlzeile{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;
  border-bottom:1px solid var(--line);padding:16px 0;font-family:inherit;cursor:pointer;
  color:#fff;text-align:left;font-size:13px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase}
.wahlzeile:last-child{border-bottom:0}
.wahlzeile i{width:22px;height:22px;flex:0 0 22px;border-radius:50%;
  border:2px solid #4A525C;display:block;position:relative}
.wahlzeile[aria-pressed=true] i{border-color:#fff}
.wahlzeile[aria-pressed=true] i::after{content:"";position:absolute;inset:4px;
  border-radius:50%;background:#fff}

/* Plan waehlen */
.planvorlage{display:flex;gap:14px;width:calc(100% - 32px);margin:10px 16px;padding:16px;
  border-radius:14px;border:0;font-family:inherit;text-align:left;cursor:pointer;color:inherit}
.planvorlage .pv-ic{flex:0 0 24px;line-height:0;margin-top:2px}
.planvorlage .pv-tx b{display:block;font-size:15px;font-weight:700;margin-bottom:6px}
.planvorlage .pv-tx span{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.78)}

/* Zielkachel */
.zielkachel{background:rgba(255,255,255,.05);border-radius:14px;padding:14px;margin:10px 16px}
.zk-kopf{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.zk-werte{display:flex;align-items:center;gap:10px}
.zk-werte>div:first-child,.zk-werte>div:last-child{flex:1 1 0}
.zk-zahl{font-size:22px;font-weight:800;letter-spacing:-.03em;color:#fff;
  font-variant-numeric:tabular-nums}
.zk-werte .lbl{margin-top:5px;line-height:1.4}
.zk-pfeil{flex:0 0 auto;color:#4E565F;line-height:0}
.zk-weg,.zk-stift{background:none;border:0;color:#fff;cursor:pointer;padding:2px;line-height:0;
  vertical-align:2px}
.zk-stift svg{width:14px;height:14px;opacity:.75;margin-left:6px}
.zk-rat{display:flex;gap:10px;margin-top:14px;padding:12px;border-radius:10px;
  background:rgba(80,120,210,.14);font-size:12.5px;line-height:1.5;color:#BBD2FF}
.planzeile{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.05);
  border-radius:12px;padding:15px 14px;margin:8px 16px}

/* Auswahlbildschirm */
.pzeile{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);
  border-radius:12px;padding:13px 14px;margin-bottom:8px}
.pzeile.gewaehlt{background:rgba(255,255,255,.08)}
.pz-tx{flex:1;min-width:0}
.pz-tx b{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:#fff;line-height:1.3}
.pz-tx span{font-size:12px;color:var(--dim);display:block;margin-top:3px;white-space:nowrap}
.pzeile .qskala{flex:0 0 44px}
.pz-plus{background:none;border:0;color:#fff;font-size:24px;font-weight:300;line-height:1;
  cursor:pointer;padding:0 4px;font-family:inherit}
.leerfeld{text-align:center;color:var(--dim);font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;font-weight:700;border:1px dashed rgba(255,255,255,.14);
  background:none;padding:20px 14px}

/* Regler fuer das Wochenziel */
.zielregler{padding:26px 16px 6px;text-align:center}
.zielregler .zr-max,.zielregler .zr-min{font-size:12.5px;font-weight:700;color:var(--z4);
  letter-spacing:.02em}
.zr-mitte{display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0}
.zr-links,.zr-rechts{flex:1 1 0}
.zr-links{text-align:right}
.zr-rechts{text-align:left}
.zr-zahl{font-size:25px;font-weight:800;letter-spacing:-.03em;color:var(--z4)}
.zr-mitte .lbl{margin-top:5px;line-height:1.4}
.zr-bahn{position:relative;width:88px;flex:0 0 88px;height:300px;border-radius:14px;
  background:rgba(255,255,255,.06);overflow:hidden;cursor:ns-resize;touch-action:none}
.zr-fuell{position:absolute;left:0;right:0;bottom:0;background:#F0A32E;border-radius:12px}
.zr-griff{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:26px;height:2px;
  border-radius:1px;background:rgba(0,0,0,.35);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.zr-mittellinie{position:absolute;left:-10px;right:-10px;height:0;
  border-top:1px dashed rgba(255,255,255,.8)}

/* ================= Logbuch ================= */
/* Eigener Hintergrund: oben warm sandfarben, darunter Türkis, dann zurück ins
   Dunkle. Er liegt auf #app, scrollt also nicht mit. */
#app.logbuch{background:
  linear-gradient(180deg,
    #CFBE99 0%, #C2BC9A 6%, #A3B198 13%, #7F9F97 20%,
    #5A8489 28%, #3C6472 36%, #26485A 44%, #17313F 53%,
    #0E202C 63%, #09141C 74%, #070C11 86%)}

/* Wochenstreifen */
.logwoche{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:2px 10px 4px}
.logtag{background:none;border:0;font-family:inherit;cursor:pointer;padding:8px 0 10px;
  border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:#fff}
.logtag:disabled{opacity:.35;cursor:default}
.logtag.jetzt{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85)}
.logtag .lt-wd{font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.85}
.logtag .lt-nr{font-size:16px;font-weight:800;letter-spacing:-.02em}
.logtag .lt-punkt{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;margin-top:2px}
.logtag .lt-punkt.ja{background:var(--green);color:#06231A}
.logtag .lt-punkt.nein{background:rgba(255,255,255,.22)}
.logtag .lt-punkt.offen{background:rgba(255,255,255,.12)}
.logtag .lt-punkt svg{width:11px;height:11px}

.logkopf{display:flex;align-items:flex-start;gap:12px;padding:18px 16px 16px}
.logtitel{flex:1;font-size:22px;font-weight:800;letter-spacing:-.02em;color:#fff;
  line-height:1.25}
.logeinblick{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);
  border:0;border-radius:10px;padding:11px 13px;font-family:inherit;color:#fff;
  font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  cursor:pointer;flex:0 0 auto}
.logeinblick svg{width:15px;height:15px}

/* Frage mit Nein/Ja */
.logzeile{display:flex;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--line)}
.logzeile:last-child{border-bottom:0}
.logzeile .lfrage{flex:1;font-size:14.5px;font-weight:600;color:#fff;line-height:1.35}
.lwahl{display:flex;gap:8px;flex:0 0 auto}
.lwahl button{width:40px;height:36px;border-radius:9px;border:0;background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.55);cursor:pointer;display:flex;align-items:center;
  justify-content:center;padding:0}
.lwahl button svg{width:16px;height:16px}
.lwahl .lnein[aria-pressed=true]{background:rgba(255,122,0,.22);color:var(--z5)}
.lwahl .lja[aria-pressed=true]{background:rgba(0,241,159,.20);color:var(--green)}

/* Logbuch anpassen */
/* Die Reiter bleiben beim Scrollen oben stehen. #view ist der Scrollbereich,
   also greift sticky dort - mit leichter Abdunklung, damit die Liste sauber
   darunter durchläuft. */
.logreiter{display:flex;gap:18px;padding:10px 16px;overflow-x:auto;
  border-bottom:1px solid var(--line);margin-bottom:6px;
  position:sticky;top:0;z-index:4;background:rgba(8,15,22,.92);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.logreiter button{background:none;border:0;padding:8px 0;font-family:inherit;cursor:pointer;
  color:var(--dim);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  white-space:nowrap;border-bottom:2px solid transparent}
.logreiter button[aria-pressed=true]{color:#fff;border-bottom-color:#fff}
.loganzeile{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;
  border-bottom:1px solid var(--line);padding:15px 0;font-family:inherit;cursor:pointer;
  text-align:left;color:inherit}
.loganzeile:last-child{border-bottom:0}
.loganzeile .la-tx{flex:1;min-width:0}
.loganzeile .la-tx b{display:block;font-size:14.5px;font-weight:700;color:#fff;line-height:1.3}
.loganzeile .la-tx span{display:block;font-size:12.5px;color:var(--dim2);margin-top:3px;
  line-height:1.35}
/* Squircle: leer mit Rahmen, angehakt blau gefüllt mit weißem Haken */
.squircle{width:28px;height:28px;flex:0 0 28px;border-radius:9px;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;color:transparent}
.squircle svg{width:16px;height:16px}
.loganzeile[aria-pressed=true] .squircle{background:#3B9BF0;border-color:#3B9BF0;color:#fff}

/* ================= Einblicke in die Erholung ================= */
.wkopf{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:26px 16px 10px;font-size:11px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase}
.wzeile{display:block;width:calc(100% - 32px);margin:0 16px 8px;padding:13px 14px;
  background:rgba(255,255,255,.05);border:1.5px solid transparent;border-radius:12px;
  font-family:inherit;color:inherit;text-align:left;cursor:pointer}
.wzeile.still{cursor:default}
.wzeile.neu{border-color:rgba(90,150,255,.55)}
.wz-kopf{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.wneu{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:#9CC4FF;border:1px solid rgba(90,150,255,.6);border-radius:5px;padding:3px 6px;
  flex:0 0 auto}
.wname{flex:1;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:#fff;line-height:1.3}
.wpct{font-size:15px;font-weight:800;letter-spacing:-.02em;flex:0 0 auto}
.wnote{font-size:12.5px;line-height:1.45;color:var(--dim);margin:-4px 0 10px}
/* Balken von der Mitte aus: links schadet, rechts hilft */
.wbahn{position:relative;height:11px;border-radius:2px;
  background:repeating-linear-gradient(45deg,#1c2027,#1c2027 3px,#12151a 3px,#12151a 6px)}
.wbahn.gross{height:14px;margin:26px 0 8px}
.wbahn>i{position:absolute;top:0;bottom:0;border-radius:2px}
.wbahn>.wpunkt{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;
  background:#fff;transform:translate(-50%,-50%)}

<script>
const DATA = __CLAUDE_HEALTH_DATA__;

/* ---------- Hilfsfunktionen ---------- */
const D = DATA.days;
const LAST = D.length - 1;
const S = { tab:"uebersicht", day:LAST, period:30, pzeit:"30", pAlle:false,
  pbearbeiten:false, strendZeit:"M", atemArt:"beruhigen",
  // Trendanzeige: welche Groesse, welcher Zeitraum, wie weit zurueck,
  // und ob die Auswahlliste offen steht
  strendM:"stdbedarf_pct", strendVersatz:0, strendOffen:false,
  // Wochenplan: aufgeklappte Karte, Entwurf in Bearbeitung, offener Regler
  planOffen:false, entwurf:null, pickerArt:"messwerte", zielMetrik:null, zielWert:null,
  // Logbuch: welche Kategorie in der Anpassen-Liste offen ist
  logKat:"alle", detailK:null,
  // Weg durch die Unterseiten, fuer den Pfeil zurueck
  weg:[] };
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Erst auf ganze Minuten runden, dann teilen. Sonst wird aus 119,6
// Minuten "1:60" statt "2:00".
const hm = m => { if(m==null) return "–"; m = Math.round(m);
  return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`; };
const clock = m => m==null ? "–" : `${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(Math.round(m%60)).padStart(2,"0")}`;
const n1 = v => v==null ? "–" : v.toFixed(1).replace(".",",");
const n0 = v => v==null ? "–" : Math.round(v).toLocaleString("de-DE");
// glatte Werte ohne Nachkommastelle: 50 statt 50,0
const nv = v => v==null ? "–" : (Math.abs(v-Math.round(v))<0.05 ? n0(v) : n1(v));
const WD = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const dshort = iso => { const d=new Date(iso+"T00:00"); return `${WD[(d.getDay()+6)%7]} ${d.getDate()}`; };
const dlong = iso => { const d=new Date(iso+"T00:00");
  return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"short"}).toUpperCase(); };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Ohne Zone gibt es keine Farbe. Sonst waere ein Tag in der Kalibrierung rot -
// also "brauchst Ruhe", obwohl schlicht noch nichts beurteilt werden kann.
const recCol = z => z==="gruen" ? "var(--green)" : z==="gelb" ? "var(--yellow)"
  : z==="rot" ? "var(--red)" : "var(--dim2)";
const MINBASIS = (DATA.profile && DATA.profile.baseline_min_days) || 7;
const kalibriert = r => r.calibrating === true;
function kalibHinweis(r){
  const fehlt = Math.max(1, MINBASIS - (r.baseline_days || 0));
  return `<div class="calclegend" style="background:#141A20;color:var(--dim)">
    ${CALC_SVG}<span><b style="color:var(--text)">Kalibrierung läuft.</b>
    Der Erholungswert vergleicht deine Nacht mit deinem <i>eigenen</i> Normalbereich —
    und den gibt es erst nach ${MINBASIS} Messtagen. Noch ${fehlt} ${fehlt===1?"Tag":"Tage"}.
    Bis dahin bleibt das Feld leer, statt eine Zahl gegen einen erfundenen Vergleichswert
    zu rechnen.</span></div>`;
}
const win = () => D.slice(Math.max(0, S.day+1-S.period), S.day+1);
const day = () => D[S.day];

function stats(arr){
  const v = arr.filter(x=>x!=null && !isNaN(x));
  if(!v.length) return {m:null,sd:null,min:null,max:null};
  const m = v.reduce((a,b)=>a+b,0)/v.length;
  const sd = Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length);
  return {m, sd, min:Math.min(...v), max:Math.max(...v)};
}

/* ---------- Zeichen für berechnete Werte ---------- */
// Oranges Sechseck mit zwei ineinandergreifenden Zahnrädern. Es steht an
// jedem Wert, der nicht direkt gemessen, sondern aus gemessenen Größen
// gerechnet wurde.
function zahnrad(cx, cy, r, zaehne, tiefe){
  const pts = [], schritte = zaehne*2;
  for(let i=0;i<schritte;i++){
    const a = i/schritte*2*Math.PI;
    const rr = i%2===0 ? r : r*(1-tiefe);
    pts.push([(cx+Math.cos(a)*rr).toFixed(2), (cy+Math.sin(a)*rr).toFixed(2)]);
  }
  return "M"+pts.map(p=>p.join(",")).join("L")+"Z";

/* ---------- Ring ---------- */
// Das Label unter der Zahl muss in den Ringinnenraum passen. Ein langes Wort
// wie SCHLAFLEISTUNG waere bei fester Schriftgroesse breiter als der Innen-
// durchmesser und wuerde den Ring durchschneiden.
function capSize(text, sz, sw){
  // Das Label sitzt nicht auf Hoehe der Mitte, sondern deutlich darunter.
  // Dort ist der freie Innenraum keine volle Breite mehr, sondern nur die
  // Sehne des Kreises auf dieser Hoehe - deutlich schmaler.
  const rInnen = sz/2 - sw;
  const yAbstand = sz*0.245;
  const halbe = Math.sqrt(Math.max(1, rInnen*rInnen - yAbstand*yAbstand));
  const platz = 2*halbe - 6;
  const proZeichen = 0.78;                   // Zeichenbreite in em inkl. Sperrung
  return Math.min(sz*0.082, platz / Math.max(1, text.length * proZeichen));
}
function ring(val, max, col, opts={}){
  const sz = opts.size||96, sw = opts.stroke||Math.round(sz*0.076), r = (sz-sw)/2, c = 2*Math.PI*r;
  const frac = val==null ? 0 : Math.max(0, Math.min(1, val/max));
  const dash = c*frac;
  // Markenschriftzug nur auf den grossen Ringen - auf den kleinen wird er
  // breiter als der Ring selbst und sieht gedraengt aus.
  const brand = (opts.brand===false || sz < 140) ? "" :
    `<text x="${sz/2}" y="${opts.brandY ?? (sz/2-sz*0.145)}" text-anchor="middle"
       class="ringtxt-brand"
       style="font-size:${(opts.brandPx ?? Math.max(7, sz*0.048)).toFixed(1)}px"
       >CLAUDE HEALTH</text>`;
  // Ohne Wert auch keine Einheit - "–%" liest sich wie ein kaputter Wert.
  const unit = (val==null && opts.text==null) ? "" : (opts.unit||"");
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" role="img"
    aria-label="${esc(opts.aria||"")}">
    <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#22262D" stroke-width="${sw}"/>
    <circle class="ringarc" cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}"
      stroke-width="${sw}" stroke-linecap="round" data-frac="${frac}"
      data-ziel="${val==null ? "" : val}" data-dez="${opts.dez||0}"
      stroke-dasharray="${dash} ${Math.max(0,c-dash)}" stroke-dashoffset="0"
      transform="rotate(-90 ${sz/2} ${sz/2})"/>
    ${brand}
    <text x="${sz/2}" y="${opts.valY ?? (sz/2+sz*0.085)}" text-anchor="middle"
      class="ringtxt-val" style="font-size:${opts.valPx ?? sz*0.30}px"><tspan
      class="ringzahl">${opts.text ?? (val==null?"–":Math.round(val))}</tspan><tspan
      class="ringtxt-unit" style="font-size:${opts.unitPx ?? sz*0.155}px">${unit}</tspan></text>
    <text x="${sz/2}" y="${opts.capY ?? (sz/2+sz*0.245)}" text-anchor="middle"
      class="ringtxt-brand" style="font-size:${
      opts.capPx ?? capSize(opts.cap||"", sz, sw)}px${
      opts.capFarbe ? `;fill:${opts.capFarbe}` : ""}">${esc(opts.cap||"")}</text>
  </svg>`;
}

/* ---------- Diagramm-Bausteine ---------- */
function lineChart(pts, opts={}){
  // pts: [{x:label, y:value|null}]  -> Luecken bleiben Luecken
  const W = opts.w||400, H = opts.h||130, PL = 30, PR = 12, PT = 14, PB = 20;
  const vals = pts.map(p=>p.y).filter(v=>v!=null);
  if(!vals.length) return `<div class="muted small">keine Daten</div>`;
  let lo = opts.min ?? Math.min(...vals), hi = opts.max ?? Math.max(...vals);
  if(lo===hi){lo-=1;hi+=1;}
  // Nur automatisch ermittelte Grenzen bekommen Luft. Bei fest vorgegebenen
  // Grenzen (z. B. Stress 0-3) waere eine Achse bis -0,45 schlicht falsch.
  if(opts.min==null || opts.max==null){ const pad=(hi-lo)*0.15; lo-=pad; hi+=pad; }
  const X = i => PL + (W-PL-PR) * (pts.length<2?0.5:i/(pts.length-1));
  const Y = v => PT + (H-PT-PB) * (1-(v-lo)/(hi-lo));

  let grid="", ticks=4;
  for(let i=0;i<=ticks;i++){
    const v = lo+(hi-lo)*i/ticks, y=Y(v);
    grid += `<line class="gl" x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}"/>
      <text class="ax" x="${PL-6}" y="${y+3}" text-anchor="end">${opts.fmtY?opts.fmtY(v):Math.round(v)}</text>`;
  }
  // Baseline-Band
  let band="";
  if(opts.band){
    const y1=Y(opts.band[1]), y2=Y(opts.band[0]);
    band = `<rect x="${PL}" y="${y1}" width="${W-PL-PR}" height="${Math.max(1,y2-y1)}"
      fill="${opts.color}" opacity=".10"/>`;
  }
  // Segmente ohne Luecken
  let segs=[], cur=[];
  pts.forEach((p,i)=>{ if(p.y==null){ if(cur.length>1)segs.push(cur); cur=[]; } else cur.push([X(i),Y(p.y)]); });
  if(cur.length>1) segs.push(cur);
  const paths = segs.map(s=>`<path class="dl anim" d="M${s.map(p=>p.join(",")).join("L")}"
    stroke="${opts.color}" stroke-width="${opts.sw||2}"/>`).join("");

  // letzter Punkt weiss hervorgehoben + beschriftet
  let lastMark="";
  for(let i=pts.length-1;i>=0;i--){ if(pts[i].y!=null){
    const x=X(i), y=Y(pts[i].y);
    lastMark = `<circle cx="${x}" cy="${y}" r="3.4" fill="#fff"/>
      <text class="vlabel" x="${x-7}" y="${y-9}" text-anchor="end" fill="#fff">${
        opts.fmtY?opts.fmtY(pts[i].y):Math.round(pts[i].y)}</text>`;
    break; } }

  const xl = [0, Math.floor((pts.length-1)/2), pts.length-1].filter((v,i,a)=>a.indexOf(v)===i)
    .map(i=>`<text class="ax" x="${X(i)}" y="${H-4}" text-anchor="middle">${esc(pts[i].x)}</text>`).join("");

  const hover = pts.map((p,i)=>`<rect x="${X(i)-(W-PL-PR)/(2*Math.max(1,pts.length-1))}" y="${PT}"
    width="${(W-PL-PR)/Math.max(1,pts.length-1)}" height="${H-PT-PB}" fill="transparent"
    data-tip="${esc(p.full||p.x)}: ${p.y==null?"keine Daten":(opts.fmtT?opts.fmtT(p.y):p.y)}"
    data-cx="${X(i)}"/>`).join("");

  // Kein preserveAspectRatio="none": das streckt die x-Achse gegen die y-Achse
  // und verzerrt damit auch Beschriftungen und Punktmarker.
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${grid}${band}${paths}${lastMark}${xl}
    <g class="hover">${hover}</g></svg>`;
}

function barChart(pts, opts={}){
  const W = opts.w||400, H = opts.h||150, PL=30, PR=10, PT=opts.labels?20:12, PB=22;
  const vals = pts.map(p=>p.y).filter(v=>v!=null);
  if(!vals.length) return `<div class="muted small">keine Daten</div>`;
  // Ohne Obergrenze gaebe es eine Division durch null - etwa an einem Tag
  // ganz ohne Bewegung, an dem alle Zonen auf 0 stehen.
  const hi = Math.max(1e-6, opts.max ?? Math.max(...vals)*1.12);
  const bw = (W-PL-PR)/pts.length;
  const Y = v => PT + (H-PT-PB)*(1-v/hi);
  let grid="";
  (opts.ticks||[0,.33,.64,1]).forEach(t=>{
    const y = PT+(H-PT-PB)*(1-t);
    grid += `<line class="gl" x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}"/>
      <text class="ax" x="${PL-6}" y="${y+3}" text-anchor="end">${opts.fmtY?opts.fmtY(hi*t):Math.round(hi*t)}</text>`;
  });
  const bars = pts.map((p,i)=>{
    if(p.y==null) return "";
    const x = PL+bw*i+bw*0.20, w = bw*0.60, y=Y(p.y), h=Math.max(1.5,(H-PB)-y);
    const col = p.c||opts.color||"var(--blue)";
    const lab = opts.labels ? `<text class="vlabel" x="${x+w/2}" y="${y-5}" text-anchor="middle"
      fill="${col}">${opts.fmtL?opts.fmtL(p.y):Math.round(p.y)}</text>` : "";
    return `<g><rect class="gbar" x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}" rx="1.5"
      style="${RM?"":`--h:${h};--y:${y}`}"/>${lab}</g>`;
  }).join("");
  const step = pts.length>16 ? Math.ceil(pts.length/7) : 1;
  const xl = pts.map((p,i)=> i%step===0 || i===pts.length-1
    ? `<text class="ax" x="${PL+bw*i+bw/2}" y="${H-5}" text-anchor="middle">${esc(p.x)}</text>` : "").join("");
  const hover = pts.map((p,i)=>`<rect x="${PL+bw*i}" y="${PT}" width="${bw}" height="${H-PT-PB}"
    fill="transparent" data-tip="${esc(p.full||p.x)}: ${p.y==null?"keine Daten":(opts.fmtT?opts.fmtT(p.y):p.y)}"
    data-cx="${PL+bw*i+bw/2}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${grid}${bars}${xl}<g class="hover">${hover}</g></svg>`;
}

/* ---------- Profil und biologisches Alter ---------- */
// Spiegelt metrics.biological_age in JavaScript. Muss hier liegen, weil das
// Geburtsdatum im Browser eingegeben wird und Python es nicht kennt.
const PKEY = "claudehealth.profil";
const HRV_REF_ALTER = 25, HRV_REF_WERT = 55, HRV_ZERFALL = 0.0207;
const MIN_TAGE_BIOALTER = 14;

function profil(){
  try { return JSON.parse(localStorage.getItem(PKEY) || "{}") || {}; }
  catch(e){ return {}; }
}
function speichereProfil(p){
  try { localStorage.setItem(PKEY, JSON.stringify(p)); return true; } catch(e){ return false; }

function alterAm(geburtstag, bezug){
  if(!geburtstag) return null;
  const g = new Date(geburtstag + "T00:00"), b = new Date(bezug + "T00:00");
  if(isNaN(g) || isNaN(b)) return null;
  return (b - g) / (365.2425 * 86400000);
}
const erwarteteHrv = a => HRV_REF_WERT * Math.exp(-HRV_ZERFALL * (a - HRV_REF_ALTER));
const grenze = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

function bioAlter(alter, hrv, rhr, konsistenz, dauerMin){
  if(alter == null || hrv == null || hrv <= 0) return {wert:null, teile:{}};
  const teile = {};
  teile.hrv = grenze(Math.log(erwarteteHrv(alter)/hrv) / HRV_ZERFALL, -10, 10);
  if(rhr != null)        teile.rhr = grenze((rhr - 58) * 0.25, -5, 5);
  if(konsistenz != null) teile.konsistenz = grenze((78 - konsistenz) * 0.06, -3, 3);
  if(dauerMin != null)   teile.dauer = grenze(Math.max(0, Math.abs(dauerMin-450)/60 - 0.5) * 1.4, 0, 3);

  const gew = {hrv:0.55, rhr:0.25, konsistenz:0.12, dauer:0.08};
  const da = Object.keys(teile);
  const summe = da.reduce((s,k)=>s+gew[k], 0);
  let versatz = da.reduce((s,k)=>s + teile[k]*(gew[k]/summe), 0);
  versatz = grenze(versatz, -10, 12);
  const wert = grenze(alter + versatz, Math.max(16, alter-10), alter+12);
  return {wert: Math.round(wert*10)/10, teile, versatz};
}

// Mittelwert eines Feldes über ein Fenster von Tagen
function fensterMittel(tage, zugriff){
  const v = tage.map(zugriff).filter(x=>x!=null && !isNaN(x));

}

// Wöchentliche Punkte für den Verlauf
function bioVerlauf(geburtstag){
  const punkte = [];
  for(let ende = D.length-1; ende >= 6; ende -= 7){
    const f = D.slice(ende-6, ende+1);
    const tag = D[ende].date;
    const alter = alterAm(geburtstag, tag);
    if(alter == null) continue;
    const b = bioAlter(
      alter,
      fensterMittel(f, x=>x.recovery.hrv),
      fensterMittel(f, x=>x.recovery.rhr),
      fensterMittel(f, x=>x.sleep.consistency),
      fensterMittel(f, x=>x.sleep.duration_min)

    if(b.wert != null) punkte.push({index:ende, date:tag, bio:b.wert, chrono:alter});
  }

// Partikelkugel wie im Vorbild. Feste Pseudozufallsfolge, damit sie bei
// jedem Neuzeichnen gleich aussieht und nicht flackert.
// Die Teilchenwolke reicht deutlich weiter als der Ring. Die Zeichenfläche ist
// deshalb rund 1,35-mal so groß wie früher, während der Ring gleich groß
// bleibt - so passt die Wolke hinein, statt oben aus der Karte zu laufen.
// Zum Rand hin blendet eine weiche Maske aus: kein harter Schnitt.
let sphZaehler = 0;
function sphaere(flaeche, farbe){
  let saat = 12345;
  const zuf = () => (saat = (saat*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const id = "sph" + (++sphZaehler);
  const mitte = flaeche/2;
  const rAussen = flaeche*0.341, rInnen = flaeche*0.2225;

  const lage = (anzahl, wegVon, wegBis, deckVon, deckSpanne) => {
    let s = "";
    for(let i=0;i<anzahl;i++){
      const winkel = zuf()*Math.PI*2;
      // Ziel irgendwo im Ring - nie innerhalb der Innenkante
      const r = rInnen + (rAussen-rInnen)*Math.sqrt(zuf());
      const gr = 0.7 + zuf()*2.2;
      const weg = flaeche*(wegVon + zuf()*(wegBis-wegVon));
      const dauer = 2.4 + zuf()*3.2;
      const versatz = -zuf()*dauer;        // negativ: die Bewegung läuft schon
      const deck = deckVon + zuf()*deckSpanne;
      s += `<circle class="sphpart" cx="${(mitte+Math.cos(winkel)*r).toFixed(1)}"
        cy="${(mitte+Math.sin(winkel)*r).toFixed(1)}" r="${gr.toFixed(1)}" fill="${farbe}"
        style="--dx:${(Math.cos(winkel)*weg).toFixed(1)}px;--dy:${(Math.sin(winkel)*weg).toFixed(1)}px;
          --op:${deck.toFixed(2)};animation-duration:${dauer.toFixed(2)}s;
          animation-delay:${versatz.toFixed(2)}s"/>`;
    }
    return s;
  };

  // Erste Lage: die Wolke außen, Anlaufweg wie gehabt (auf die größere
  // Fläche umgerechnet, damit die Dichte draußen gleich bleibt).
  // Zweite Lage: kurzer Anlauf, bleibt im Ring - nur dort wird es dichter.
  const punkte = lage(Math.round(flaeche*0.68), 0.067, 0.209, 0.25, 0.75)
               + lage(Math.round(flaeche*0.20), 0.004, 0.045, 0.30, 0.70);

  return `<svg width="${flaeche}" height="${flaeche}" viewBox="0 0 ${flaeche} ${flaeche}"
    style="display:block" aria-hidden="true">
    <defs>
      <radialGradient id="g${id}"><stop offset="55%" stop-color="${farbe}" stop-opacity="0"/>
        <stop offset="88%" stop-color="${farbe}" stop-opacity=".26"/>
        <stop offset="100%" stop-color="${farbe}" stop-opacity="0"/></radialGradient>
      <radialGradient id="m${id}"><stop offset="62%" stop-color="#fff" stop-opacity="1"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <mask id="k${id}"><rect width="${flaeche}" height="${flaeche}" fill="url(#m${id})"/></mask>
    </defs>
    <circle cx="${mitte}" cy="${mitte}" r="${rAussen}" fill="url(#g${id})"/>
    <circle cx="${mitte}" cy="${mitte}" r="${(rAussen+rInnen)/2}" fill="none"
      stroke="${farbe}" stroke-width="${flaeche*0.100}" opacity=".16"/>
    <g mask="url(#k${id})">${punkte}</g></svg>`;
}

/* ---------- Wirkung einer Sportart ---------- */
// Vergleicht Tage mit und ohne diese Aktivität. Stress am selben Tag,
// Erholung und Schlafleistung am Folgetag - denn beide werden erst in der
// Nacht danach gemessen.
function aktivitaetsWirkung(name, mindestens){
  mindestens = mindestens || 3;
  // Zwei Kontrollgruppen, weil zwei verschiedene Fragen dahinterstehen.
  //   Stress   : "senkt diese Einheit meinen Stress?"  -> alle anderen Tage
  //   Erholung : "wie hart ist sie im Vergleich?"      -> andere TRAININGStage
  // Wuerde man Erholung gegen alle anderen Tage vergleichen, steckten
  // lauter Ruhetage in der Kontrollgruppe - dann sieht jede harte Einheit
  // verheerend aus, und gemessen waere nur "Training gegen Nichtstun".
  const mit = [], ohneAlle = [], ohneTraining = [];
  D.forEach((d,i)=>{
    const akt = alleAktivitaeten(d);
    if(akt.some(a=>a.name===name)) mit.push(i);
    else { ohneAlle.push(i); if(akt.length) ohneTraining.push(i); }
  });

  const mittel = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const vgl = (f, kontrolle) => {
    const A = mit.map(f).filter(v=>v!=null), B = kontrolle.map(f).filter(v=>v!=null);
    if(A.length < mindestens || B.length < mindestens) return null;
    const a = mittel(A), b = mittel(B);
    if(b == null || b === 0) return null;
    return { pct: Math.round((a-b)/b*100), mit: a, ohne: b, n: B.length };
  };
  return {
    name, tage: mit.length,
    stress:   vgl(i => D[i].stress ? D[i].stress.avg : null, ohneAlle),
    erholung: vgl(i => D[i+1] ? D[i+1].recovery.score : null, ohneTraining),
    schlaf:   vgl(i => D[i+1] ? D[i+1].sleep.performance : null, ohneTraining),
  };
}
function aktivitaetsNamen(){
  const z = new Map();
  D.forEach(d => alleAktivitaeten(d).forEach(a => z.set(a.name, (z.get(a.name)||0)+1)));
  return [...z.entries()].sort((a,b)=>b[1]-a[1]);
}

function vUebersicht(){

  const vitalStaende = VITALE.map(m => vitalStand(m, r, wv));

  const alleDrin = pruefbar > 0 && drin === pruefbar;

  // Einsicht aus dem stärksten Treiber

  const NAMEN = {hrv:"HFV", rhr:"Ruheherzfrequenz", resp:"Atemfrequenz",
    spo2:"Blutsauerstoff", temp:"Hauttemperatur", sleep:"Schlafleistung"};
  let top = null, tv = 0;
  for(const k in drv) if(Math.abs(drv[k]) > Math.abs(tv)){ top = k; tv = drv[k]; }
  const hoch = tv > 0;

  const stressWort = d.stress.avg == null ? "–"

    : d.stress.avg >= 2 ? "var(--z5)" : d.stress.avg >= 1 ? "var(--yellow)" : "var(--green)";

function prev(grp, key){
  const p = D[S.day-1]; if(!p) return null;
  return grp ? p[grp][key] : p[key];
}
function dashRow(label, val, pv, unit, hoeherBesser){
  let t="";
  if(val!=null && pv!=null){
    const diff = val-pv;
    if(Math.abs(diff) > Math.abs(pv)*0.005){
      const gut = hoeherBesser===null ? null : (diff>0)===hoeherBesser;
      const cls = gut===null?"muted":gut?"up":"dn";
      t = `<span class="trend ${cls}">${diff>0?"▲":"▼"}</span>`;
    }
  }
  const show = val==null ? "–" : (Number.isInteger(val)?n0(val):n1(val));
  return `<div class="lrow"><div class="ic">◦</div>
    <div class="tx"><div class="lbl" style="color:var(--text)">${esc(label)}</div></div>
    <div class="vl"><div class="num" style="font-size:19px">${show}${t}</div>
    <div class="small muted">${pv!=null?(Number.isInteger(pv)?n0(pv):n1(pv)):""} ${esc(unit)}</div></div></div>`;
}

/* ================= Erholung ================= */
// Aufbau: Ring, die vier Messwerte dahinter, eine Einsicht, die Einblicke aus
// dem Journal und die Wochentrends. Jede Zeile fuehrt in die Trendanzeige.

// Pfeil neben einem Tageswert: Vergleich mit dem eigenen 30-Tage-Schnitt.
// hoch=null heisst, dass keine Richtung besser ist - dann bleibt der Pfeil grau.
function tagesPfeil(wert, mittel, hoch, schwelle){
  if(wert == null || mittel == null) return "";
  const unterschied = wert - mittel;
  if(Math.abs(unterschied) < (schwelle || 0.5))
    return `<span class="tpfeil" style="color:var(--dim2)">•</span>`;
  const farbe = hoch == null ? "var(--dim)"
    : ((unterschied > 0) === hoch ? "var(--green)" : "var(--z4)");
  return `<span class="tpfeil" style="color:${farbe}">${unterschied > 0 ? "▲" : "▼"}</span>`;
}

function erholZeilen(d){
  const r = d.recovery;
  return [
    {k:"hfv",  l:"Herzfrequenzvariabilität", ic:ICON_PULS,       v:r.hrv,
     m:mittel30(x => x.recovery.hrv), fmt:v => v == null ? "–" : n0(v), hoch:true,  s:0.5},
    {k:"rhf",  l:"Ruheherzfrequenz",         ic:ICON_HERZ_LINIE, v:r.rhr,
     m:mittel30(x => x.recovery.rhr), fmt:v => v == null ? "–" : n0(v), hoch:false, s:0.5},
    {k:"atem", l:"Atemfrequenz",             ic:ICON_LUNGE,      v:r.resp,
     m:mittel30(x => x.recovery.resp), fmt:v => v == null ? "–" : n1(v), hoch:null, s:0.05},
    {k:"schlafleistung", l:"Schlafleistung", ic:ICON_MOND,       v:d.sleep.performance,
     m:mittel30(x => x.sleep.performance), fmt:pz, hoch:true, s:0.5},
  ];
}

function vErholung(){
  const d = day(), r = d.recovery;
  const zeilen = erholZeilen(d);

  return `
  ${kalibriert(r) ? kalibHinweis(r) : ""}
  <div style="position:relative;text-align:center;padding:2px 0 4px">

    <div data-ringtap="1" style="display:inline-block;cursor:pointer">

    </div>
  </div>

  <div class="karte spitze" style="padding:2px 16px">
    ${zeilen.map(z => `<button class="ezeile" data-strendmetrik="${z.k}">
      <span class="qic">${z.ic}</span>
      <span class="qlab">${esc(z.l)}</span>
      <span class="ewert">
        <span class="num">${z.fmt(z.v)}${tagesPfeil(z.v, z.m, z.hoch, z.s)}</span>
