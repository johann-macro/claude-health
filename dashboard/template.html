// Kleiner Fortschrittsring mit einem Abschnitt je Tag
function zielRing(ist, von){
  const R = 15, U = 2*Math.PI*R, lueck = 3;
  const teil = U/von;
  const bogen = Math.max(1, teil - lueck);
  const stuecke = [];
  for(let i = 0; i < von; i++){
    stuecke.push(`<circle cx="18" cy="18" r="${R}" fill="none"
      stroke="${i < ist ? "var(--green)" : "#2A3038"}" stroke-width="2.6"
      stroke-dasharray="${bogen.toFixed(2)} ${(U-bogen).toFixed(2)}"
      stroke-dashoffset="${(-i*teil).toFixed(2)}"
      transform="rotate(-90 18 18)" stroke-linecap="round"/>`);
  }
  return `<svg width="36" height="36" viewBox="0 0 36 36" class="zring">${stuecke.join("")}
    <text x="18" y="21.5" text-anchor="middle"
      style="font-size:11px;font-weight:800;fill:var(--green)">${ist}/${von}</text></svg>`;
}

// Ein Ziel mit Wochentagen, Haken und - bei Messwerten - dem Verlauf
function zielBlock(z){
  const m = z.m;
  const kreise = z.tage.map(t => `<div class="wtag">
    <div class="wl">${esc(t.wd)}</div>
    <div class="wk ${t.offen ? "offen" : t.ok ? "ja" : "nein"}">${
      t.ok ? ICON_HAKEN : (t.offen ? "" : "–")}</div></div>`).join("");
  let diagramm = "";
  if(m && !m.woche){
    const punkte = z.tage.filter(t => t.tag).map(t => ({t, v:m.wert(t.tag)}))
      .filter(x => x.v != null);
    if(punkte.length){
      const W = 400, H = 180, PL = 8, PR = 46, PT = 34, PB = 14;
      const hi = Math.max(z.ziel, ...punkte.map(p => p.v)) * 1.16;
      const bw = (W-PL-PR) / z.tage.length;
      const Y = v => PT + (H-PT-PB) * (1 - v/hi);
      const balken = z.tage.map((t,i) => {
        const v = t.tag ? m.wert(t.tag) : null;
        if(v == null) return "";
        const y = Y(v);
        return `<g><rect class="gbar" x="${(PL+bw*i+bw*0.28).toFixed(1)}" y="${y.toFixed(1)}"
          width="${(bw*0.44).toFixed(1)}" height="${Math.max(2,(H-PB)-y).toFixed(1)}"
          fill="var(--sleep)" rx="2"/>
          <text class="vlabel" x="${(PL+bw*i+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}"
            text-anchor="middle" style="fill:var(--sleep)">${m.kurzFmt(v)}</text></g>`;
      }).join("");
      diagramm = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:10px">
        ${balken}
        <line x1="${PL}" y1="${Y(z.ziel).toFixed(1)}" x2="${W-PR+6}" y2="${Y(z.ziel).toFixed(1)}"
          stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/>
        <rect x="${W-PR+8}" y="${(Y(z.ziel)-9).toFixed(1)}" width="36" height="18" rx="4"
          fill="#EDF1F4"/>
        <text x="${W-PR+26}" y="${(Y(z.ziel)+3.5).toFixed(1)}" text-anchor="middle"
          style="font-size:9px;font-weight:800;letter-spacing:.08em;fill:#11151A">ZIEL</text></svg>`;
    }
  }
  const schnitt = m && !m.woche ? (() => {
    const v = z.tage.filter(t => t.tag).map(t => m.wert(t.tag)).filter(x => x != null);
    return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
  })() : null;

// Spanne des Reglers: um den eigenen Durchschnitt herum, auf ganze Schritte
function zielGrenzen(m, mittel){
  const spanne = Math.max(m.schritt * 4, mittel * 0.5);
  const runde = v => Math.round(v / m.schritt) * m.schritt;
  let min = Math.max(0, runde(mittel - spanne));
  let max = runde(mittel + spanne);
  if(max <= min) max = min + m.schritt * 4;
  return {min, max};
}

// Ziehen am Regler. Bewusst mit Maus UND Finger am Fenster verfolgt, damit der
// Finger die schmale Bahn verlassen darf, ohne dass das Ziehen abbricht.
function zielReglerBinden(){
  const bahn = document.getElementById("zr-bahn");
  if(!bahn) return;
  const m = metrikVon(S.zielMetrik);
  if(!m) return;
  const g = zielGrenzen(m, metrikMittel(m) || 0);
  let zieht = false;
  const setzen = y => {
    const r = bahn.getBoundingClientRect();
    const anteil = Math.max(0, Math.min(1, (r.bottom - y) / r.height));
    const roh = g.min + anteil * (g.max - g.min);
    S.zielWert = Math.round(roh / m.schritt) * m.schritt;
    const f = bahn.querySelector(".zr-fuell");
    if(f) f.style.height = ((S.zielWert - g.min) / (g.max - g.min) * 100).toFixed(1) + "%";
    const zahl = document.querySelector("#zielregler .zr-links .zr-zahl");
    if(zahl) zahl.textContent = m.kurzFmt(S.zielWert);
  };
  bahn.addEventListener("mousedown", e => { zieht = true; setzen(e.clientY); e.preventDefault(); });
  addEventListener("mousemove", e => { if(zieht) setzen(e.clientY); });
  addEventListener("mouseup", () => { zieht = false; });
  bahn.addEventListener("touchstart", e => {
    zieht = true; setzen(e.touches[0].clientY);
  }, {passive:true});
  bahn.addEventListener("touchmove", e => {
    if(!zieht) return;
    setzen(e.touches[0].clientY);
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  bahn.addEventListener("touchend", () => { zieht = false; });
}

const logEintrag = k => LOGBUCH_KATALOG.find(e => e[0] === k);

// Voreinstellung: die Einträge, die von Anfang an sinnvoll sind und für die es
// im Datensatz schon Verläufe gibt.
const LOG_STANDARD = ["alkohol","koffein_spaet","spaet_arbeiten","grosse_mahlzeit",
  "sport_spaet","bildschirm_spaet","kein_bildschirm","lesen_im_bett","meditation",
  "kalt_geduscht","kuehl_geschlafen","krank","katze_im_zimmer"];

function logbuchAktiv(){
  try {
    const v = JSON.parse(localStorage.getItem(LOGKEY) || "null");
    return Array.isArray(v) ? v : LOG_STANDARD.slice();
  } catch(e){ return LOG_STANDARD.slice(); }
}
function logbuchSetzen(k, an){
  const liste = logbuchAktiv().filter(x => x !== k);
  if(an) liste.push(k);
  try { localStorage.setItem(LOGKEY, JSON.stringify(liste)); return true; }
  catch(e){ return false; }
}

/* ---------- Bildschirm: Logbuch ---------- */
function vLogbuch(){
  const d = day();
  const aktiv = logbuchAktiv();
  const eintraege = journalAmTag(d.date);
  const plan = planLesen();
  const fort = plan ? planFortschritt(plan) : null;

  // Frageblock. Jede Zeile hat drei Zustände: unbeantwortet, nein, ja.
  const zeile = (k, frage) => {
    const wert = eintraege[k];
    return `<div class="logzeile">
      <span class="lfrage">${esc(frage)}</span>
      <span class="lwahl">
        <button class="lnein" data-loga="${esc(k)}" data-logw="nein"
          aria-pressed="${wert === false}" aria-label="Nein">${ICON_X}</button>
        <button class="lja" data-loga="${esc(k)}" data-logw="ja"
          aria-pressed="${wert === true}" aria-label="Ja">${ICON_HAKEN}</button>
      </span></div>`;
  };

  // Fragen des Wochenplans stehen oben - sie zählen direkt auf ein Ziel ein.
  const planKeys = plan ? (plan.verhalten || []).map(z => z.k) : [];
  const planBlock = !planKeys.length ? "" : `
    <div class="lbl" style="padding:4px 16px 8px">Dein Plan „${esc(plan.name)}“</div>
    <div class="karte" style="margin-top:0">
      ${(plan.verhalten || []).map(z => {
        const e = logEintrag(z.k);
        const ziel = fort ? fort.ziele.find(x => x.schluessel === z.k) : null;
        const frage = z.vermeiden
          ? `Hast du „${esc(e ? e[2] : z.k)}“ vermieden?`
          : esc(e ? e[3] : z.k);
        const wert = eintraege[z.k];
        // Vermeiden heißt: "ja" bedeutet, das Verhalten kam NICHT vor
        return `<div class="logzeile">
          ${ziel ? zielRing(ziel.erreicht, ziel.von) : ""}
          <span class="lfrage" style="margin-left:12px">${frage}</span>
          <span class="lwahl">
            <button class="lnein" data-loga="${esc(z.k)}" data-logw="${z.vermeiden ? "ja" : "nein"}"
              aria-pressed="${wert === (z.vermeiden ? true : false)}" aria-label="Nein">${ICON_X}</button>
            <button class="lja" data-loga="${esc(z.k)}" data-logw="${z.vermeiden ? "nein" : "ja"}"
              aria-pressed="${wert === (z.vermeiden ? false : true)}" aria-label="Ja">${ICON_HAKEN}</button>
          </span></div>`;
      }).join("")}
    </div>`;

  const gruppe = (kat, titel) => {
    const liste = aktiv.map(logEintrag).filter(e => e && e[1] === kat && !planKeys.includes(e[0]));
    if(!liste.length) return "";
    return `<div class="lbl" style="padding:22px 16px 8px">${titel}</div>
      <div class="karte" style="margin-top:0">${liste.map(e => zeile(e[0], e[3])).join("")}</div>`;
  };

  const woche = wocheTage();
  return `
  <div class="logwoche">
    ${woche.map(t => {
      const i = D.findIndex(x => x.date === t.iso);
      const beantwortet = !!(t.tag && journalBeantwortet(t.iso).length);
      const heute = t.iso === d.date;
      return `<button class="logtag ${heute ? "jetzt" : ""}" data-logtag="${i}"
        ${i < 0 ? "disabled" : ""}>
        <span class="lt-wd">${esc(t.wd)}</span>
        <span class="lt-nr">${tagNr(t.iso)}</span>
        <span class="lt-punkt ${t.offen ? "offen" : beantwortet ? "ja" : "nein"}">${
          beantwortet && !t.offen ? ICON_HAKEN : ""}</span></button>`;
    }).join("")}
  </div>

  <div class="logkopf">
    <div class="logtitel">${S.day === LAST ? "Was passiert heute," : "Was war am"}<br>${
      new Date(d.date + "T00:00").toLocaleDateString("de-DE",
        {day:"numeric", month:"long"})}?</div>
    <button class="logeinblick" data-goto="einblicke">${ICON_GLUEH}<span>Einblicke</span></button>
  </div>

  ${planBlock}
  ${LOG_KATEGORIEN.filter(([k]) => k !== "alle")
      .map(([k,l]) => gruppe(k, l)).join("")}
  ${aktiv.length === 0 ? `<div class="karte"><div class="chartnote">Im Logbuch ist noch
    nichts ausgewählt. Oben rechts über den Stift legst du fest, was du mitschreiben willst.</div></div>` : ""}

  <div style="padding:22px 16px 0">
    <button class="btn" data-logfertig="1" style="border-radius:999px;padding:16px"
      >Logbuch speichern</button></div>
  <div class="chartnote" style="margin:14px 16px 0">Jede Antwort wird sofort im Browser dieses
    Geräts gespeichert. Aus den Tagen mit und ohne einen Eintrag rechnet die App später aus,
    wie stark sich das auf deine Erholung auswirkt — dafür braucht es je vier Tage in beiden
    Gruppen.</div>`;
}

/* ---------- Bildschirm: Logbuch anpassen ---------- */
function vLogbuchAnpassen(){
  const kat = S.logKat || "alle";
  const aktiv = logbuchAktiv();
  const liste = LOGBUCH_KATALOG
    .filter(e => kat === "alle" || e[1] === kat)
    .slice()
    .sort((a,b) => a[2].localeCompare(b[2], "de"));
  return `
  <div class="logreiter">
    ${LOG_KATEGORIEN.map(([k,l]) => `<button data-logkat="${k}"
      aria-pressed="${kat === k}">${esc(l)}</button>`).join("")}
  </div>
  <div style="padding:4px 16px 0">
    ${liste.map(e => `<button class="loganzeile" data-logan="${esc(e[0])}"
      aria-pressed="${aktiv.includes(e[0])}">
      <span class="la-tx"><b>${esc(e[2])}</b><span>${esc(e[3])}</span></span>
      <span class="squircle">${ICON_HAKEN}</span></button>`).join("")}

  <div class="chartnote" style="margin:18px 16px 0">${aktiv.length} von
    ${LOGBUCH_KATALOG.length} Einträgen ausgewählt. Was hier angehakt ist, erscheint im
    Logbuch und fließt in die Auswertung der Verhaltensweisen ein.</div>`;
}

/* ================= Einblicke in die Erholung ================= */
// Vergleicht deinen Erholungswert an Tagen MIT einem Logbucheintrag mit dem an
// Tagen OHNE. Das ist ein Zusammenhang, keine Ursache - und ohne genug Tage in
// beiden Gruppen erscheint gar keine Zahl.

const MIN_ANTWORTEN = 5;   // je Gruppe, wie im Vorbild

function verhaltenAnalyse(k){
  const label = (verhaltenListe().find(x => x[0] === k) || [k, (logEintrag(k) || [0,0,k])[2]])[1];
  const mit = [], ohne = [], mitSchlaf = [], ohneSchlaf = [];
  let ja = 0, nein = 0;
  D.forEach(d => {
    const wert = journalAmTag(d.date)[k];
    if(wert !== true && wert !== false) return;
    if(wert) ja++; else nein++;
    if(d.recovery.score != null) (wert ? mit : ohne).push(d.recovery.score);
    if(d.sleep.performance != null) (wert ? mitSchlaf : ohneSchlaf).push(d.sleep.performance);
  });
  const mittel = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null;
  const basis = mittel(ohne);
  const genug = ja >= MIN_ANTWORTEN && nein >= MIN_ANTWORTEN
    && mit.length >= 4 && ohne.length >= 4 && basis;
  const pct = genug ? Math.round((mittel(mit) - basis) / basis * 100) : null;
  return {
    k, label, ja, nein, pct, genug,
    erhMit:mittel(mit), erhOhne:basis,
    schlafMit:mittel(mitSchlaf), schlafOhne:mittel(ohneSchlaf),
    tageMit:mit.length, tageOhne:ohne.length,
    neu:!LOG_STANDARD.includes(k) && logbuchAktiv().includes(k),
  };
}

// dem Datensatz, die schon Verlauf haben.
function einblickListe(){
  const schluessel = new Set(logbuchAktiv());
  D.forEach(d => Object.keys(d.journal || {}).forEach(k => schluessel.add(k)));
  try {
    Object.values(journalSpeicher()).forEach(t => Object.keys(t).forEach(k => schluessel.add(k)));
  } catch(e){ /* kein Speicher, dann eben nur der Datensatz */ }
  return [...schluessel].map(verhaltenAnalyse).filter(a => a.label);
}

const wirkFarbe = pct => pct == null ? "var(--dim2)"
  : pct >= 3 ? "var(--green)" : pct <= -3 ? "var(--z4)" : "var(--dim)";

// Balken, der von der Mitte aus nach rechts (hilft) oder links (schadet) läuft
function wirkBahn(pct, maxWert){
  const punkt = `<b class="wpunkt"></b>`;
  if(pct == null || pct === 0) return `<div class="wbahn">${punkt}</div>`;
  const breite = Math.min(50, Math.abs(pct) / Math.max(1, maxWert) * 50);
  const links = pct > 0 ? 50 : 50 - breite;
  return `<div class="wbahn">
    <i style="left:${links.toFixed(1)}%;width:${breite.toFixed(1)}%;
      background:${wirkFarbe(pct)}"></i>${punkt}</div>`;
}

  // Beschwerden und Symptome - gedaempftes Rot, kein Alarmrot

};
function motivFuer(k){
  // Reihenfolge zaehlt: die genaueste Regel zuerst.
  if(/koffein/.test(k)) return "kaffee";
  if(/bildschirm/.test(k)) return "bildschirm";
  if(/eisbad|kalt_geduscht/.test(k)) return "eis";
  if(/sauna|heizkissen|whirlpool|rotlicht|pemf|epsom|hitzewallung/.test(k)) return "flamme";
  if(/^(periode|zyklus|pms|krampf|pille|spirale|schwangerschaft|stillzeit|wechseljahre|hormonersatz|testosteron|libido)/.test(k)) return "kopf";
  if(/med|vitamin|magnesium|kreatin|omega|eisen|zink|multivit|probio|kollagen|ashwa|pilze|melatonin|impf|insulin|kortison|statine|metformin|antibio|nsaid|schmerzmittel|betablocker|inhalator|nasenspray|chemo|accutane|schilddruese|protonen|ag1|proteinpulver|antidepressiva|antihistaminika|covid_[12b]/.test(k)) return "pille";
  if(/alkohol|wasser|elektrolyte|energydrink|limonade/.test(k)) return "glas";
  if(/mahlzeit|gegessen|essen|snack|zucker|protein|vegetarisch|fasten|restaurant|hausgemacht|kalorien|obst|ballast|fleisch|fisch|milch|fette|kohlenhydrate|kalzium|natrium|fruehstueck|mittagessen/.test(k)) return "teller";
  if(/schlaf|bett|dunkel|kuehl|laerm|ohrstoep|maske|rauschen|nickerchen|katze|lesen|aufgewacht|alptraum|nachtschweiss/.test(k)) return "bett";
  if(/training|spaziergang|yoga|dehn|sport|massage|faszien|physio|akupunktur|chiro|lymph|kompression|inversion|grounding|erdungs/.test(k)) return "welle";
  if(/stress|streit|laune|tagebuch|meditation|reiz|stimmung|erschoepf|ausgelaugt|familie|solo|sex|masturbation|arbeit|bereitschaft|home_office|pendel/.test(k)) return "kopf";
  if(/draussen|sonnenlicht|flug|zeitzone|hoehe|autofahrt/.test(k)) return "sonne";
  if(/krank|kopfschmerz|migraene|akne|blaeh|aufgeblaeht|muskel|ruecken|gelenk|allergie|verletzung|verdauung|uebelkeit|schwindel|herzstolpern|haut|hals|husten|schnupfen|fieber|zahn|affenpocken|covid_symptome/.test(k)) return "tropfen";
  return "blatt";
}
// Immer dieselbe Streuung je Eintrag: aus dem Schlüssel abgeleitet, nicht zufällig
function streuung(k, n){
  let h = 0;
  for(let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) % 100000;
  const werte = [];
  for(let i = 0; i < n; i++){ h = (h * 1103515245 + 12345) % 2147483648; werte.push(h / 2147483648); }
  return werte;
}
function motivBild(k){
  const art = motivFuer(k);
  const m = MOTIVE[art] || MOTIVE.blatt;
  const W = 400, H = 200, z = streuung(k, 48);
  const formen = [];
  const anzahl = m.form === "sonne" ? 3 : m.form === "puls" ? 5 : 14;
  for(let i = 0; i < anzahl; i++){
    const x = (z[i*3] * 1.1 - 0.05) * W;
    const y = (z[i*3+1] * 1.1 - 0.05) * H;
    const s = 0.55 + z[i*3+2] * 0.85;
    const dreh = Math.round(z[i*3+2] * 180);
    const deck = (0.16 + z[i*3+1] * 0.42).toFixed(2);
    const g = `translate(${x.toFixed(0)},${y.toFixed(0)}) rotate(${dreh}) scale(${s.toFixed(2)})`;
    if(m.form === "bohne")
      formen.push(`<g transform="${g}" opacity="${deck}"><ellipse rx="19" ry="13" fill="${m.farbe}"/>
        <path d="M-15 0 Q0 -7 15 0 Q0 7 -15 0" fill="#2A1608"/></g>`);
    else if(m.form === "tropfen")
      formen.push(`<path transform="${g}" opacity="${deck}"
        d="M0 -16 C9 -5 14 2 14 7 A14 14 0 0 1 -14 7 C-14 2 -9 -5 0 -16z" fill="${m.farbe}"/>`);
    else if(m.form === "kreis")
      formen.push(`<circle transform="${g}" r="15" fill="none" stroke="${m.farbe}"
        stroke-width="3" opacity="${deck}"/>`);
    else if(m.form === "schirm")
      formen.push(`<rect transform="${g}" x="-11" y="-19" width="22" height="38" rx="4"
        fill="none" stroke="${m.farbe}" stroke-width="2.6" opacity="${deck}"/>`);
    else if(m.form === "mond")
      formen.push(`<path transform="${g}" opacity="${deck}"
        d="M12 6a15 15 0 1 1-9-16 12 12 0 0 0 9 16z" fill="${m.farbe}"/>`);
    else if(m.form === "kapsel")
      formen.push(`<rect transform="${g}" x="-18" y="-8" width="36" height="16" rx="8"
        fill="${m.farbe}" opacity="${deck}"/>`);
    else if(m.form === "welle")
      formen.push(`<path transform="${g}" opacity="${deck}" fill="none" stroke="${m.farbe}"
        stroke-width="3" stroke-linecap="round" d="M-22 0q11-13 22 0t22 0"/>`);
    else if(m.form === "kristall")
      formen.push(`<g transform="${g}" opacity="${deck}" stroke="${m.farbe}" stroke-width="2.4"
        stroke-linecap="round"><path d="M0-15V15M-13-7 13 7M-13 7 13-7"/></g>`);
    else if(m.form === "puls")
      formen.push(`<path transform="translate(0,${(H*(i+0.5)/anzahl).toFixed(0)})"
        opacity="${(0.12 + z[i]*0.22).toFixed(2)}" fill="none" stroke="${m.farbe}"
        stroke-width="2.6" stroke-linecap="round"
        d="M0 0h${(60+z[i]*60).toFixed(0)}l14-18 16 34 12-22h${(180+z[i+1]*80).toFixed(0)}"/>`);
    else if(m.form === "ring")
      formen.push(`<circle transform="${g}" r="17" fill="none" stroke="${m.farbe}"
        stroke-width="2.2" opacity="${deck}"/>`);
    else if(m.form === "sonne")
      formen.push(`<g transform="translate(${(W*(0.2+i*0.32)).toFixed(0)},${
        (H*(0.3+z[i]*0.4)).toFixed(0)}) scale(${(1+z[i]).toFixed(2)})"
        opacity="${(0.18+z[i]*0.2).toFixed(2)}" stroke="${m.farbe}" stroke-width="2.6"
        fill="none" stroke-linecap="round"><circle r="11"/>
        <path d="M0-20v6M0 14v6M-20 0h6M14 0h6M-14-14l4 4M10 10l4 4M14-14l-4 4M-10 10l-4 4"/></g>`);
    else
      formen.push(`<path transform="${g}" opacity="${deck}" fill="${m.farbe}"
        d="M0-17C10-9 15 0 13 9 5 17-6 16-12 8-17 0-11-11 0-17z"/>`);
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"
    class="motiv" role="img" aria-hidden="true">
    <defs><linearGradient id="mg${k}" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="${m.von}"/><stop offset="1" stop-color="${m.bis}"/>
    </linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#mg${k})"/>
    ${formen.join("")}
    <rect width="${W}" height="${H}" fill="url(#motivschleier)"/></svg>`;
}

/* ---------- Kleine Verlaufslinie ---------- */
function funke(werte, farbe, h){
  h = h || 30;
  const W = 120;
  const da = werte.filter(x => x != null);
  if(da.length < 2) return "";
  const lo = Math.min(...da), hi = Math.max(...da), spanne = (hi-lo) || 1;
  const punkte = werte.map((y,i)=> y == null ? null
    : [i/(werte.length-1)*W, h - (y-lo)/spanne * (h-4) - 2]);
  const segmente = []; let lauf = [];
  punkte.forEach(p=>{ if(!p){ if(lauf.length>1) segmente.push(lauf); lauf=[]; } else lauf.push(p); });
  if(lauf.length>1) segmente.push(lauf);
  const letzter = punkte.filter(Boolean).pop();
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px;overflow:visible">

      fill="#fff"/>` : ""}</svg>`;
}

/* ---------- Verlauf biologisches Alter ---------- */
function bioTrendChart(punkte){
  const W=400, H=180, PL=34, PR=44, PT=16, PB=24;
  if(punkte.length < 2) return `<div class="muted small">zu wenige Punkte</div>`;
  const alle = punkte.flatMap(p=>[p.bio, p.chrono]);
  let lo = Math.min(...alle)-1.5, hi = Math.max(...alle)+1.5;
  const X = i => PL + (W-PL-PR)*(i/(punkte.length-1));
  const Y = v => PT + (H-PT-PB)*(1-(v-lo)/(hi-lo));

  let grid="";
  for(let i=0;i<=3;i++){
    const v = lo+(hi-lo)*i/3, y = Y(v);
    grid += `<line class="gl" x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}"/>
      <text class="ax" x="${PL-6}" y="${y+3}" text-anchor="end">${v.toFixed(1).replace(".",",")}</text>`;
  }
  const linie = (feld, farbe) => `<path class="dl anim" stroke="${farbe}" stroke-width="2"
    d="M${punkte.map((p,i)=>`${X(i)},${Y(p[feld])}`).join("L")}"/>`;
  const letzter = punkte[punkte.length-1];
  const ende = (feld, farbe) => `<circle cx="${X(punkte.length-1)}" cy="${Y(letzter[feld])}" r="3.6"
      fill="${farbe}"/><text class="vlabel" x="${X(punkte.length-1)+8}" y="${Y(letzter[feld])+3.5}"
      fill="${farbe}">${letzter[feld].toFixed(1).replace(".",",")}</text>`;

  const schritt = Math.max(1, Math.ceil(punkte.length/5));
  const xl = punkte.map((p,i)=> i%schritt===0
    ? `<text class="ax" x="${X(i)}" y="${H-6}" text-anchor="middle">${dshort(p.date)}</text>` : "").join("");
  const hover = punkte.map((p,i)=>`<rect x="${X(i)-10}" y="${PT}" width="20" height="${H-PT-PB}"
    fill="transparent" data-tip="${dlong(p.date)}: biologisch ${p.bio.toFixed(1).replace(".",",")} · tatsächlich ${p.chrono.toFixed(1).replace(".",",")}"/>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}
    ${linie("chrono","#E8EDF2")}${linie("bio","var(--green)")}
    ${ende("chrono","#E8EDF2")}${ende("bio","var(--green)")}
    ${xl}<g class="hover">${hover}</g></svg>`;
}

function pacevonPunkten(punkte){
  const sauber = punkte.filter(p=>p.bio!=null);
  if(sauber.length < 4) return null;
  const n = sauber.length;
  const xs = sauber.map(p=>p.index), ys = sauber.map(p=>p.bio);
  const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
  let oben=0, unten=0;
  for(let i=0;i<n;i++){ oben += (xs[i]-mx)*(ys[i]-my); unten += (xs[i]-mx)**2; }
  if(!unten) return null;
  const roh = oben/unten*365;
  const wert = grenze(roh, -1, 3);
  return {wert: Math.round(wert*100)/100, geklemmt: Math.abs(roh - wert) > 0.02, wochen: n};
}

// Balkenpaar wie im Vorbild: niedrigster und hoechster Wert, dazu der Median
function wertePaar(titel, einheit, werte){
  const v = werte.filter(x => x != null).sort((a,b)=>a-b);
  if(v.length < 3) return `<div class="muted small" style="text-align:center">zu wenige Werte</div>`;
  const lo = v[0], hi = v[v.length-1], med = v[Math.floor(v.length/2)];
  const W = 190, H = 152, PB = 36, PT = 28;
  const unten = lo * 0.80, oben = hi * 1.08;
  const Y = w => PT + (H-PT-PB) * (1 - (w - unten) / (oben - unten));
  const balken = (x, w, l) => `
    <rect x="${x}" y="${Y(w).toFixed(1)}" width="52" height="${(H-PB-Y(w)).toFixed(1)}"
      fill="rgba(255,255,255,.16)" rx="2"/>
    <line x1="${x}" y1="${Y(w).toFixed(1)}" x2="${x+52}" y2="${Y(w).toFixed(1)}"
      stroke="#fff" stroke-width="2"/>
    <text x="${x+26}" y="${(Y(w)-9).toFixed(1)}" text-anchor="middle"
      fill="#fff" style="font-size:16px;font-weight:800">${nv(w)}</text>
    <text x="${x+26}" y="${H-14}" text-anchor="middle" class="ax">${l}</text>`;
  return `<div style="text-align:center">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      <line x1="6" y1="${Y(med).toFixed(1)}" x2="${W-6}" y2="${Y(med).toFixed(1)}"
        stroke="rgba(255,255,255,.32)" stroke-width="1" stroke-dasharray="3 3"/>

      <rect x="${W-64}" y="${(Y(med)-9).toFixed(1)}" width="60" height="18" rx="4" fill="#7FD6E8"/>

        style="font-size:9px;font-weight:800;letter-spacing:.06em" fill="#06222A">MEDIAN</text>

      <span class="muted" style="font-weight:600">(${esc(einheit)})</span></div>

// Das biologische Alter bleibt erhalten - es stand ausdruecklich nicht zur
// Disposition und haengt an derselben Profilangabe.
function bioAlterBlock(p, alter){
  const fenster = D.slice(-28);
  const messtage = fenster.filter(x => x.recovery.hrv != null).length;
  const b = bioAlter(alter,
    fensterMittel(fenster, x => x.recovery.hrv),
    fensterMittel(fenster, x => x.recovery.rhr),
    fensterMittel(fenster, x => x.sleep.consistency),
    fensterMittel(fenster, x => x.sleep.duration_min));
  const reif = messtage >= MIN_TAGE_BIOALTER && b.wert != null;
  if(!reif) return `<div class="karte">
    <div class="kopfzeile"><span class="t">Biologisches Alter</span></div>
    <div class="chartnote">Braucht mindestens ${MIN_TAGE_BIOALTER} Messtage in den letzten vier
    Wochen &mdash; bisher sind es ${messtage}.</div></div>`;

  const diff = alter - b.wert, juenger = diff > 0;
  const verlauf = bioVerlauf(p.geburtstag);
  const tempo = pacevonPunkten(verlauf);
  return `
  <div class="karte" style="text-align:center;padding-top:20px">
    ${calcBadge("Abstand deiner Werte zu dem, was fuer dein Alter typisch waere")}
    <div style="margin:-14px auto -10px;position:relative;width:264px;height:264px;max-width:100%">
      ${sphaere(264, juenger ? "#00F19F" : "#FFB020")}
      <div style="position:absolute;inset:0;display:grid;place-items:center">
        <div><div class="num" style="font-size:44px;line-height:1">${n1(b.wert)}</div>
        <div class="lbl" style="margin-top:4px;font-size:9px">Biologisches Alter</div>
        <div class="small" style="margin-top:5px;color:${juenger ? "var(--green)" : "var(--z4)"};
          font-weight:700">${n1(Math.abs(diff))} Jahre ${juenger ? "j&uuml;nger" : "&auml;lter"}</div>
        </div>
      </div>
    </div>
    ${tempo != null ? `<div class="row" style="margin-top:18px">
      <span class="lbl">Tempo des Alterns</span>
      <span class="num" style="font-size:17px">${tempo.geklemmt ? "unter " : ""}${
        n1(tempo.wert)}&times;</span></div>` : ""}
    <div class="chartnote" style="text-align:left">Aus vier Gr&ouml;&szlig;en, die ein Armband messen
      kann, verglichen mit ver&ouml;ffentlichten Altersnormen. <b>Keine Diagnose</b> &mdash; taugt
      f&uuml;r die eigene Entwicklung &uuml;ber Monate, nicht f&uuml;r den Vergleich mit anderen.</div>
  </div>
  <div class="karte">
    <div class="kopfzeile" style="margin-bottom:10px"><span class="t">Verlauf</span></div>
    <div style="display:flex;gap:16px;margin-bottom:10px" class="small muted">
      <span><i class="sq" style="background:var(--green)"></i> biologisch</span>
      <span><i class="sq" style="background:#E8EDF2"></i> tats&auml;chlich</span></div>
    ${bioTrendChart(verlauf)}
  </div>`;
}


/* ================= Stressmonitor ================= */
const STRESS_STUFEN = [
  ["niedrig", "Niedrig", "#3D9BFF"],
  ["mittel",  "Mittel",  "#00D98B"],
  ["hoch",    "Hoch",    "#FF9A2E"],
];
const WOCHENTAGE = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

// Der Tacho. Ohne Wert steht dort "wird berechnet" - das ist beim Fitbit der
// Normalfall, solange die Minutenwerte des laufenden Tages noch nicht
// vollstaendig uebertragen sind.
function stressTacho(wert, zeit){
  const W = 320, H = 200, cx = 160, cy = 168, r = 128;
  const a0 = Math.PI, a1 = 2 * Math.PI;
  const punkt = f => { const a = a0 + (a1 - a0) * f;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  const [x0, y0] = punkt(0), [x1, y1] = punkt(1);
  const hat = wert != null;
  const f = hat ? Math.max(0, Math.min(1, wert / 3)) : 0;
  const [nx, ny] = punkt(f);
  const [ix, iy] = (() => { const a = a0 + (a1 - a0) * f;
    return [cx + Math.cos(a) * (r - 13), cy + Math.sin(a) * (r - 13)]; })();
  const [ax, ay] = (() => { const a = a0 + (a1 - a0) * f;
    return [cx + Math.cos(a) * (r + 13), cy + Math.sin(a) * (r + 13)]; })();
  const wort = wert == null ? "" : wert >= 2 ? "Hoch" : wert >= 1 ? "Mittel" : "Niedrig";
  const farbe = wert == null ? "var(--dim2)"
    : wert >= 2 ? "#FF9A2E" : wert >= 1 ? "#00D98B" : "#3D9BFF";

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:330px;height:auto;margin:0 auto">
    <defs><linearGradient id="tachofarbe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F8BFF"/><stop offset="34%" stop-color="#00D98B"/>
      <stop offset="62%" stop-color="#C8E24A"/><stop offset="100%" stop-color="#FF8A1E"/>
    </linearGradient></defs>
    <path d="M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}"
      stroke="url(#tachofarbe)" stroke-width="7" fill="none" stroke-linecap="round"/>
    ${hat ? `<line x1="${ix.toFixed(1)}" y1="${iy.toFixed(1)}" x2="${ax.toFixed(1)}"
      y2="${ay.toFixed(1)}" stroke="#fff" stroke-width="4" stroke-linecap="round"/>` : ""}
    ${hat
      ? `<text x="${cx}" y="${cy - 34}" text-anchor="middle" fill="#fff"
           style="font-size:52px;font-weight:800;letter-spacing:-.03em">${n1(wert)}</text>
         <text x="${cx}" y="${cy - 8}" text-anchor="middle" fill="${farbe}"
           style="font-size:13px;font-weight:800;letter-spacing:.10em">${wort.toUpperCase()}</text>
         <text x="${cx}" y="${cy + 12}" text-anchor="middle" fill="#8A939D"
           style="font-size:12px;font-weight:600">${esc(zeit || "")}</text>`
      : `<circle cx="${cx}" cy="${cy - 46}" r="21" fill="none" stroke="rgba(255,255,255,.28)"
           stroke-width="1.6"/>
         <path d="M${cx-8},${cy-40} l5,-12 l6,12 l5,-12" stroke="rgba(255,255,255,.7)"
           stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
         <text x="${cx}" y="${cy - 4}" text-anchor="middle" fill="rgba(255,255,255,.86)"
           style="font-size:16px;font-weight:800;letter-spacing:.10em">WIRD BERECHNET</text>`}
    <text x="${(x0+12).toFixed(1)}" y="${(y0+20).toFixed(1)}" text-anchor="middle"
      fill="#6C737C" style="font-size:11px;font-weight:600">0,0</text>
    <text x="${(x1-12).toFixed(1)}" y="${(y1+20).toFixed(1)}" text-anchor="middle"
      fill="#6C737C" style="font-size:11px;font-weight:600">3,0</text>
  </svg>`;
}

// Tagesverlauf. Die Linie faerbt sich ueber einen Verlauf entlang der Y-Achse,
// damit hohe Werte orange und niedrige blau erscheinen - ohne die Linie in
// hunderte Einzelstuecke zerlegen zu muessen.
function stressTagesgraph(d){
  const reihe = d.stress.series;
  if(!reihe || !reihe.length) return `<div class="chartnote">Für diesen Tag liegen keine
    Minutenwerte vor. Die Uhr überträgt sie nur für die jüngsten Tage.</div>`;
  const W = 340, H = 150, PL = 30, PR = 16, PT = 26, PB = 22;
  const X = i => PL + (W-PL-PR) * (i / (reihe.length - 1));
  const Y = v => PT + (H-PT-PB) * (1 - v / 3);
  const minZuX = m => PL + (W-PL-PR) * (m / 1440);

  let raster = "";
  [0,1,2,3].forEach(v => { const y = Y(v);
    raster += `<line class="gl" x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}"/>
      <text class="ax" x="${PL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${n1(v)}</text>`; });

  const pfad = "M" + reihe.map((p,i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join("L");

  // Markierungen ueber dem Graphen: Nacht und erkannte Einheiten
  let marken = "";
  if(d.stress.nacht){
    const [a,b] = d.stress.nacht;
    marken += `<line x1="${minZuX(a).toFixed(1)}" y1="14" x2="${minZuX(b).toFixed(1)}" y2="14"
      stroke="var(--sleep)" stroke-width="2.5" stroke-linecap="round"/>
      <g transform="translate(${((minZuX(a)+minZuX(b))/2 - 7).toFixed(1)},-2)"
        style="color:var(--sleep)">${ICON_MOND_KLEIN}</g>`;
  }
  (d.stress.einheiten || []).forEach(e => {
    marken += `<line x1="${minZuX(e.von).toFixed(1)}" y1="14" x2="${minZuX(e.bis).toFixed(1)}" y2="14"
      stroke="#3D9BFF" stroke-width="2.5" stroke-linecap="round"/>
      <g transform="translate(${((minZuX(e.von)+minZuX(e.bis))/2 - 7).toFixed(1)},-2)"
        style="color:#8FC6FF">${ICON_LAUF_KLEIN}</g>`;
  });

  const letzterX = X(reihe.length - 1), letzterY = Y(reihe[reihe.length-1].v);
  const hover = reihe.filter((_,i) => i % 3 === 0).map((p,j) => {
    const i = j*3;
    return `<rect x="${(X(i)-2).toFixed(1)}" y="${PT}" width="4" height="${H-PT-PB}"
      fill="transparent" data-tip="${esc(p.t)} Uhr: ${n1(p.v)}"/>`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">
    <defs><linearGradient id="stressfarbe" x1="0" y1="${Y(0)}" x2="0" y2="${Y(3)}"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F8BFF"/><stop offset="36%" stop-color="#00D98B"/>
      <stop offset="70%" stop-color="#C8E24A"/><stop offset="100%" stop-color="#FF8A1E"/>
    </linearGradient></defs>
    ${raster}${marken}
    <path class="dl anim" d="${pfad}" stroke="url(#stressfarbe)" stroke-width="1.6"/>
    <line x1="${letzterX.toFixed(1)}" y1="${PT-6}" x2="${letzterX.toFixed(1)}" y2="${H-PB+4}"
      stroke="rgba(255,255,255,.55)" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="${letzterX.toFixed(1)}" cy="${(H-PB).toFixed(1)}" r="3.4" fill="#fff"/>
    <text class="ax" x="${PL}" y="${H-6}">${esc(reihe[0].t)}</text>
    <text class="ax" x="${((PL+W-PR)/2).toFixed(1)}" y="${H-6}" text-anchor="middle">12:00</text>
    <text x="${(W-PR).toFixed(1)}" y="${H-6}" text-anchor="end" fill="#fff"
      style="font-size:9.5px;font-weight:800">${esc(reihe[reihe.length-1].t)}</text>
    <g>${hover}</g>
  </svg>`;
}

// Verteilung eines Tages in Minuten
function stressVerteilung(d){
  const v = d.stress.verteilung;
  if(v) return v;
  const reihe = d.stress.series || [];
  if(!reihe.length) return null;
  return {
    niedrig: reihe.filter(p => p.v < 1).length * 5,
    mittel:  reihe.filter(p => p.v >= 1 && p.v < 2).length * 5,
    hoch:    reihe.filter(p => p.v >= 2).length * 5,
  };
}

function vStress(){
  const d = day();
  const heuteVert = stressVerteilung(d);
  const wt = new Date(d.date + "T00:00").getDay();
  const wtIndex = (wt + 6) % 7;

  // Vergleich mit demselben Wochentag. Gibt es davon zu wenige, wird ehrlich
  // gegen alle uebrigen Tage verglichen und das auch so benannt.
  let vergleichsTage = D.filter(x => x.date !== d.date && stressVerteilung(x) &&
    (new Date(x.date + "T00:00").getDay() + 6) % 7 === wtIndex);
  let vergleichsText = `typischer ${WOCHENTAGE[wtIndex]}`;
  if(vergleichsTage.length < 2){
    vergleichsTage = D.filter(x => x.date !== d.date && stressVerteilung(x));
    vergleichsText = "typischer Tag";
  }
  const mittelVert = vergleichsTage.length ? {
    niedrig: vergleichsTage.reduce((s,x)=>s+stressVerteilung(x).niedrig,0)/vergleichsTage.length,
    mittel:  vergleichsTage.reduce((s,x)=>s+stressVerteilung(x).mittel,0)/vergleichsTage.length,
    hoch:    vergleichsTage.reduce((s,x)=>s+stressVerteilung(x).hoch,0)/vergleichsTage.length,
  } : null;

  const balken = (vert, deckkraft) => {
    if(!vert) return "";
    const summe = vert.niedrig + vert.mittel + vert.hoch || 1;
    return `<div style="display:flex;height:13px;border-radius:3px;overflow:hidden;gap:2px">
      ${STRESS_STUFEN.map(([k,,c]) => `<div style="width:${(vert[k]/summe*100).toFixed(1)}%;
        background:${c};opacity:${deckkraft}"></div>`).join("")}</div>`;
  };

  // Laengster Abschnitt mit hohem Stress
  let laengste = null;
  if(d.stress.series){
    let start = null;
    d.stress.series.forEach((p,i) => {
      if(p.v >= 2){ if(start === null) start = i; }
      else if(start !== null){
        const dauer = (i - start) * 5;
        if(!laengste || dauer > laengste.dauer) laengste = {von: d.stress.series[start].t, dauer};
        start = null;
      }
    });
    if(start !== null){
      const dauer = (d.stress.series.length - start) * 5;
      if(!laengste || dauer > laengste.dauer) laengste = {von: d.stress.series[start].t, dauer};
    }
  }
  const meiste = heuteVert ? STRESS_STUFEN.reduce((a,b) =>
    heuteVert[b[0]] > heuteVert[a[0]] ? b : a)[1].toLowerCase() : null;

  const letzterWert = d.stress.series ? d.stress.series[d.stress.series.length-1] : null;
  const datumKurz = new Date(d.date + "T00:00")
    .toLocaleDateString("de-DE", {weekday:"short", day:"numeric", month:"short"});

  return `
  <div style="padding:6px 16px 2px;position:relative">
    ${stressTacho(letzterWert ? letzterWert.v : d.stress.avg, letzterWert ? letzterWert.t : null)}
    <button class="infoknopf" data-stressinfo="1" aria-label="Erklärung">${ICON_INFO}</button>
  </div>

  <div style="padding:14px 16px 6px">${stressTagesgraph(d)}</div>

  ${meiste ? `<div class="karte einsicht" style="border:1px solid rgba(120,170,255,.30)">
    <div class="tx" style="color:#fff">Die meiste Zeit hast du im Bereich
      <b>${esc(meiste)}</b> verbracht.${laengste
        ? ` Dein längster Abschnitt mit hohem Stress begann um ${esc(laengste.von)} und dauerte
            ${laengste.dauer} Minuten.` : ""}</div>
    <button class="coachlink" data-coach="1">Erfahre mehr mit Claude Coach →</button>
  </div>` : ""}

  <div class="karte">
    <div class="kopfzeile" style="margin-bottom:12px">
      <span class="t">Gesamter Tag</span></div>
    <div class="small" style="margin-bottom:10px">
      <b style="color:#fff">${esc(datumKurz)} Stress</b>
      <span class="muted">vs. ${esc(vergleichsText)}</span></div>
    ${balken(heuteVert, 1)}
    <div style="height:5px"></div>
    ${balken(mittelVert, .45)}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px">
      ${STRESS_STUFEN.map(([k,l,c]) => {
        const jetzt = heuteVert ? heuteVert[k] : 0;
        const sonst = mittelVert ? mittelVert[k] : null;
        // Prozente nur, wenn die Vergleichsbasis gross genug ist. Aus zwei
        // Minuten Grundwert werden sonst vierstellige Prozentzahlen, die wie
        // ein Fehler aussehen - dann lieber die Differenz in Minuten.
        const genugBasis = sonst != null && sonst >= 15;
        const delta = genugBasis ? Math.round((jetzt - sonst) / sonst * 100) : null;
        const diff = sonst != null ? Math.round(jetzt - sonst) : null;
        return `<div>
          <div class="num" style="font-size:20px">${hm(jetzt)}</div>
          ${delta != null && Math.abs(delta) >= 1
            ? `<div class="small" style="color:${delta > 0 ? "var(--z4)" : "var(--green)"};
                margin-top:2px">${delta > 0 ? "▲" : "▼"} ${Math.abs(delta)} %</div>`
            : diff != null && Math.abs(diff) >= 5
            ? `<div class="small" style="color:${diff > 0 ? "var(--z4)" : "var(--green)"};
                margin-top:2px">${diff > 0 ? "▲" : "▼"} ${Math.abs(diff)} Min.</div>`
            : `<div class="small muted" style="margin-top:2px">wie sonst</div>`}
          <div class="small muted" style="margin-top:5px">
            <i class="sq" style="background:${c}"></i> ${esc(l)}</div>
        </div>`;}).join("")}
    </div>
    <div class="chartnote">Stress im Laufe des Tages, einschließlich Schlaf und Aktivitäten.</div>
    <button class="trendlink" data-goto="stresstrend">Trends anzeigen →</button>
  </div>

  <div class="abschnitt" style="padding-bottom:12px">Atemübungen</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px">
    <button class="atemkarte" data-atemstart="beruhigen">
      <span class="bild ruhig"></span>
      <span class="ti">Erhöhe die Entspannung</span>
      <span class="su">Geführte Atemübung</span></button>
    <button class="atemkarte" data-atemstart="aktivieren">
      <span class="bild wach"></span>
      <span class="ti">Wachsamkeit erhöhen</span>
      <span class="su">Geführte Atemübung</span></button>
  </div>

  <div class="abschnitt" style="padding-bottom:12px">So funktioniert es</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 8px">
    <div class="karte" style="margin:0">
      <div class="kopfzeile" style="margin-bottom:9px"><span class="t">Was ist Stress?</span></div>
      <div class="tx" style="font-size:13px;line-height:1.5;color:rgba(255,255,255,.78)">
        Stress misst, wie aufmerksam und aktiviert dein Körper ist. Er ist nicht immer etwas,
        das man vermeiden sollte — du kannst ihn auch nutzen, um deine Ziele zu erreichen.</div>
    </div>
    <div class="karte" style="margin:0">
      <div class="kopfzeile" style="margin-bottom:9px"><span class="t">Stressmessung</span></div>
      <div class="tx" style="font-size:13px;line-height:1.5;color:rgba(255,255,255,.78)">
        Gemessen auf einer Skala von 0 bis 3, aus Herzfrequenz und HFV im Vergleich zu deinem
        eigenen Normalwert. Bewegung wird herausgerechnet. Je höher der Wert, desto aktivierter
        bist du.</div>
    </div>
  </div>
  ${rohtabelle()}`;
}

/* ---------- Trendansicht ---------- */
function vStressTrend(){
  const tage = {W:7, M:30, "6M":180}[S.strendZeit] || 30;
  const fenster = D.slice(-tage).filter(x => stressVerteilung(x));
  const vorher = D.slice(-tage*2, -tage).filter(x => stressVerteilung(x));
  const schnitt = a => a.length
    ? a.reduce((s,x) => s + stressVerteilung(x).hoch, 0) / a.length : null;
  const jetzt = schnitt(fenster), davor = schnitt(vorher);
  const delta = (jetzt != null && davor) ? Math.round((jetzt - davor) / davor * 100) : null;

  const W = 360, H = 200, PL = 34, PR = 8, PT = 10, PB = 26;
  const bw = (W-PL-PR) / Math.max(1, fenster.length);
  const saeulen = fenster.map((x,i) => {
    const v = stressVerteilung(x), s = v.niedrig + v.mittel + v.hoch || 1;
    let y = PT;
    return ["hoch","mittel","niedrig"].map(k => {
      const h = (H-PT-PB) * v[k] / s;
      const rect = `<rect x="${(PL+bw*i+bw*0.16).toFixed(1)}" y="${y.toFixed(1)}"
        width="${(bw*0.68).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}"
        fill="${STRESS_STUFEN.find(q=>q[0]===k)[2]}"
        data-tip="${dlong(x.date)} · ${esc(k)}: ${hm(v[k])} h"/>`;
      y += h; return rect;
    }).join("");
  }).join("");
  let raster = "";
  [0,25,50,75,100].forEach(p => { const y = PT + (H-PT-PB) * (1 - p/100);
    raster += `<line class="gl" x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}"/>
      <text class="ax" x="${PL-6}" y="${y+3}" text-anchor="end">${p}%</text>`; });
  const schritt = Math.max(1, Math.ceil(fenster.length/5));
  const xl = fenster.map((x,i) => i % schritt === 0
    ? `<text class="ax" x="${(PL+bw*i+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${
        dshort(x.date)}</text>` : "").join("");

  return `
  <div class="karte" style="display:flex;align-items:center;gap:10px">
    <span style="color:rgba(255,255,255,.7)">${ICON_TACHO}</span>
    <span style="flex:1;font-size:13px;font-weight:800;letter-spacing:.05em;
      text-transform:uppercase">Gesamttagesstress</span>
  </div>
  <div style="padding:8px 16px 0">
    <div class="row" style="align-items:flex-start">
      <div>
        <div class="lbl" style="line-height:1.35">Durchschn.<br>hoher Stress</div>
        <div class="num" style="font-size:32px;margin-top:6px">${
          jetzt == null ? "–" : hm(jetzt)}<span class="lbl" style="font-size:13px"> Std.</span></div>
      </div>
      <span class="seg">${["W","M","6M"].map(k =>
        `<button data-strend="${k}" aria-pressed="${S.strendZeit===k}">${k}</button>`).join("")}</span>
    </div>
    ${delta != null && Math.abs(delta) >= 1 ? `<div style="display:inline-block;margin-top:10px;
      padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:800;
      background:${delta>0?"rgba(255,176,32,.16)":"rgba(0,241,159,.16)"};
      color:${delta>0?"var(--z4)":"var(--green)"}">${delta>0?"▲":"▼"} ${Math.abs(delta)} %
      gegenüber davor</div>` : ""}
    <div class="tx" style="font-size:14px;line-height:1.55;color:rgba(255,255,255,.82);
      margin-top:16px">${jetzt == null
      ? "Für diesen Zeitraum liegen noch keine Verteilungen vor."
      : `Du warst in diesem Zeitraum durchschnittlich <b>${hm(jetzt)} Stunden</b> im Bereich mit
         hohem Stress${davor ? `, gegenüber <b>${hm(davor)}</b> im Zeitraum davor` : ""}.
         Darin enthalten sind auch Schlaf und Aktivitäten.`}</div>
  </div>
  <div class="karte">
    <div style="display:flex;gap:14px;margin-bottom:12px" class="small muted">
      ${STRESS_STUFEN.slice().reverse().map(([k,l,c]) =>
        `<span><i class="sq" style="background:${c}"></i> ${esc(l)}</span>`).join("")}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${raster}${saeulen}${xl}</svg>
    <div class="chartnote">Jede Säule ist ein Tag, aufgeteilt auf die drei Bereiche.
      Der Durchschnitt oben schließt den heutigen, noch unvollständigen Tag mit ein.</div>
  </div>`;
}

            border-radius:2px"></div>

// gegen einen Bevölkerungswert. Die Texte erklären, was der Wert bedeutet und

   hoch:"Eine erhöhte Hauttemperatur kann heißen: dein Körper wehrt einen Infekt ab, das Schlafzimmer war zu warm, Alkohol am Vorabend — oder, bei Zyklus, die zweite Zyklushälfte.",
   tief:"Eine niedrigere Hauttemperatur tritt bei kühler Schlafumgebung oder locker sitzendem Band auf."},
];

function vitalStand(m, r, w){
  const v = r[m.k];
  if(v == null) return {v, beurteilbar:false, grund:"keine Daten an diesem Tag"};

  if(m.fest != null){
    // Hauttemperatur ist bereits eine Abweichung - feste Schwellen, kein Verlauf nötig
    const a = Math.abs(v);
    return {v, beurteilbar:true, z:v/m.fest, mittel:0, sd:m.fest,
            stufe: a<=m.fest ? "normal" : a<=m.fest*2 ? "leicht" : "deutlich",
            richtung: v>0 ? "hoch" : "tief"};
  }
  const s = stats(w.map(x=>x.recovery[m.k]));
  const genug = w.filter(x=>x.recovery[m.k]!=null).length >= MINBASIS;
  if(!genug || !s.sd) return {v, beurteilbar:false, grund:`Normalbereich wird noch aufgebaut`};
  const z = (v - s.m) / s.sd;
  return {v, beurteilbar:true, z, mittel:s.m, sd:s.sd,
          stufe: Math.abs(z)<=1 ? "normal" : Math.abs(z)<=2 ? "leicht" : "deutlich",
          richtung: z>0 ? "hoch" : "tief"};
}

const STUFENFARBE = {normal:"var(--green)", leicht:"var(--z4)", deutlich:"var(--z5)"};
const STUFENWORT = {normal:"IM NORMALBEREICH", leicht:"LEICHT ABWEICHEND", deutlich:"DEUTLICH ABWEICHEND"};
/* ---------- Gesundheitsmonitor ---------- */
// Bereichstext wie im Vorbild: liegt der Wert drin, steht dort die Spanne;
// liegt er darueber oder darunter, steht das mit der jeweiligen Grenze da.
function bereichsText(m, s){
  if(!s.beurteilbar) return null;
  const e = m.einheit === "%" ? "%" : "";
  const f = v => nv(v) + (e ? e : "");
  if(m.fest != null){
    return Math.abs(s.v) <= m.fest
      ? `innerhalb von −${n1(m.fest)} bis +${n1(m.fest)}`
      : s.v > 0 ? `erhöht > +${n1(m.fest)}` : `niedrig < −${n1(m.fest)}`;
  }
  const unten = s.mittel - s.sd, oben = s.mittel + s.sd;
  if(s.stufe === "normal") return `zwischen ${f(unten)} und ${f(oben)}`;
  return s.richtung === "hoch" ? `erhöht > ${f(oben)}` : `niedrig < ${f(unten)}`;
}

const STUFEN_FLAECHE = {
  normal:   "rgba(0,241,159,.13)",
  leicht:   "rgba(255,176,32,.13)",
  deutlich: "rgba(255,60,60,.13)",
};

function vGesundheit(){
  const d = day(), r = d.recovery, w = win();

  // Der Puls in Ruhe traegt den Kopf. Eine laufende Herzfrequenz gibt es
  // nicht - dafuer braeuchte es Minutenwerte, die hier nicht ankommen.
  const rhrM = VITALE.find(m => m.k === "rhr");
  const rhrS = vitalStand(rhrM, r, w);
  const reihe = w.map(x => x.recovery.rhr);
  const vorhanden = reihe.filter(x => x != null);
  const lo = vorhanden.length ? Math.min(...vorhanden) - 2 : 0;
  const hi = vorhanden.length ? Math.max(...vorhanden) + 2 : 1;
  const W = 300, H = 64;
  const X = i => (i / Math.max(1, reihe.length - 1)) * W;
  const Y = v => H - ((v - lo) / Math.max(1, hi - lo)) * H;
  const teile = []; let lauf = [];
  reihe.forEach((v, i) => { if(v == null){ if(lauf.length > 1) teile.push(lauf); lauf = []; }
                            else lauf.push([X(i), Y(v)]); });
  if(lauf.length > 1) teile.push(lauf);
  const letzter = [...reihe].reverse().findIndex(v => v != null);
  const letzterIdx = letzter < 0 ? -1 : reihe.length - 1 - letzter;

  const kachel = m => {
    const s = vitalStand(m, r, w);
    const f = s.beurteilbar ? STUFENFARBE[s.stufe] : "var(--dim2)";
    const txt = bereichsText(m, s);
    return `<button class="gkachel" data-vital="${m.k}">
      <div class="gk-kopf">${m.icon}<span>${esc(m.kurz || m.label)}</span></div>
      <div class="gk-wert"><b>${s.v == null ? "–"
        : (m.fest != null ? (s.v > 0 ? "+" : s.v < 0 ? "−" : "") + n1(Math.abs(s.v)) : nv(s.v))
        }</b><span>${esc(m.einheit)}</span></div>
      ${txt ? `<div class="gk-pille" style="background:${STUFEN_FLAECHE[s.stufe]};color:${f}">
        ${s.stufe === "normal" ? "✓" : "!"} ${esc(txt)}</div>`
        : `<div class="gk-pille" style="background:rgba(255,255,255,.06);color:var(--dim2)">${
            esc(s.grund || "keine Daten")}</div>`}
    </button>`;
  };

  const rhrFarbe = rhrS.beurteilbar ? STUFENFARBE[rhrS.stufe] : "var(--dim2)";
  const rhrBereich = bereichsText(rhrM, rhrS);

  return `
  <div style="padding:6px 18px 4px">
    <div class="lbl" style="color:#fff;font-size:12px">Ruheherzfrequenz</div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;
      margin-top:12px">
      <div>
        <div class="herzschlag" style="color:var(--blue);margin-bottom:6px">${ICON_HERZ_VOLL}</div>
        <div class="num" style="font-size:42px;line-height:1">${rhrS.v == null ? "–" : nv(rhrS.v)}</div>
        <div class="lbl" style="margin-top:4px">S/min</div>
        <div class="small" style="margin-top:7px;color:${rhrFarbe}">${esc(rhrBereich || "wird kalibriert")}</div>
      </div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible">
        ${teile.map(s => `<path class="dl anim" stroke="var(--blue)" stroke-width="2"
          d="M${s.map(q => q.map(v => v.toFixed(1)).join(",")).join("L")}"/>`).join("")}
        ${letzterIdx >= 0 ? `<line x1="${X(letzterIdx).toFixed(1)}" y1="-6"
          x2="${X(letzterIdx).toFixed(1)}" y2="${H+6}" stroke="rgba(255,255,255,.22)"
          stroke-width="1" stroke-dasharray="3 4"/>
          <circle cx="${X(letzterIdx).toFixed(1)}" cy="${Y(reihe[letzterIdx]).toFixed(1)}" r="4"
            fill="#fff"/>` : ""}
      </svg>
    </div>
    <div style="height:1px;background:var(--line);margin:18px 0 4px"></div>
  </div>

  <div class="gkraster">
    ${VITALE.filter(m => m.k !== "rhr").map(kachel).join("")}
  </div>

  <button class="gteilen" id="g-teilen">${ICON_TEILEN}
    <span>Teile deinen Gesundheitsbericht</span></button>

  <div class="karte">
    <div class="kopfzeile" style="margin-bottom:10px"><span class="t">Herzfrequenzvariabilit&auml;t</span></div>
    ${(() => { const v = w.map(x => x.recovery.hrv), s = stats(v);
      const bandOk = v.filter(x => x != null).length >= MINBASIS && s.sd > 0;
      return lineChart(w.map(x => ({x:dshort(x.date), full:dlong(x.date), y:x.recovery.hrv})),
        {h:150, color:"var(--blue)", band:bandOk ? [s.m-s.sd, s.m+s.sd] : null,
         fmtY:v => Math.round(v), fmtT:v => n1(v) + " ms"});})()}
    <div class="chartnote">Das hinterlegte Band ist dein Normalbereich &uuml;ber ${S.period} Tage.</div>
  </div>
  ${rohtabelle()}`;
}

/* ---------- Detailkarte zu einem Vitalwert ---------- */
function zeigeVitalDetail(k){
  const m = VITALE.find(x => x.k === k);
  if(!m) return;
  const d = day(), s = vitalStand(m, d.recovery, win());
  const f = s.beurteilbar ? STUFENFARBE[s.stufe] : "var(--dim2)";
  const txt = bereichsText(m, s);

  let spannen = "";
  if(s.beurteilbar && m.fest == null){
    const u = s.mittel - s.sd, o = s.mittel + s.sd, u2 = s.mittel - 2*s.sd, o2 = s.mittel + 2*s.sd;
    const hoeherBesser = m.k === "hrv" || m.k === "spo2";
    spannen = hoeherBesser
      ? `Gr&uuml;n = ${nv(u)} ${esc(m.einheit)} und dar&uuml;ber<br>
         Orange = ${nv(u2)} bis ${nv(u)} ${esc(m.einheit)}<br>
         Rot = ${nv(u2)} ${esc(m.einheit)} und darunter`
      : `Gr&uuml;n = ${nv(u)} bis ${nv(o)} ${esc(m.einheit)}<br>
         Orange = bis ${nv(o2)} ${esc(m.einheit)}<br>
         Rot = dar&uuml;ber oder darunter`;
  } else if(m.fest != null){
    spannen = `Gr&uuml;n = innerhalb von &plusmn;${n1(m.fest)} &deg;C<br>
      Orange = bis &plusmn;${n1(m.fest*2)} &deg;C<br>
      Rot = dar&uuml;ber`;
  }

  const alt = document.getElementById("vitaldetail");
  if(alt) alt.remove();
  const box = document.createElement("div");
  box.id = "vitaldetail";

/* ---------- Rahmen ---------- */
// Die Knöpfe werden EINMAL gebaut und danach nur noch bewegt. Würde man sie
// bei jedem Wechsel neu schreiben, gäbe es nichts zu animieren - CSS kann nur
// Elemente überblenden, die schon da sind.
function navAufbauen(){
  document.getElementById("tabs").innerHTML = TABS.map(([k,l])=>
    `<button role="tab" data-tab="${k}">${esc(l)}</button>`).join("");
}

// Schalter für die Scheibe. false = vorübergehend aus, der Code bleibt.
const NAV_SICHTBAR = false;
const NAV_SCHRITT = 38 * Math.PI/180;      // Winkelabstand zweier Rubriken
const navRadius = () => ((document.getElementById("tabs").clientWidth || 360) * 0.58);
// Weg in Pixeln, den der Finger je Rubrik zurücklegen muss
const navProSchritt = () => navRadius() * NAV_SCHRITT;

// Deckkraft je Abstand. Dazwischen wird linear überblendet, damit beim
// Ziehen nichts springt.
const NAV_DECK = [1, 0.95, 0.5, 0, 0];
function stufeninterpolation(reihe, x){
  const a = Math.min(reihe.length-1, Math.abs(x));
  const i0 = Math.floor(a), i1 = Math.min(reihe.length-1, i0+1);
  return reihe[i0] + (reihe[i1]-reihe[i0]) * (a-i0);
}
function farbmischung(von, nach, t){
  t = Math.max(0, Math.min(1, t));
  return `rgb(${von.map((c,i)=>Math.round(c + (nach[i]-c)*t)).join(",")})`;
}

// versatz: gebrochene Verschiebung beim Ziehen (0 = eingerastet)
function navDrehen(versatz){
  versatz = versatz || 0;
  const nav = document.getElementById("tabs");
  const n = TABS.length;
  const aktiv = TABS.findIndex(t => t[0] === S.tab);
  if(aktiv < 0) return;
  const radius = navRadius();

  [...nav.children].forEach((b, i) => {
    // Kürzester Weg auf dem Kreis, auch bei gebrochenem Versatz
    let d = i - aktiv - versatz;
    d = ((d + n/2) % n + n) % n - n/2;

    const winkel = d * NAV_SCHRITT;
    const tiefe = Math.cos(winkel);                 // 1 vorne, -1 ganz hinten
    const x = radius * Math.sin(winkel);
    const y = -(1 - tiefe) * 10;                    // hinten sitzt es höher
    // Grundgröße läuft bis nach hinten durch, mit Untergrenze. Der Zuschlag
    // wirkt durch die hohe Potenz praktisch nur auf die mittlere Rubrik -
    // die Nachbarn bleiben so groß wie bisher.
    const basis = 0.50 + 0.50 * Math.max(0, tiefe);
    const spitze = Math.pow(Math.max(0, tiefe), 14);
    const groesse = basis * (1 + 0.35 * spitze);
    const nah = Math.abs(d);

    b.style.transform = `translate(-50%,-50%) translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`
      + ` scale(${groesse.toFixed(3)})`;
    b.style.opacity = stufeninterpolation(NAV_DECK, nah).toFixed(3);
    b.style.color = nah <= 1
      ? farbmischung([0,241,159], [138,147,157], nah)
      : farbmischung([138,147,157], [92,101,111], (nah-1)/2);
    b.style.textShadow = nah < 0.9
      ? `0 0 20px rgba(0,241,159,${(0.38*(1-nah)).toFixed(2)})` : "none";
    b.style.zIndex = String(20 - Math.round(nah*4));
    b.style.pointerEvents = nah <= 2.4 ? "auto" : "none";
    b.setAttribute("aria-selected", String(nah < 0.5));
  });
}
addEventListener("resize", () => { if(document.getElementById("tabs").children.length) navDrehen(); });

function animate(){
  if(RM) return;
  document.querySelectorAll("#view .anim").forEach(p=>{
    // Pfadlänge messen statt schätzen — geschätzte Werte lassen Teile verschwinden
    const len = p.getTotalLength();
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.getBoundingClientRect();
    p.style.transition = "stroke-dashoffset .9s cubic-bezier(.25,.7,.35,1)";
    p.style.strokeDashoffset = 0;
  });
  // Freistehende Zähler, etwa die Tagesserie
  document.querySelectorAll("#view .zaehler").forEach(el=>{
    const ziel = parseFloat(el.dataset.ziel || 0);
    const dauer = 950, beginn = performance.now();
    const kurve = t => 1 - Math.pow(1 - t, 3);
    (function schritt(jetzt){
      const t = Math.min(1, (jetzt - beginn) / dauer);
      el.textContent = String(Math.round(ziel * kurve(t)));
      if(t < 1) requestAnimationFrame(schritt);
    })(beginn);
  });

  // Ring und Zahl laufen aus EINER Schleife mit derselben Kurve und Dauer.
  // Zwei getrennte Animationen (CSS für den Ring, Zähler in JavaScript)
  // würden auseinanderdriften - so starten und enden sie garantiert gleich.
  document.querySelectorAll("#view .ringarc").forEach(ringAnimieren);
  saeulenAnimieren();
}

// Ein einzelner Ring. Steckt in einer eigenen Funktion, damit ein Antippen
// genau diesen einen Ring neu laufen lassen kann - und keinen der anderen.
function ringAnimieren(c){
  if(RM) return;
  {
    // Immer die echte Pfadlaenge messen. Der Browser naehert den Kreis mit
    // Bezierkurven an, die Laenge weicht leicht von 2*pi*r ab. Rechnet man
    // mit dem eigenen Wert, wird der Rest bei 100 % negativ - und eine
    // negative Dash-Laenge macht die ganze Regel ungueltig: der Ring bliebe leer.
    const full = c.getTotalLength();
    const dash = full * parseFloat(c.dataset.frac || 0);
    const zahl = c.closest("svg").querySelector(".ringzahl");
    const ziel = c.dataset.ziel === "" ? null : parseFloat(c.dataset.ziel);
    const dez = +(c.dataset.dez || 0);
    const dauer = 950;
    const beginn = performance.now();
    const kurve = t => 1 - Math.pow(1 - t, 3);

    c.style.strokeDasharray = `0 ${full}`;
    if(zahl && ziel != null) zahl.textContent = "0";

    (function schritt(jetzt){
      const t = Math.min(1, (jetzt - beginn) / dauer);
      const e = kurve(t);
      c.style.strokeDasharray = `${dash*e} ${Math.max(0, full - dash*e)}`;
      if(zahl && ziel != null){
        // Durchgehend dieselbe Stellenzahl. Erst ganzzahlig zu zählen und am
        // Ende auf 15,3 zu springen, sieht nach einem Fehler aus - die
        // Belastung läuft deshalb von 0,0 an in Zehntelschritten hoch.
        const jetztWert = t < 1 ? ziel * e : ziel;
        zahl.textContent = dez ? n1(jetztWert) : String(Math.round(jetztWert));
      }
      if(t < 1) requestAnimationFrame(schritt);
    })(beginn);
  }
}

// Säulen wachsen einmal auf
function saeulenAnimieren(){
  if(RM) return;
  document.querySelectorAll("#view .gbar").forEach(b=>{
    const h = +b.getAttribute("height"), y = +b.getAttribute("y");
    b.setAttribute("height",0); b.setAttribute("y",y+h);
    b.getBoundingClientRect();
    b.style.transition = "height .8s cubic-bezier(.2,.7,.3,1), y .8s cubic-bezier(.2,.7,.3,1)";
    b.setAttribute("height",h); b.setAttribute("y",y);
  });
}

/* ---------- Ereignisse ---------- */
const tip = document.getElementById("tip");
// Reiterwechsel immer gleich: oben anfangen, damit die Seite nicht auf
// halber Hoehe eines anderen Reiters stehen bleibt.
// Bildschirme, die man von woanders aus oeffnet. Sie tragen oben links den
// Pfeil zurueck; die drei Ziele der unteren Leiste tun das nicht.
const OHNE_TITEL = ["schlaf","erholung"];
const UNTERSEITEN = ["schlaf","belastung","erholung","stress","aktivitaeten","verhalten",
  "profil","streak","ausblick","stresstrend","atemuebung","schlaftrend","mehr",
  "schlafplaner","schlafziel","planansicht","planbearbeiten","plandetails",
  "planpicker","planziel","logbuch","logbuchanpassen","einblicke","verhaltendetail"];

// Springt im Weg zurueck, bis der genannte Bildschirm wieder oben liegt.
function zurueckBis(name){
  if(!S.weg.includes(name)){ S.weg = ["uebersicht"]; setzeReiter(name, -1, true); return; }
  while(S.weg.length && S.weg[S.weg.length-1] !== name) S.weg.pop();
  S.weg.pop();
  setzeReiter(name, -1, true);
}

function zurueck(){
  const ziel = S.weg.length ? S.weg.pop() : "uebersicht";
  setzeReiter(ziel, -1, true);
}

function setzeReiter(name, richtung, zurueckSchritt){
  if(name===S.tab) return;
  meldungenWeg();

  // Richtung aus der Reihenfolge ableiten, wenn sie nicht mitgegeben wurde -
  // damit auch ein Tippen auf die Reiterleiste in die richtige Seite blättert.
  if(!richtung){
    // Feste Reihenfolge der Hauptbildschirme. Daraus ergibt sich, ob der
    // neue Inhalt von rechts oder von links hereinkommt.
    const RANG = {uebersicht:0, gesundheit:1, mehr:2};
    const rangVon = k => RANG[k] !== undefined ? RANG[k]
      : ["profil","streak","ausblick","stresstrend","atemuebung","schlaftrend",
         "schlafplaner","schlafziel","planansicht","planbearbeiten","plandetails",
         "planpicker","planziel","logbuch","logbuchanpassen","einblicke",
         "verhaltendetail"].includes(k) ? 4 : 3;
    const rv = rangVon(S.tab), rz = rangVon(name);
    if(rv !== rz) richtung = rz > rv ? 1 : -1;
  }
  if(!richtung){
    const n = TABS.length;
    const von = TABS.findIndex(t=>t[0]===S.tab), zu = TABS.findIndex(t=>t[0]===name);
    if(zu < 0)      richtung = 1;    // ins Profil hinein
    else if(von < 0) richtung = -1;  // aus dem Profil heraus
    else {
      // Kürzester Weg auf dem Kreis - genau wie in navDrehen. Ein reiner
      // Index-Vergleich läge am Übergang vom letzten zum ersten Reiter
      // falsch: Gesundheit steht auf der Scheibe LINKS von Home, obwohl es
      // den höheren Index hat. Der Inhalt wäre dort gegen die Drehrichtung
      // gelaufen.
      const d = ((zu - von + n/2) % n + n) % n - n/2;
      richtung = d > 0 ? 1 : -1;
    }
  }
  if(S.tab !== "profil") S.vorher = S.tab;
  // Weg mitschreiben: zu einer Unterseite kommt der bisherige Bildschirm auf
  // den Stapel, auf einer der drei Hauptseiten wird er geleert.
  if(!zurueckSchritt){
    if(UNTERSEITEN.includes(name)){
      if(S.weg[S.weg.length-1] !== S.tab) S.weg.push(S.tab);
      if(S.weg.length > 12) S.weg.shift();
    } else S.weg = [];
  }

  const buehne = document.getElementById("buehne");
  const ansicht = document.getElementById("view");

  if(RM){
    S.tab = name; render(); ansicht.scrollTop = 0; return;
  }

  // Kopie der bisherigen Ansicht. Sie liegt deckungsgleich über der Bühne
  // und bekommt dieselbe Scrollhöhe - dadurch zeigt sie exakt den Ausschnitt,
  // den man gerade gesehen hat, und bewegt sich nur noch waagerecht.
  const vorher = buehne.getBoundingClientRect();
  const altStand = ansicht.scrollTop;
  const alt = document.createElement("div");
  alt.className = "altansicht";
  alt.innerHTML = ansicht.innerHTML;
  buehne.appendChild(alt);

  S.tab = name;
  render();
  ansicht.scrollTop = 0;

  // Die Kopfzeile ist nicht überall gleich hoch: auf Schlaf und Erholung fällt
  // die Wortmarke weg, die Bühne beginnt dadurch weiter oben. Ohne Gegenmaß
  // spränge die abziehende Ansicht im selben Moment senkrecht. Sie wird
  // deshalb auf ihre ursprüngliche Lage und Höhe festgenagelt.
  const nachher = buehne.getBoundingClientRect();
  if(Math.abs(nachher.top - vorher.top) > 0.5 || Math.abs(nachher.height - vorher.height) > 0.5){
    alt.style.top = (vorher.top - nachher.top) + "px";
    alt.style.height = vorher.height + "px";
    alt.style.bottom = "auto";
  }
  alt.scrollTop = altStand;

  const dauer = 320;
  const kurve = "cubic-bezier(.3,0,.2,1)";
  alt.animate(
    [{transform:"translateX(0)", opacity:1},
     {transform:`translateX(${-richtung*100}%)`, opacity:0}],
    {duration:dauer, easing:kurve}
  ).onfinish = () => alt.remove();

  ansicht.animate(
    [{transform:`translateX(${richtung*100}%)`, opacity:.5},
     {transform:"translateX(0)", opacity:1}],
    {duration:dauer, easing:kurve}
  );
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab]");
  if(t){ setzeReiter(t.dataset.tab); return; }
  const g = e.target.closest("[data-goto]");
  if(g){ e.preventDefault(); setzeReiter(g.dataset.goto); return; }
  const p = e.target.closest("[data-period]");
  if(p){ S.period=+p.dataset.period; render(); return; }

  // Einheit nachtragen
  if(e.target.closest("#m-add")){
    const name = document.getElementById("m-name").value.trim();
    const datum = document.getElementById("m-datum").value;
    const dauer = parseInt(document.getElementById("m-dauer").value, 10);
    if(!name || !datum){ alert("Bitte Datum und Sportart angeben."); return; }
    if(!D.some(d => d.date === datum)){ alert("Für dieses Datum gibt es keine Messdaten."); return; }
    const liste = manuelle();
    liste.push({date: datum, name,
      duration_min: (dauer>0 && dauer<=600) ? dauer : null, manual: true});
    liste.sort((a,b)=> a.date < b.date ? 1 : -1);
    if(!speichereManuelle(liste)){
      alert("Speichern nicht möglich — der Browser erlaubt hier keinen lokalen Speicher.");
      return;
    }
    render();
    return;
  }
  // Atemübung starten. Bewusst OHNE render(): ein Neuaufbau würde den Kreis
  // ersetzen und die laufende Übung abbrechen.
  const at = e.target.closest("[data-atem]");
  if(at){
    document.querySelectorAll("[data-atem]").forEach(b =>
      b.setAttribute("aria-pressed", String(b === at)));
    // Ohne Neuaufbau muss der Erklärtext von Hand nachgezogen werden -
    // sonst stünde dort weiter die Erklärung des anderen Musters.
    const hinweis = document.getElementById("atem-hinweis");
    if(hinweis) hinweis.textContent = ATEM[at.dataset.atem].hinweis;
    atemStart(at.dataset.atem);
    return;
  }

  // Stressmonitor
  if(e.target.closest("[data-coach]")){ kurzmeldung("Demnächst verfügbar"); return; }
  if(e.target.closest("[data-stressinfo]")){ zeigeStressInfo(); return; }
  const st = e.target.closest("[data-strend]");
  if(st){ S.strendZeit = st.dataset.strend; S.strendVersatz = 0; render(); return; }

  // Trendanzeige: Größe wählen, Liste auf- und zuklappen, Zeitraum blättern
  const tm = e.target.closest("[data-strendmetrik]");
  if(tm){
    S.strendM = tm.dataset.strendmetrik;
    S.strendVersatz = 0;
    S.strendOffen = false;
    if(S.tab === "schlaftrend"){ render(); document.getElementById("view").scrollTop = 0; }
    else setzeReiter("schlaftrend", 1);
    return;
  }
  if(e.target.closest("[data-trendoffen]")){ S.strendOffen = !S.strendOffen; render(); return; }
  const ts = e.target.closest("[data-trendschritt]");
  if(ts){
    S.strendVersatz = Math.max(0, S.strendVersatz - (+ts.dataset.trendschritt));
    render();
    return;
  }
  // ---- Wochenplan und Schlafplaner ----
  if(e.target.closest("[data-logbuch]")){ setzeReiter("logbuch", 1); return; }
  if(e.target.closest("[data-loganpassen]")){ setzeReiter("logbuchanpassen", 1); return; }
  const wd = e.target.closest("[data-wdetail]");
  if(wd){ S.detailK = wd.dataset.wdetail; setzeReiter("verhaltendetail", 1); return; }
  if(e.target.closest("[data-logfertig]")){ zurueck(); return; }
  const lk = e.target.closest("[data-logkat]");
  if(lk){ S.logKat = lk.dataset.logkat; render(); document.getElementById("view").scrollTop = 0;
    return; }
  const la = e.target.closest("[data-logan]");
  if(la){
    const k = la.dataset.logan;
    if(!logbuchSetzen(k, !logbuchAktiv().includes(k))){
      alert("Speichern nicht möglich — der Browser erlaubt hier keinen lokalen Speicher.");
      return;
    }
    // Ohne Neuaufbau: die Liste ist lang, ein render() würde nach oben springen
    la.setAttribute("aria-pressed", String(logbuchAktiv().includes(k)));
    return;
  }
  const lt = e.target.closest("[data-logtag]");
  if(lt){
    const i = +lt.dataset.logtag;
    if(i >= 0){ S.day = i; render(); }
    return;
  }
  const lg = e.target.closest("[data-loga]");
  if(lg){
    const k = lg.dataset.loga, ja = lg.dataset.logw === "ja";
    // Bewusst kein Zurücknehmen durch nochmaliges Tippen: im Demo-Datensatz
    // steht für manche Tage schon eine Antwort, die dann wieder durchschlüge -
    // das sähe aus, als hätte der Knopf nicht reagiert.
    if(!journalSetzen(day().date, k, ja)){
      alert("Speichern nicht möglich — der Browser erlaubt hier keinen lokalen Speicher.");
      return;
    }
    render();
    return;
  }
  if(e.target.closest("[data-wecker]")){
    kurzmeldung("Wecker: demnächst verfügbar");
    return;
  }
  if(e.target.closest("[data-planauf]")){ S.planOffen = !S.planOffen; render(); return; }
  const sz = e.target.closest("[data-schlafziel]");
  if(sz){
    const p = schlafplan();
    p.zielart = sz.dataset.schlafziel;
    speichereSchlafplan(p);
    render();
    return;
  }
  if(e.target.closest("[data-zielspeichern]")){ zurueck(); return; }
  const pd = e.target.closest("[data-plandetails]");
  if(pd){
    S.entwurf = entwurfAusVorlage(pd.dataset.plandetails);
    setzeReiter("plandetails", 1);
    return;
  }
  const pk = e.target.closest("[data-picker]");
  if(pk){ S.pickerArt = pk.dataset.picker; setzeReiter("planpicker", 1); return; }
  if(e.target.closest("[data-pickerfertig]")){ zurueck(); return; }

  const mp = e.target.closest("[data-metrikplus]");
  if(mp){
    const m = metrikVon(mp.dataset.metrikplus);
    S.entwurf.metriken.push({k:m.k, ziel:metrikVorschlag(m)});
    render();
    return;
  }
  const mw = e.target.closest("[data-metrikweg]");
  if(mw){
    S.entwurf.metriken = S.entwurf.metriken.filter(z => z.k !== mw.dataset.metrikweg);
    render();
    return;
  }
  const vp = e.target.closest("[data-verhaltenplus]");
  if(vp){
    const w = verhaltenWirkung(vp.dataset.verhaltenplus);
    S.entwurf.verhalten.push({k:vp.dataset.verhaltenplus, tage:4,
      vermeiden:!!(w && w.pct < 0)});
    render();
    return;
  }
  const vw = e.target.closest("[data-verhaltenweg]");
  if(vw){
    S.entwurf.verhalten = S.entwurf.verhalten.filter(z => z.k !== vw.dataset.verhaltenweg);
    render();
    return;
  }
  const ap = e.target.closest("[data-aktplus]");
  if(ap){ S.entwurf.aktivitaeten.push({k:ap.dataset.aktplus, tage:2}); render(); return; }
  const aw = e.target.closest("[data-aktweg]");
  if(aw){
    S.entwurf.aktivitaeten = S.entwurf.aktivitaeten.filter(z => z.k !== aw.dataset.aktweg);
    render();
    return;
  }
  const mz = e.target.closest("[data-metrikziel]");
  if(mz){
    S.zielMetrik = mz.dataset.metrikziel;
    const z = S.entwurf.metriken.find(x => x.k === S.zielMetrik);
    S.zielWert = z ? z.ziel : metrikVorschlag(metrikVon(S.zielMetrik));
    setzeReiter("planziel", 1);
    return;
  }
  if(e.target.closest("[data-zielfertig]")){
    const z = S.entwurf.metriken.find(x => x.k === S.zielMetrik);
    if(z && S.zielWert != null) z.ziel = S.zielWert;
    zurueck();
    return;
  }
  if(e.target.closest("[data-planstart]")){
    const e2 = S.entwurf;
    if(!e2 || (!e2.metriken.length && !e2.verhalten.length && !e2.aktivitaeten.length)) return;
    if(!planSchreiben({...e2, start:day().date})){
      alert("Speichern nicht möglich — der Browser erlaubt hier keinen lokalen Speicher.");
      return;
    }
    S.planOffen = true;
    zurueckBis("planansicht");
    return;
  }

  // Erklärung zu einer Schlafkarte
  const si = e.target.closest("[data-schlafinfo]");
  if(si){ zeigeSchlafInfo(si.dataset.schlafinfo); return; }
  if(e.target.closest("[data-schlafcoach]")){
    const ziel = document.getElementById("coachziel");
    if(ziel) ziel.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  const ab = e.target.closest("[data-atemstart]");
  if(ab){ S.atemArt = ab.dataset.atemstart; atemLauf = null; setzeReiter("atemuebung", 1); return; }
  if(e.target.closest("#atem-los")){ atemStart(S.atemArt || "beruhigen"); return; }

  // Benachrichtigung als gelesen markieren
  const bq = e.target.closest("[data-gelesen]");
  if(bq){ benachrichtigungLesen(bq.dataset.gelesen); render(); return; }

  // Vitalwert antippen: Detailkarte
  const vt = e.target.closest("[data-vital]");
  if(vt){ zeigeVitalDetail(vt.dataset.vital); return; }
  if(e.target.closest("#g-teilen")){ kurzmeldung("Demnächst verfügbar"); return; }

  // Ring antippen: nur dieser eine läuft neu an
  const rt = e.target.closest("[data-ringtap]");
  if(rt){
    const c = rt.querySelector(".ringarc");
    if(c) ringAnimieren(c);
    return;
  }

  // Profil: Zeitraum, Aktivitätenliste, Bearbeiten
  const pz = e.target.closest("[data-pzeit]");
  if(pz){ S.pzeit = pz.dataset.pzeit; S.pAlle = false; render(); return; }
  const pa = e.target.closest("[data-palle]");
  if(pa){ S.pAlle = pa.dataset.palle === "1"; render(); return; }
  if(e.target.closest("#p-edit-knopf")){ S.pbearbeiten = true; render(); return; }

  // Untere Leiste
  const ub = e.target.closest("[data-unten]");
  if(ub){ setzeReiter(ub.dataset.unten); return; }

  // Journal: Verhalten für einen Tag an- oder abschalten
  const chip = e.target.closest("[data-jkey]");
  if(chip){
    const an = chip.getAttribute("aria-pressed") !== "true";
    if(!journalSetzen(chip.dataset.jdatum, chip.dataset.jkey, an)){

      return;
    }
    render();
    return;
  }

  // Schlaf-Coach: Ziel umstellen
  const zk = e.target.closest("[data-ziel]");
  if(zk){
    const p = schlafplan();
    p.ziel = parseFloat(zk.dataset.ziel);
    speichereSchlafplan(p);
    render();
    return;
  }

  if(e.target.closest("#p-abmelden")){ window.abmelden(); return; }
  // Profil speichern / bearbeiten
  if(e.target.closest("#p-save")){
    const name = document.getElementById("p-name").value.trim();
    const gebtag = document.getElementById("p-gebtag").value;
    const handle = (document.getElementById("p-handle").value || "").trim().replace(/^@+/, "");
    const land = ((document.getElementById("p-land").value || "DE").trim() || "DE").toUpperCase();
    if(!gebtag){ alert("Bitte ein Geburtsdatum angeben."); return; }
    const a = alterAm(gebtag, D[LAST].date);
    if(a == null || a < 10 || a > 110){ alert("Bitte ein plausibles Geburtsdatum angeben."); return; }
    S.pbearbeiten = false;
    if(!speichereProfil({name, geburtstag: gebtag, handle, land})){
      alert("Speichern nicht möglich — der Browser erlaubt hier keinen lokalen Speicher.");
      return;
    }
    render();
    return;
  }
  const del = e.target.closest("[data-del]");
  if(del){
    const liste = manuelle();
    liste.splice(+del.dataset.del, 1);
    speichereManuelle(liste);
    render();
    return;
  }
});

/* ---------- Scheibe am Finger mitdrehen ---------- */
// Nur auf der Leiste selbst. Ein Wisch irgendwo sonst auf dem Bildschirm
// bleibt bei genau einer Rubrik - das regelt der touchend-Handler weiter unten.
// Bewusst OHNE setPointerCapture: das zieht den Finger auf die Leiste um und
// kann das abschließende Tippen verschlucken. Stattdessen werden Bewegung und
// Loslassen am Fenster verfolgt - der Finger darf die Leiste dabei verlassen.
// Erst ab SCHWELLE Pixeln gilt es als Ziehen; darunter bleibt es ein Tippen
// und der Klick läuft völlig unangetastet durch.
(function(){
  const nav = document.getElementById("tabs");
  const SCHWELLE = 8;
  let start = null, versatz = 0, gezogen = false;

  function beginn(x){
    if(S.tab === "profil") return;
    start = x; versatz = 0; gezogen = false;
  }
  function bewegung(x){
    if(start === null) return false;
    const dx = x - start;
    if(!gezogen && Math.abs(dx) < SCHWELLE) return false;
    if(!gezogen){ gezogen = true; nav.classList.add("zieht"); }
    // Nach links ziehen heißt vorwärts durch die Rubriken
    versatz = -(dx > 0 ? dx - SCHWELLE : dx + SCHWELLE) / navProSchritt();
    navDrehen(versatz);
    return true;
  }
  function ende(){
    if(start === null) return;
    start = null;
    if(!gezogen){ navDrehen(); return; }
    nav.classList.remove("zieht");
    const n = TABS.length;
    const aktiv = TABS.findIndex(t => t[0] === S.tab);
    const richtung = versatz > 0 ? 1 : -1;
    let ziel = Math.round(aktiv + versatz);           // auf die nächste einrasten
    ziel = ((ziel % n) + n) % n;
    versatz = 0;
    if(aktiv < 0 || TABS[ziel][0] === S.tab) navDrehen();
    else setzeReiter(TABS[ziel][0], richtung);
    // gezogen bleibt gesetzt, bis der Klick danach abgefangen wurde
    setTimeout(()=>{ gezogen = false; }, 0);
  }

  nav.addEventListener("touchstart", e=>{
    if(e.touches.length === 1) beginn(e.touches[0].clientX);
  }, {passive:true});
  nav.addEventListener("touchmove", e=>{
    if(e.touches.length !== 1) return;
    if(bewegung(e.touches[0].clientX) && e.cancelable) e.preventDefault();
  }, {passive:false});
  nav.addEventListener("touchend", ende);
  nav.addEventListener("touchcancel", ende);

  // Am Rechner dasselbe mit der Maus
  nav.addEventListener("mousedown", e=>{ if(e.button === 0) beginn(e.clientX); });
  addEventListener("mousemove", e=>{ bewegung(e.clientX); });
  addEventListener("mouseup", ende);

  // Nach einem Zug darf das abschließende Klick-Ereignis nicht zusätzlich
  // eine Rubrik auswählen - sonst springt es zweimal.
  nav.addEventListener("click", e=>{
    if(gezogen){ e.stopPropagation(); e.preventDefault(); gezogen = false; }
  }, true);
})();

// Zurückwischen aus einem Extra-Bildschirm führt ebenfalls zur Startseite

// Profil und Tagesserie sind zwei eigenständige Bildschirme. Beide werden
// nur von der Startseite aus geöffnet, und der Pfeil führt aus beiden
// zurück zur Startseite - nicht zum jeweils anderen.
const EXTRA_BILDSCHIRME = ["profil","mehr","streak","ausblick","stresstrend",
                           "atemuebung","schlaftrend", "schlafplaner","schlafziel",
                           "planansicht","planbearbeiten","plandetails","planpicker",
                           "planziel","logbuchanpassen","einblicke","verhaltendetail"];

};

/* ---------- Wischen: eine Bewegung = eine Rubrik ---------- */
// Beruehrungen in waagerecht scrollbaren Bereichen (Reiterleiste, Rohdaten-
// Tabelle) sind kein Rubrikwechsel - dort will man den Inhalt schieben.
let wx=0, wy=0, wischt=false, wZeit=0;
// Die Reiterleiste hat ihre eigene Zieh-Geste - ein Wisch, der dort
// beginnt, darf nicht zusätzlich eine Rubrik weiterschalten.
const HORIZONTAL = "nav.scheibe, .scroll, table";

document.addEventListener("touchstart", e=>{
  if(e.touches.length!==1 || e.target.closest(HORIZONTAL)){ wischt=false; return; }
  wx = e.touches[0].clientX; wy = e.touches[0].clientY;
  wZeit = Date.now(); wischt = true;
}, {passive:true});

document.addEventListener("touchend", e=>{
  if(!wischt) return;
  wischt = false;
  const dx = e.changedTouches[0].clientX - wx;
  const dy = e.changedTouches[0].clientY - wy;
  const dauer = Date.now() - wZeit;

  // Mindestweg, klar waagerecht, und nicht ewig gedauert (sonst war es
  // eher ein Scrollversuch als eine Wischgeste).
  if(Math.abs(dx) < 55) return;
  if(Math.abs(dx) < Math.abs(dy) * 1.6) return;
  if(dauer > 800) return;

  const i = TABS.findIndex(t => t[0] === S.tab);
  if(i < 0){
    // Auf einem Extra-Bildschirm führt Wischen nach rechts eine Seite zurück
    if(dx > 0) zurueck();
    return;
  }
  const ziel = i + (dx < 0 ? 1 : -1);
  if(ziel < 0 || ziel >= TABS.length) return;
  setzeReiter(TABS[ziel][0], dx < 0 ? 1 : -1);
}, {passive:true});

// Am Rechner dasselbe mit den Pfeiltasten
document.addEventListener("keydown", e=>{
  if(e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
  if(e.target.matches("input,textarea,select")) return;
  const i = TABS.findIndex(t => t[0] === S.tab);
  const ziel = i + (e.key==="ArrowRight" ? 1 : -1);
  if(ziel < 0 || ziel >= TABS.length) return;
  setzeReiter(TABS[ziel][0], e.key==="ArrowRight" ? 1 : -1);
});

document.addEventListener("mousemove", e=>{
  const el = e.target.closest("[data-tip]");
  if(!el){ tip.style.opacity=0; return; }
  tip.textContent = el.dataset.tip;
  tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(innerWidth-r.width-8, Math.max(8, e.clientX-r.width/2))+"px";
  tip.style.top = Math.max(8, e.clientY-r.height-12)+"px";
});
document.addEventListener("mouseleave", ()=>{ tip.style.opacity=0; });

navAufbauen();
render();
