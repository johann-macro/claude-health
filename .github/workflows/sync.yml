# Automatischer Abgleich: holt die Messwerte von Google, rechnet die
# Kennzahlen und schreibt sie nach Firestore.
#
# Voraussetzung: zwei Geheimnisse im Repository
# (Settings > Secrets and variables > Actions > New repository secret):
#
#   GOOGLE_TOKEN           <- kompletter Inhalt von .secrets/token.json
#   FIREBASE_DIENSTKONTO   <- kompletter Inhalt von .secrets/firebase-dienstkonto.json
#
# Beide sind echte Geheimnisse. GitHub zeigt sie nach dem Speichern nie wieder
# an und blendet sie in Protokollen aus.

name: Abgleich

on:
  schedule:
    # Schnell: alle 5 Minuten (kuerzester Takt, den GitHub erlaubt). Fragt
    # erst nur, ob die Uhr Neues hochgeladen hat - dann rund 3 Sekunden.
    # Gerechnet wird nur bei einem neuen Upload, und dann nur heute.
    - cron: "*/5 * * * *"
    # Gruendlich: alle 3 Stunden drei Tage, fuer Nachlieferungen von Google.
    - cron: "40 */3 * * *"
  workflow_dispatch:        # erlaubt das Ausloesen von Hand

permissions:
  contents: read

# Zwei Laeufe gleichzeitig wuerden dieselben Tage doppelt schreiben
concurrency:
  group: abgleich
  cancel-in-progress: false

jobs:
  abgleich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten
        run: pip install -q -r requirements.txt

      - name: Daten holen und rechnen
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          FIREBASE_DIENSTKONTO: ${{ secrets.FIREBASE_DIENSTKONTO }}
        # Gruendlich drei Tage: neu dazugekommene Werte werden oft Stunden spaeter
        # nachgeliefert, und der Schlaf der letzten Nacht braucht den Vortag.
        run: |
          if [ "${{ github.event.schedule }}" = "*/5 * * * *" ]; then
            python sync.py --schnell
          else
            python sync.py 3
          fi

      # health/data.json entsteht beim Lauf und enthaelt Gesundheitsdaten.
      # Es wird bewusst NICHT hochgeladen - die Daten stehen in Firestore.
      - name: Aufraeumen
        if: always()
        run: rm -rf health
